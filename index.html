      const ws = careerPcSeries('red-r2').map(sr=>careerSerieWinner(sr.legs)).filter(Boolean);
      const orden = careerPcOrdenar([pc.redBye].concat(ws).filter(Boolean), general);
      const base = careerMaxDate(careerPcStageMatches('red-r2'));
      careerBuildSeries(pc.matches, 'primerac', 'red-semis', careerSeedPairs(orden), addDaysISO(base,7), addDaysISO(base,14), { noAdvantage:true });
      return true;
    }
    if(careerPcStageDone('red-semis') && !careerPcHasStage('red-final')){
      const ws = careerPcOrdenar(careerPcSeries('red-semis').map(sr=>careerSerieWinner(sr.legs)).filter(Boolean), general);
      const base = careerMaxDate(careerPcStageMatches('red-semis'));
      if(ws.length >= 2){
        careerBuildSeries(pc.matches, 'primerac', 'red-final', [{ better: ws[0], worse: ws[1] }], addDaysISO(base,7), addDaysISO(base,14), { noAdvantage:true });
        return true;
      }
    }
    const redFinal = careerPcSeries('red-final')[0];
    if(redFinal){
      const w = careerSerieWinner(redFinal.legs);
      if(w && !pc.promoted.includes(w)){ pc.promoted.push(w); did = true; }
    }
    return did;
  }

  // ==================== QUINTA DIVISIÓN — TORNEO PROMOCIONAL AMATEUR ====================
  // 17 equipos en dos zonas. Se juegan un Apertura y un Clausura: el campeón del Apertura
  // asciende directo a la Primera C y el del Clausura se gana una promoción.

  const PROMO_STAGE_LABELS = {
    'final-apertura': 'Final del Apertura (ascenso directo)',
    'final-clausura': 'Final del Clausura',
    'promocion': 'Promoción contra la Primera C'
  };
  const PROMO_STAGE_ORDER = ['final-apertura','final-clausura','promocion'];
  const PROMO_ZONE_LEGEND = [{ id:'final', label:'Clasifica a la final', from:1, to:1, color:'#C9A227' }];

  function careerPromocional(){
    const c = state.career;
    if(!c.promocional) c.promocional = defaultPromocional();
    return c.promocional;
  }
  function careerPromoTeamsFromDb(){
    const pr = careerPromocional();
    pr.teams = [];
    let i = 0;
    const push = (t, zone) => pr.teams.push({ id:'pr'+(i++)+'_'+Math.random().toString(36).slice(2,7), name:t.name, elo:t.elo, zone });
    CAREER_TEAM_DB.promocional.zoneA.forEach(t=>push(t,0));
    CAREER_TEAM_DB.promocional.zoneB.forEach(t=>push(t,1));
  }
  function careerPromoZoneIds(z){ return careerPromocional().teams.filter(t=>t.zone===z).map(t=>t.id); }
  function careerPromoRegular(phase){ return careerPromocional().matches.filter(m=>!m.stage && m.phase===phase); }
  function careerPromoStandings(phase, z){
    return careerComputeStandingsFrom(careerPromoRegular(phase), careerPromoZoneIds(z));
  }
  function careerPromoStageMatches(stage){ return careerPromocional().matches.filter(m=>m.stage===stage); }
  function careerPromoHasStage(stage){ return careerPromoStageMatches(stage).length > 0; }

  function careerGeneratePromocional(){
    const c = state.career;
    const pr = careerPromocional();
    if(pr.teams.length === 0) careerPromoTeamsFromDb();
    pr.matches = [];
    pr.aperturaChampion = null; pr.clausuraChampion = null;
    pr.promoted = []; pr.promocionWinner = null;
    pr.generatedYear = c.year;

    // El Promocional juega los martes.
    const start = firstWeekdayOfMonth(c.year, 1, 2);
    const zA = careerPromoZoneIds(0), zB = careerPromoZoneIds(1);
    if(zA.length < 2 || zB.length < 2) return;
    const rr = [roundRobinRounds(zA), roundRobinRounds(zB)];
    const nR = Math.max(rr[0].length, rr[1].length);

    const armar = (phase, base) => {
      [0,1].forEach(zi => {
        rr[zi].forEach((round, ri) => {
          round.forEach(mm => pr.matches.push(careerMkMatch('promocional', zi, ri+1, mm.home, mm.away, {phase, date: addDaysISO(base, ri*7)})));
        });
        rr[zi].forEach((round, ri) => {
          const rn = rr[zi].length + ri + 1;
          round.forEach(mm => pr.matches.push(careerMkMatch('promocional', zi, rn, mm.away, mm.home, {phase, date: addDaysISO(base, (rr[zi].length+ri)*7)})));
        });
      });
    };
    armar('apertura', start);
    // El Clausura arranca tres semanas después de la última fecha del Apertura
    armar('clausura', addDaysISO(start, (2*nR + 2) * 7));
  }

  function careerPromocionalAutoAdvance(){
    const pr = careerPromocional();
    const pc = careerPrimeraC();
    if(!pr.teams || pr.teams.length < 4) return false;
    let did = false;

    [['apertura','final-apertura'], ['clausura','final-clausura']].forEach(([phase, stage]) => {
      const reg = careerPromoRegular(phase);
      if(reg.length === 0 || !reg.every(m=>m.played)) return;
      if(careerPromoHasStage(stage)) return;
      const stA = careerPromoStandings(phase, 0), stB = careerPromoStandings(phase, 1);
      if(!stA.length || !stB.length) return;
      const base = careerMaxDate(reg);
      // Final a partido único en cancha neutral: si hay empate, penales.
      pr.matches.push(careerMkMatch('promocional', null, 1, stA[0].id, stB[0].id, {stage, neutral:true, date: addDaysISO(base,7)}));
      did = true;
    });

    const fa = careerPromoStageMatches('final-apertura')[0];
    if(fa && fa.played && !pr.aperturaChampion){
      const w = careerMatchWinner(fa);
      if(w){
        pr.aperturaChampion = w;
        if(!pr.promoted.includes(w)) pr.promoted.push(w);
        careerRecordTitle('promocional-apertura', w);
        did = true;
      }
    }
    const fc = careerPromoStageMatches('final-clausura')[0];
    if(fc && fc.played && !pr.clausuraChampion){
      const w = careerMatchWinner(fc);
      if(w){
        pr.clausuraChampion = w;
        careerRecordTitle('promocional-clausura', w);
        did = true;
      }
    }

    // Promoción: el campeón del Clausura contra el ganador de la permanencia de la Primera C.
    if(pr.clausuraChampion && pc.permanenciaWinner && !careerPromoHasStage('promocion')){
      if(pr.clausuraChampion !== pr.aperturaChampion){
        const base = careerMaxDate(careerPromoStageMatches('final-clausura').concat(careerPcStageMatches('permanencia')));
        pr.matches.push(careerMkMatch('promocional', null, 1, pc.permanenciaWinner, pr.clausuraChampion, {stage:'promocion', date: addDaysISO(base,7)}));
        return true;
      }
    }
    const pm = careerPromoStageMatches('promocion')[0];
    if(pm && pm.played && !pr.promocionWinner){
      const w = careerMatchWinner(pm);
      if(w){ pr.promocionWinner = w; did = true; }
    }
    return did;
  }

  // ---- Vistas ----
  function renderCareraPrimeraC(){
    const c = state.career;
    careerEnsureDivisions();
    careerTryAutoAdvanceStages();
    const pc = careerPrimeraC();

    let html = `<div class="panel">
      <h2>Primera C Metropolitana ${c.year}</h2>
      <p class="hint">28 equipos en dos zonas de 14. Todos contra todos dentro de la zona a dos ruedas más tres cruces interzonales por rueda: 32 fechas. Los dos punteros se enfrentan en una final por el campeonato y el primer ascenso a la B Metropolitana; el perdedor entra directo a las semifinales del reducido. Los dos últimos juegan un partido por la permanencia y el que pierde queda desafiliado.</p>
    </div>`;

    html += renderDivisionFixture('career-primerac', careerPcRegular(), 'primerac-round');

    html += `<div class="group-block"><h3>Zona A</h3>${renderStandingsTable(careerPcStandings(0), false, PC_ZONE_LEGEND, careerTeamById)}</div>`;
    html += `<div class="group-block"><h3>Zona B</h3>${renderStandingsTable(careerPcStandings(1), false, PC_ZONE_LEGEND, careerTeamById)}</div>`;

    if(PC_STAGE_ORDER.some(st => careerPcHasStage(st))){
      html += `<div class="panel"><h2>Definición</h2>`;
      PC_STAGE_ORDER.forEach(stage => {
        const ms = careerPcStageMatches(stage);
        if(!ms.length) return;
        html += `<div class="round-header"><h3>${PC_STAGE_LABELS[stage]}</h3></div>`;
        if(stage === 'permanencia') html += ms.map(m=>renderCareerMatchRow(m, null)).join('');
        else careerSeriesOfList(ms).forEach(sr => { html += renderSerieBlock(sr); });
        if(stage === 'red-r2' && pc.redBye){
          html += `<p class="hint" style="margin:-4px 0 16px;">${careerNombre(pc.redBye)} pasa de instancia sin jugar por ser el mejor ubicado de los siete.</p>`;
        }
        if(ms.some(m=>!m.played)){
          html += `<div class="btn-row"><button class="btn small" data-action="career-simulate-round" data-scope="primerac-stage" data-stage="${stage}">Simular</button></div>`;
        }
      });
      html += `</div>`;
    }

    if(pc.champion || (pc.promoted && pc.promoted.length) || pc.desafiliado){
      let resumen = '';
      if(pc.champion) resumen += `<div class="msg" style="background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.4);color:var(--gold-bright);">&#127942; Campeón de la Primera C ${c.year}: <strong>${careerNombre(pc.champion)}</strong></div>`;
      if(pc.promoted && pc.promoted.length) resumen += `<p class="hint">Ascienden a la B Metropolitana: <strong style="color:var(--ink);">${pc.promoted.map(careerNombre).join(', ')}</strong>${pc.promoted.length<2?' (falta el ganador del reducido)':''}</p>`;
      if(pc.permanenciaWinner) resumen += `<p class="hint">Mantiene la categoría y juega la promoción: <strong style="color:var(--ink);">${careerNombre(pc.permanenciaWinner)}</strong></p>`;
      if(pc.desafiliado) resumen += `<p class="hint">Queda desafiliado: <strong style="color:var(--ink);">${careerNombre(pc.desafiliado)}</strong></p>`;
      html += `<div class="panel"><h2>Temporada ${c.year}</h2>${resumen}</div>`;
    }
    return html;
  }

  function renderCareraPromocional(){
    const c = state.career;
    careerEnsureDivisions();
    careerTryAutoAdvanceStages();
    const pr = careerPromocional();

    let html = `<div class="panel">
      <h2>Torneo Promocional Amateur ${c.year}</h2>
      <p class="hint">17 equipos en dos zonas (8 y 9). Se juegan un Apertura y un Clausura, cada uno todos contra todos ida y vuelta. El campeón del Apertura asciende directo a la Primera C. El del Clausura no asciende: se gana el derecho a jugar una promoción contra el equipo que ganó el partido por la permanencia de la Primera C.</p>
    </div>`;

    [['apertura','Apertura'], ['clausura','Clausura']].forEach(([phase, titulo]) => {
      const reg = careerPromoRegular(phase);
      if(!reg.length) return;
      html += `<div class="panel"><h2>${titulo}</h2></div>`;
      html += renderDivisionFixture('career-promo-'+phase, reg, 'promocional-round', ` data-phase="${phase}"`);
      html += `<div class="group-block"><h3>${titulo} &middot; Zona A</h3>${renderStandingsTable(careerPromoStandings(phase,0), false, PROMO_ZONE_LEGEND, careerTeamById)}</div>`;
      html += `<div class="group-block"><h3>${titulo} &middot; Zona B</h3>${renderStandingsTable(careerPromoStandings(phase,1), false, PROMO_ZONE_LEGEND, careerTeamById)}</div>`;
    });

    if(PROMO_STAGE_ORDER.some(st => careerPromoHasStage(st))){
      html += `<div class="panel"><h2>Definiciones</h2>`;
      PROMO_STAGE_ORDER.forEach(stage => {
        const ms = careerPromoStageMatches(stage);
        if(!ms.length) return;
        html += `<div class="round-header"><h3>${PROMO_STAGE_LABELS[stage]}</h3></div>`;
        html += ms.map(m=>renderCareerMatchRow(m, null)).join('');
        if(ms.some(m=>!m.played)){
          html += `<div class="btn-row"><button class="btn small" data-action="career-simulate-round" data-scope="promocional-stage" data-stage="${stage}">Simular</button></div>`;
        }
      });
      html += `</div>`;
    }

    if(pr.aperturaChampion || pr.clausuraChampion){
      let resumen = '';
      if(pr.aperturaChampion) resumen += `<div class="msg" style="background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.4);color:var(--gold-bright);">&#127942; Campeón del Apertura ${c.year}: <strong>${careerNombre(pr.aperturaChampion)}</strong> &mdash; asciende a la Primera C.</div>`;
      if(pr.clausuraChampion) resumen += `<p class="hint">Campeón del Clausura: <strong style="color:var(--ink);">${careerNombre(pr.clausuraChampion)}</strong> &mdash; juega la promoción.</p>`;
      if(pr.promocionWinner){
        const subio = pr.promocionWinner === pr.clausuraChampion;
        resumen += `<p class="hint">Promoción: ganó <strong style="color:var(--ink);">${careerNombre(pr.promocionWinner)}</strong>. ${subio ? 'Asciende a la Primera C y el equipo de la C baja al Promocional.' : 'El equipo de la Primera C mantiene la categoría y el del Promocional también.'}</p>`;
      }
      html += `<div class="panel"><h2>Temporada ${c.year}</h2>${resumen}</div>`;
    }
    return html;
  }

  // ---------- Copa Argentina ----------
  function careerBuildCopaArgentina(){
    const c = state.career;
    const db = CAREER_TEAM_DB;
    function topN(list, n){ return list.slice().sort((a,b)=>b.elo-a.elo).slice(0,n); }
    let idc = 0;
    const mkOther = (t, division) => ({ id:'oc'+(idc++)+'_'+Math.random().toString(36).slice(2,7), name:t.name, elo:t.elo, division });
    const primeraTop28 = topN(c.teams, 28).map(t=>({ id:t.id, name:t.name, elo:t.elo, division:'primera' }));
    const nacionalAll = db.nacional.zoneA.concat(db.nacional.zoneB);
    const federalAll = db.federalA.zoneA.concat(db.federalA.zoneB, db.federalA.zoneC, db.federalA.zoneD);
    const bmetroAll = db.bmetro;
    const cAll = db.primeraC.zoneA.concat(db.primeraC.zoneB);
    const real = (list, n, division) => (list && list.length)
      ? topN(list, n).map(t=>({ id:t.id, name:t.name, elo:t.elo, division }))
      : null;
    const nacionalReal = real(c.nacional && c.nacional.teams, 15, 'nacional');
    const federalReal = real(c.federal && c.federal.teams, 10, 'federalA');
    const bmetroReal = real(c.bmetro && c.bmetro.teams, 6, 'bmetro');
    const otherTeams = [
      ...(nacionalReal ? [] : topN(nacionalAll,15).map(t=>mkOther(t,'nacional'))),
      ...(federalReal ? [] : topN(federalAll,10).map(t=>mkOther(t,'federalA'))),
      ...(bmetroReal ? [] : topN(bmetroAll,6).map(t=>mkOther(t,'bmetro'))),
      ...topN(cAll,5).map(t=>mkOther(t,'primeraC'))
    ];
    const pool = primeraTop28.concat(nacionalReal || [], federalReal || [], bmetroReal || [], otherTeams);
    // La Copa Argentina se define por sorteo, no por el ranking de ELO: los cruces tienen que
    // salir distintos cada temporada, así que el orden del cuadro se mezcla al azar. El sorteo
    // queda armado (el resultado ya está decidido) pero se revela cruce por cruce con
    // careerCopaArgentinaRevealNext, para que se pueda "hacer a mano" en vez de verse de una.
    const seeded = shuffleArr(pool.map(t=>t.id));
    const pairs = buildFirstKnockoutRound(seeded);
    const date = nextWeekdayAfter(state.career.calendarDate || careerSeasonStart(state.career.year, state.career.tournament), 3);
    c.copaArgentina = { otherTeams, matches: [], built: false, champion: null, draw: { pairs, revealed: 0, date } };
  }
  function careerCopaArgentinaRevealNext(){
    const c = state.career;
    const ca = c.copaArgentina;
    if(!ca || !ca.draw) return;
    const draw = ca.draw;
    if(draw.revealed >= draw.pairs.length) return;
    const p = draw.pairs[draw.revealed];
    ca.matches.push(careerMkMatch('copa-argentina', null, 1, p.home, p.away, {stage:'treintaidosavos', neutral:true, date: draw.date}));
    draw.revealed++;
    if(draw.revealed >= draw.pairs.length) ca.built = true;
  }

  function careerAdvanceCopaArgentina(fromStage){
    const c = state.career.copaArgentina;
    const stages = COPA_ARG_STAGES;
    const nextStage = stages[stages.indexOf(fromStage)+1];
    if(!nextStage) return;
    const matches = c.matches.filter(m=>m.stage===fromStage);
    const winners = matches.map(m=>careerMatchWinner(m));
    const fromDate = (matches.length && matches[0].date) ? matches[0].date : state.career.calendarDate;
    const date = addDaysISO(fromDate, 14);
    const pairs = [];
    for(let i=0;i<winners.length;i+=2) pairs.push({ home: winners[i], away: winners[i+1] });
    const round = stages.indexOf(nextStage)+1;
    pairs.forEach(p => c.matches.push(careerMkMatch('copa-argentina', null, round, p.home, p.away, {stage:nextStage, neutral:true, date})));
  }

  // ---------- Trofeo de Campeones / Supercopas ----------
  function careerMaybeBuildTrofeo(){
    const c = state.career;
    if(!c.cupMatches) c.cupMatches = [];
    if(careerGetTitle(c.year,'trofeo-campeones')) return;
    if(c.cupMatches.find(m=>m.comp==='trofeo-campeones' && m.year===c.year)) return;
    const aptChamp = careerGetTitle(c.year,'apertura');
    const clzChamp = careerGetTitle(c.year,'clausura');
    if(!aptChamp || !clzChamp) return;
    if(aptChamp === clzChamp){ careerRecordTitle('trofeo-campeones', aptChamp); return; }
    const date = nextWeekdayAfter(c.calendarDate, 3);
    c.cupMatches.push(careerMkMatch('trofeo-campeones', null, 1, aptChamp, clzChamp, {stage:'final', neutral:true, year:c.year, date}));
  }
  function careerMaybeBuildSupercopaArgentina(){
    const c = state.career;
    if(!c.cupMatches) c.cupMatches = [];
    if(careerGetTitle(c.year,'supercopa-argentina')) return;
    if(c.cupMatches.find(m=>m.comp==='supercopa-argentina' && m.year===c.year)) return;
    const trofeoChamp = careerGetTitle(c.year,'trofeo-campeones');
    const copaChamp = (c.copaArgentina && c.copaArgentina.champion && c.copaArgentina.champion.year===c.year) ? c.copaArgentina.champion.teamId : null;
    if(!trofeoChamp || !copaChamp) return;
    if(trofeoChamp === copaChamp){ careerRecordTitle('supercopa-argentina', trofeoChamp); return; }
    const date = nextWeekdayAfter(c.calendarDate, 3);
    c.cupMatches.push(careerMkMatch('supercopa-argentina', null, 1, trofeoChamp, copaChamp, {stage:'final', neutral:true, year:c.year, date}));
  }
  function careerMaybeBuildSupercopaInternacional(){
    const c = state.career;
    if(!c.cupMatches) c.cupMatches = [];
    if(careerGetTitle(c.year,'supercopa-internacional')) return;
    if(c.cupMatches.find(m=>m.comp==='supercopa-internacional' && m.year===c.year)) return;
    const trofeoChamp = careerGetTitle(c.year,'trofeo-campeones');
    const clausuraChamp = careerGetTitle(c.year,'clausura');
    if(!trofeoChamp || !clausuraChamp) return; // esperamos a que termine la temporada para la Tabla Anual definitiva
    const annual = careerAnnualTable();
    if(!annual.length) return;
    let rival = annual[0].id;
    if(rival === trofeoChamp) rival = annual[1] ? annual[1].id : null;
    if(!rival) return;
    if(trofeoChamp === rival){ careerRecordTitle('supercopa-internacional', trofeoChamp); return; }
    const date = nextWeekdayAfter(c.calendarDate, 3);
    c.cupMatches.push(careerMkMatch('supercopa-internacional', null, 1, trofeoChamp, rival, {stage:'final', neutral:true, year:c.year, date}));
  }

  function careerArchiveTournament(){
    const c = state.career;
    if(!c.history) c.history = [];
    c.history.push({
      year: c.year, tournament: c.tournament,
      matches: JSON.parse(JSON.stringify(c.matches)),
      knockout: JSON.parse(JSON.stringify(c.knockout)),
      champion: c.champion
    });
  }
  function careerStartClausura(){
    careerArchiveTournament();
    state.career.tournament = 'clausura';
    careerGenerateTournament();
  }
  function careerStartNextApertura(){
    const c = state.career;
    const annual = careerAnnualTable();
    if(!c.seasonLog) c.seasonLog = {};
    annual.forEach(r => {
      if(!c.seasonLog[r.id]) c.seasonLog[r.id] = [];
      c.seasonLog[r.id].push({ year: c.year, pts: r.pts, pj: r.pj });
      if(c.seasonLog[r.id].length > 3) c.seasonLog[r.id].shift();
    });
    careerArchiveTournament();
    careerApplyPromotionsRelegations();
    c.year += 1;
    c.tournament = 'apertura';
    careerGenerateBmetro();
    careerGenerateFederal();
    careerGeneratePrimeraC();
    careerGeneratePromocional();
    careerBeginSeasonDraws();
  }

  // ---------- Sorteos de arranque de temporada ----------
  // Antes de armar el fixture de cada año, hay que sortear las zonas de la Primera División
  // y de la Primera Nacional, y el cuadro de la Copa Argentina. Los tres sorteos se hacen "a
  // mano" (revelando de a uno) y hasta que no están los tres completos no arranca la temporada.
  function careerBeginSeasonDraws(){
    const c = state.career;
    c.matches = []; c.knockout = []; c.knockoutBuilt = false; c.champion = null; c.calendarDate = null;
    c.teams.forEach(t=>{ t.zone = null; });
    const n = careerNacional();
    n.matches = []; n.champion = null;
    n.teams.forEach(t=>{ t.zone = null; });
    c.seasonDraws = {
      year: c.year,
      primera: { order: shuffleArr(c.teams.map(t=>t.id)), revealed: 0 },
      nacional: { order: shuffleArr(n.teams.map(t=>t.id)), revealed: 0 }
    };
    c.copaArgentina = { otherTeams: [], matches: [], built: false, champion: null, draw: null };
    c.view = 'sorteos';
  }
  function careerZoneDrawReveal(kind){
    const c = state.career;
    const draw = c.seasonDraws && c.seasonDraws[kind];
    if(!draw || draw.revealed >= draw.order.length) return;
    const id = draw.order[draw.revealed];
    const zone = draw.revealed % 2 === 0 ? 0 : 1;
    const teamsArr = kind === 'primera' ? c.teams : careerNacional().teams;
    const team = teamsArr.find(t=>t.id===id);
    if(team) team.zone = zone;
    draw.revealed++;
  }
  function careerSeasonDrawsComplete(){
    const c = state.career;
    const sd = c.seasonDraws;
    if(!sd) return false;
    const zonesDone = sd.primera.revealed >= sd.primera.order.length && sd.nacional.revealed >= sd.nacional.order.length;
    const copaDone = !!(c.copaArgentina && c.copaArgentina.built);
    return zonesDone && copaDone;
  }
  function careerFinishSeasonDraws(){
    const c = state.career;
    if(!careerSeasonDrawsComplete()) return;
    careerGenerateTournament();
    c.seasonDraws = null;
    c.view = 'calendario';
  }

  function ensureCareerRoundPointer(ctx, total){
    if(!state.career.fixtureNav) state.career.fixtureNav = {};
    let cur = state.career.fixtureNav[ctx];
    if(!cur || cur < 1) cur = 1;
    if(total > 0 && cur > total) cur = total;
    state.career.fixtureNav[ctx] = cur;
    return cur;
  }

  function careerFindMatch(id){
    const c = state.career;
    return c.matches.find(m=>m.id===id)
      || c.knockout.find(m=>m.id===id)
      || (c.copaArgentina && c.copaArgentina.matches.find(m=>m.id===id))
      || (c.cupMatches && c.cupMatches.find(m=>m.id===id))
      || (c.nacional && c.nacional.matches.find(m=>m.id===id))
      || (c.bmetro && c.bmetro.matches.find(m=>m.id===id))
      || (c.federal && c.federal.matches.find(m=>m.id===id))
      || (c.primerac && c.primerac.matches.find(m=>m.id===id))
      || (c.promocional && c.promocional.matches.find(m=>m.id===id))
      || (c.libertadores && c.libertadores.matches.find(m=>m.id===id))
      || (c.sudamericana && c.sudamericana.matches.find(m=>m.id===id));
  }

  function careerMatchProbLabel(m){
    const home = careerTeamById(m.home), away = careerTeamById(m.away);
    if(!home || !away) return '';
    return Math.round(careerMatchAdjustedProb(m)*100) + '%';

  function renderCareerMatchRow(m, meta){
    meta = meta || null;
    if(m.bye){
      const survivor = m.home !== null ? careerTeamById(m.home) : careerTeamById(m.away);
      return `<div class="match played">
        <div class="side">${survivor ? escapeHtml(survivor.name) : '&mdash;'}</div>
        <div></div><div class="bye-note">pase libre</div><div></div>
        <div class="side away"></div>
      </div>`;
    }
    const home = careerTeamById(m.home), away = careerTeamById(m.away);
    if(!home || !away) return '';
    const winnerId = (m.stage && !m.leg) ? careerMatchWinner(m) : null;
    const winnerHome = m.played && (m.stage ? winnerId===m.home : m.homeScore > m.awayScore);
    const winnerAway = m.played && (m.stage ? winnerId===m.away : m.awayScore > m.homeScore);
    const penTag = m.wentToPenalties ? ` <span style="color:var(--gold-bright);font-size:11px;">(pen.)</span>` : '';
    return `<div class="match ${m.played?'played':''}" data-match="${m.id}">
      <div class="side ${winnerHome?'winner':''}">${escapeHtml(home.name)}<span class="elo-tag num">${home.elo}${m.played && m.deltaHome!==undefined ? ` <span class="delta ${m.deltaHome>0?'pos':(m.deltaHome<0?'neg':'')}">${m.deltaHome>=0?'+':''}${m.deltaHome}</span>`:''}</span>${renderPosForm(m.home, meta)}</div>
      <input type="number" min="0" class="score-input" data-role="home-score" value="${m.homeScore ?? ''}" ${m.played?'disabled':''}>
      <div class="vs">${m.played ? '&ndash;'+penTag : careerMatchProbLabel(m)}</div>
      <input type="number" min="0" class="score-input" data-role="away-score" value="${m.awayScore ?? ''}" ${m.played?'disabled':''}>
      <div class="side away ${winnerAway?'winner':''}">${escapeHtml(away.name)}<span class="elo-tag num">${away.elo}${m.played && m.deltaAway!==undefined ? ` <span class="delta ${m.deltaAway>0?'pos':(m.deltaAway<0?'neg':'')}">${m.deltaAway>=0?'+':''}${m.deltaAway}</span>`:''}</span>${renderPosForm(m.away, meta)}</div>
      <div class="match-actions" style="grid-column:1/-1;justify-content:flex-end;">
        ${!m.played ? `<button class="btn small" data-action="career-simulate-match" data-id="${m.id}">Simular</button>
        <button class="btn small primary" data-action="career-confirm-match" data-id="${m.id}">Confirmar resultado</button>` : ''}
      </div>
    </div>`;
  }

  function renderZoneDrawPanel(kind, label, teamsArr){

  // ---------- Escudos de equipos (imágenes que sube el usuario) ----------
  // Cada escudo se guarda en IndexedDB (no en localStorage: las carreras ya ocupan bastante lugar y
  // las imágenes necesitan más), una por nombre de equipo normalizado (sin tildes, mayúsculas ni
  // símbolos), así el mismo escudo sirve en todas las carreras y en cualquier competición donde
  // aparezca el equipo. Las imágenes se achican a 128 px como máximo al subirlas. En memoria se
  // guarda una URL de tipo blob: por equipo, así teamBadgeHtml (que es síncrono) la usa directo.
  const CREST_DB = 'torneos-elo-escudos', CREST_STORE = 'escudos', CREST_MAX = 128;
  const crestUrls = {}, crestBlobs = {};
  const crestUi = { query:'', group:'', msg:null };
  let crestDbPromise = null, crestPersistOk = true;
  function crestKey(name){
    return String(name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '');
  }
  function crestOpenDb(){
    if(crestDbPromise) return crestDbPromise;
    crestDbPromise = new Promise(resolve => {
      try{
        if(typeof indexedDB === 'undefined'){ crestPersistOk = false; resolve(null); return; }
        const req = indexedDB.open(CREST_DB, 1);
        req.onupgradeneeded = () => { req.result.createObjectStore(CREST_STORE); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => { crestPersistOk = false; resolve(null); };
      }catch(e){ crestPersistOk = false; resolve(null); }
    });
    return crestDbPromise;
  }
  function crestSetInMemory(key, blob){
    if(crestUrls[key]){ try{ URL.revokeObjectURL(crestUrls[key]); }catch(e){} }
    crestBlobs[key] = blob;
    crestUrls[key] = URL.createObjectURL(blob);
  }
  function crestDropInMemory(key){
    if(crestUrls[key]){ try{ URL.revokeObjectURL(crestUrls[key]); }catch(e){} }
    delete crestUrls[key]; delete crestBlobs[key];
  }
  async function crestLoadAll(){
    const db = await crestOpenDb();
    if(!db) return;
    await new Promise(resolve => {
      try{
        const rq = db.transaction(CREST_STORE, 'readonly').objectStore(CREST_STORE).openCursor();
        rq.onsuccess = () => {
          const cur = rq.result;
          if(cur){ if(cur.value instanceof Blob) crestSetInMemory(cur.key, cur.value); cur.continue(); }
          else resolve();
        };
        rq.onerror = () => resolve();
      }catch(e){ resolve(); }
    });
  }
  // Devuelven true si quedó guardado de forma permanente.
  async function crestPut(key, blob){
    crestSetInMemory(key, blob);
    const db = await crestOpenDb();
    if(!db) return false;
    return new Promise(resolve => {
      try{
        const tx = db.transaction(CREST_STORE, 'readwrite');
        tx.objectStore(CREST_STORE).put(blob, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      }catch(e){ resolve(false); }
    });
  }
  async function crestDelete(key){
    crestDropInMemory(key);
    const db = await crestOpenDb();
    if(!db) return false;
    return new Promise(resolve => {
      try{
        const tx = db.transaction(CREST_STORE, 'readwrite');
        tx.objectStore(CREST_STORE).delete(key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      }catch(e){ resolve(false); }
    });
  }
  async function crestClearAll(){
    Object.keys(crestUrls).forEach(crestDropInMemory);
    const db = await crestOpenDb();
    if(!db) return false;
    return new Promise(resolve => {
      try{
        const tx = db.transaction(CREST_STORE, 'readwrite');
        tx.objectStore(CREST_STORE).clear();
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      }catch(e){ resolve(false); }
    });
  }
  // Lee la imagen elegida, la achica (sin deformarla ni agrandarla) y devuelve un Blob.
  function crestProcessFile(file){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try{
          let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          if(!w || !h){ w = CREST_MAX; h = CREST_MAX; } // SVG sin medidas propias
          const scale = Math.min(1, CREST_MAX / Math.max(w, h));
          const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
          const cv = document.createElement('canvas');
          cv.width = cw; cv.height = ch;
          const ctx = cv.getContext('2d');
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, cw, ch);
          // WebP conserva la transparencia y pesa poco; donde no se pueda codificar (Safari) sale PNG.
          cv.toBlob(b => {
            URL.revokeObjectURL(url);
            if(b) resolve(b); else reject(new Error('sin imagen'));
          }, 'image/webp', 0.92);
        }catch(err){ URL.revokeObjectURL(url); reject(err); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('imagen ilegible')); };
      img.src = url;
    });
  }
  // Todos los equipos que hay en el juego, agrupados, sin repetir (el mismo nombre = el mismo escudo).
  function crestCollectTeams(){
    const c = state.career;
    const groups = [], seen = new Set();
    function add(label, teams){
      const list = [];
      (teams || []).forEach(t => {
        if(!t || !t.name) return;
        const k = crestKey(t.name);
        if(!k || seen.has(k)) return;
        seen.add(k);
        list.push({ name:t.name, key:k });
      });
      if(list.length) groups.push({ label, teams:list });
    }
    careerAllRosterTeams().forEach(g => add(g.label + ' (Argentina)', g.teams));
    add('Copa Argentina (otros equipos)', c.copaArgentina && c.copaArgentina.otherTeams);
    const wl = careerWorldLeagues();
    WORLD_LEAGUES_REGISTRY.forEach(def => {
      let teams = wl[def.key] && wl[def.key].teams;
      if(!teams || !teams.length) teams = def.teams || [];
      add(def.country + ' \u00b7 ' + def.name, teams);
    });
    // Al final, los equipos del exterior que no juegan en ninguna liga cargada (los que sí, ya
    // figuran en la suya, y comparten el mismo escudo).
    add('Otros equipos del exterior (copas internacionales)', [].concat((c.libertadores && c.libertadores.foreignTeams) || [], CAREER_EXTERIOR_TEAMS));
    return groups;
  }
  function crestOnInput(e){
    const t = e.target;
    if(!t || !t.hasAttribute || !t.hasAttribute('data-crest-search')) return;
    crestUi.query = t.value;
    const q = crestKey(t.value);
    document.querySelectorAll('.crest-row').forEach(r => {
      r.style.display = (!q || r.getAttribute('data-key').indexOf(q) !== -1) ? '' : 'none';
    });
    document.querySelectorAll('.crest-group').forEach(g => {
      const hayVisibles = Array.from(g.querySelectorAll('.crest-row')).some(r => r.style.display !== 'none');
      g.style.display = hayVisibles ? '' : 'none';
    });
  }
  async function crestHandleSingle(input){
    const file = input.files && input.files[0];
    const key = input.getAttribute('data-crest-key'), name = input.getAttribute('data-crest-name');
    input.value = '';
    if(!file || !key) return;
    try{
      const blob = await crestProcessFile(file);
      const saved = await crestPut(key, blob);
      crestUi.msg = saved ? `Escudo de ${name} cargado.` : `Escudo de ${name} cargado, pero este navegador no permite guardarlo de forma permanente: se va a perder al cerrar la página.`;
    }catch(err){
      crestUi.msg = `No se pudo leer la imagen de ${name}. Probá con un PNG, JPG, WEBP o SVG.`;
    }
    render();
  }
  // Carga varios a la vez: cada archivo se asigna al equipo cuyo nombre coincide con el del archivo.
  async function crestHandleBulk(input){
    const files = Array.from(input.files || []);
    input.value = '';
    if(!files.length) return;
    const known = {};
    crestCollectTeams().forEach(g => g.teams.forEach(t => { known[t.key] = t.name; }));
    let ok = 0, persistFail = false;
    const unmatched = [], failed = [];
    for(let i = 0; i < files.length; i++){
      const f = files[i];
      const key = crestKey(f.name.replace(/\.[^.]+$/, ''));
      if(!known[key]){ unmatched.push(f.name); continue; }
      try{
        const blob = await crestProcessFile(f);
        if(!(await crestPut(key, blob))) persistFail = true;
        ok++;
      }catch(err){ failed.push(f.name); }
    }
    let msg = `Se cargaron ${ok} escudo${ok === 1 ? '' : 's'}.`;
    if(unmatched.length) msg += ` Sin equipo con ese nombre (${unmatched.length}): ${unmatched.slice(0,12).join(', ')}${unmatched.length > 12 ? '\u2026' : ''}. Renombralos como el equipo, o subilos de a uno.`;
    if(failed.length) msg += ` No se pudieron leer (${failed.length}): ${failed.slice(0,12).join(', ')}.`;
    if(persistFail) msg += ' Este navegador no permite guardarlos de forma permanente: se van a perder al cerrar la página.';
    crestUi.msg = msg;
    render();
  }
  async function crestExport(){
    const keys = Object.keys(crestBlobs);
    if(!keys.length){ crestUi.msg = 'Todavía no cargaste ningún escudo.'; render(); return; }
    const out = {};
    for(let i = 0; i < keys.length; i++){
      out[keys[i]] = await new Promise(res => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => res(null);
        r.readAsDataURL(crestBlobs[keys[i]]);
      });
    }
    const blob = new Blob([JSON.stringify({ version:1, escudos:out })], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'escudos-torneos-elo.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    crestUi.msg = `Copia de seguridad descargada (${keys.length} escudos).`;
    render();
  }
  async function crestImport(input){
    const file = input.files && input.files[0];
    input.value = '';
    if(!file) return;
    let ok = 0;
    try{
      const data = JSON.parse(await file.text());
      const escudos = data && data.escudos;
      if(!escudos || typeof escudos !== 'object') throw new Error('formato');
      const keys = Object.keys(escudos);
      for(let i = 0; i < keys.length; i++){
        const v = escudos[keys[i]];
        if(typeof v !== 'string' || v.indexOf('data:image/') !== 0) continue;
        const blob = await (await fetch(v)).blob();
        await crestPut(keys[i], blob);
        ok++;
      }
      crestUi.msg = `Se importaron ${ok} escudo${ok === 1 ? '' : 's'}.`;
    }catch(err){
      crestUi.msg = 'No se pudo importar: el archivo no es una copia de escudos de este juego.';
    }
    render();
  }

  function renderCareraEscudos(){
    const groups = crestCollectTeams();
    const total = groups.reduce((s,g) => s + g.teams.length, 0);
    const con = groups.reduce((s,g) => s + g.teams.filter(t => crestUrls[t.key]).length, 0);
    const q = crestKey(crestUi.query);
    let html = `<div class="panel"><h2>Escudos</h2>
      <p class="hint">Subí la imagen del escudo de cada equipo y se va a mostrar en todas las tablas, fixtures y fichas en lugar de las iniciales. Se guardan en este navegador (no dentro de la carrera), así que sirven para todas tus carreras, y se achican solos a 128 px. Tenés ${con} de ${total} equipos con escudo.</p>
      <div class="btn-row">
        <label class="btn primary small" style="cursor:pointer;">Subir varios escudos<input type="file" accept="image/*" multiple hidden data-crest-bulk></label>
        <button class="btn ghost small" data-action="crest-export">Descargar copia</button>
        <label class="btn ghost small" style="cursor:pointer;">Importar copia<input type="file" accept="application/json,.json" hidden data-crest-import></label>
        <button class="btn ghost small" data-action="crest-clear-all">Quitar todos</button>
      </div>
      <p class="hint" style="margin-top:10px;">Para subir muchos juntos, el nombre de cada archivo tiene que ser el del equipo (por ejemplo <em>Colo Colo.png</em> o <em>colo-colo.png</em>: no importan mayúsculas, tildes, guiones ni espacios). Los que no coincidan te los aviso. Como los escudos viven en este navegador, conviene bajar una copia de vez en cuando.</p>
      ${crestPersistOk ? '' : '<p class="hint" style="color:var(--red);">Este navegador no deja guardar datos de forma permanente: los escudos que subas se pierden al cerrar la página.</p>'}
    </div>`;
    if(crestUi.msg) html += `<div class="msg" style="background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.4);color:var(--gold-bright);">${escapeHtml(crestUi.msg)}</div>`;
    html += `<div class="panel"><div class="btn-row" style="margin-top:0;align-items:center;">
      <input type="text" id="crestSearch" data-crest-search placeholder="Buscar equipo&hellip;" value="${escapeHtml(crestUi.query)}" style="flex:1;min-width:180px;">
      <select data-crest-group>
        <option value="">Todas las competiciones</option>
        ${groups.map(g => `<option value="${escapeHtml(g.label)}" ${crestUi.group === g.label ? 'selected' : ''}>${escapeHtml(g.label)}</option>`).join('')}
      </select>
    </div></div>`;
    groups.forEach(g => {
      if(crestUi.group && crestUi.group !== g.label) return;
      const gCon = g.teams.filter(t => crestUrls[t.key]).length;
      const gVisible = !q || g.teams.some(t => t.key.indexOf(q) !== -1);
      html += `<div class="crest-group" style="${gVisible ? '' : 'display:none;'}"><div class="cs-section-title">${escapeHtml(g.label)} &middot; ${gCon}/${g.teams.length}</div><div class="crest-grid">`;
      g.teams.forEach(t => {
        const has = !!crestUrls[t.key];
        const hidden = q && t.key.indexOf(q) === -1;
        html += `<div class="crest-row" data-key="${t.key}" style="${hidden ? 'display:none;' : ''}">
          ${teamBadgeHtml({ name:t.name }, 40)}
          <div class="nm" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</div>
          <label class="btn ghost small" style="cursor:pointer;">${has ? 'Cambiar' : 'Subir'}<input type="file" accept="image/*" hidden data-crest-upload data-crest-key="${t.key}" data-crest-name="${escapeHtml(t.name)}"></label>
          ${has ? `<button class="btn ghost small" data-action="crest-remove" data-key="${t.key}" title="Quitar escudo">&times;</button>` : ''}
        </div>`;
      });
      html += `</div></div>`;
    });
    return html;
  }

  // ---------- Insignias de equipo (iniciales + color derivado del nombre) ----------
  // Si el equipo tiene un escudo subido (ver "Escudos de equipos" más abajo) se usa ese; si no, se
  // genera una insignia estable a partir del nombre (iniciales + color).
  function teamInitials(name){
    if(!name) return '?';
    const stop = new Set(['de','del','la','los','las','el','y']);
    const words = name.split(/\s+/).filter(w=>w && !stop.has(w.toLowerCase()));
    const src = words.length ? words : name.split(/\s+/);
    if(src.length === 1) return src[0].slice(0,2).toUpperCase();
    return (src[0][0] + src[1][0]).toUpperCase();
  }
  function teamHue(name){
    let h = 0;
    for(let i=0;i<(name||'').length;i++) h = (h*31 + name.charCodeAt(i)) % 360;
    return h;
  }
  function teamBadgeHtml(team, size){
    size = size || 26;
    if(!team) return `<div class="cs-badge" style="width:${size}px;height:${size}px;background:var(--line);"></div>`;
    const crest = crestUrls[crestKey(team.name)];
    if(crest) return `<div class="cs-badge cs-badge-img" style="width:${size}px;height:${size}px;"><img src="${crest}" alt="" draggable="false" style="width:100%;height:100%;object-fit:contain;display:block;"></div>`;
    const hue = teamHue(team.name);
    return `<div class="cs-badge" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.4)}px;background:hsl(${hue},58%,50%);">${escapeHtml(teamInitials(team.name))}</div>`;
  }

  // ---------- Próximo partido / últimos resultados (para el dashboard de Inicio) ----------
  function careerNextMatchFor(teamId){
    if(!teamId) return null;
    const list = careerAllUnplayedDatedMatches().filter(m=>m.home===teamId||m.away===teamId);
    list.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
    return list[0] || null;
  }
  function careerLastResultsFor(teamId, n){
    if(!teamId) return [];
    const list = careerAllDatedMatches().filter(m=>m.played && (m.home===teamId||m.away===teamId));
    list.sort((a,b)=>(b.playedAt||0)-(a.playedAt||0));
    return list.slice(0, n||5);
  }

  function renderCareraInicio(){
    const c = state.career;
    careerTryAutoAdvanceStages();
    const myTeam = c.myTeamId ? careerTeamById(c.myTeamId) : null;
    const next = careerNextMatchFor(c.myTeamId);
    const results = careerLastResultsFor(c.myTeamId, 5);

    let posLine = '&mdash;', standingsRow = null;
    if(myTeam && (myTeam.zone===0 || myTeam.zone===1)){
      const zoneIds = c.teams.filter(t=>t.zone===myTeam.zone).map(t=>t.id);
      const standings = careerComputeStandings(zoneIds, m=>m.comp===c.tournament);
      const idx = standings.findIndex(r=>r.id===c.myTeamId);

  // Riel de fases para los cuadros eliminatorios (Copa Argentina / Libertadores / Sudamericana).
  // "activo" = la primera fase con partidos sin jugar; si ya está todo jugado, la última con partidos.
  function renderStageRail(stages, labels, matches){
    const active = stages.find(s => matches.some(m=>m.stage===s && !m.played))
      || stages.slice().reverse().find(s => matches.some(m=>m.stage===s))
      || stages[0];
    const activeIdx = stages.indexOf(active);
    return `<div class="cs-stage-rail">${stages.map((s,i)=>{
      const cls = s===active ? 'active' : (i<activeIdx ? 'done' : '');
      return `<div class="cs-stage-pip ${cls}">${labels[s]||s}</div>`;
    }).join('<span class="cs-stage-sep">&rarr;</span>')}</div>`;
  }

  // ---------- Estadísticas: evolución de ELO ----------
  // Se reconstruye a partir de los deltas guardados en cada partido jugado (m.deltaHome/m.deltaAway);
  // no se inventa ningún dato: si no hay partidos jugados, no hay gráfico.
  function careerEloTrajectory(teamId){
    const t = careerTeamById(teamId);
    if(!t) return [];
    const matches = careerAllDatedMatches().filter(m=>m.played && (m.home===teamId || m.away===teamId));
    matches.sort((a,b)=>(a.playedAt||0)-(b.playedAt||0));
    const deltas = matches.map(m => m.home===teamId ? (m.deltaHome||0) : (m.deltaAway||0));
    const totalDelta = deltas.reduce((s,d)=>s+d,0);
    let running = t.elo - totalDelta;
    const points = [running];
    deltas.forEach(d => { running += d; points.push(running); });
    return points;
  }
  function renderEloSparkline(points){
    if(points.length < 2) return `<div class="cs-empty-hint">Todavía no hay partidos suficientes para graficar la evolución.</div>`;
    const width = 640, height = 140;
    const min = Math.min(...points), max = Math.max(...points);
    const range = (max-min) || 1;
    const stepX = width / (points.length - 1);
    const coords = points.map((p,i) => [i*stepX, height - ((p-min)/range) * (height-24) - 12]);
    const path = coords.map((pt,i) => (i===0?'M':'L') + pt[0].toFixed(1) + ',' + pt[1].toFixed(1)).join(' ');
    const last = coords[coords.length-1];
    return `<svg viewBox="0 0 ${width} ${height}" class="cs-elo-chart" preserveAspectRatio="none">
      <path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.5" />
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="var(--gold-bright)" />
    </svg>`;
  }
  function renderCareraEstadisticas(){
    const c = state.career;
    const myTeam = c.myTeamId ? careerTeamById(c.myTeamId) : null;
    if(!myTeam) return renderCareraStub('&#128200;', 'Estadísticas', 'Elegí un equipo para ver sus estadísticas de ELO.');
    const points = careerEloTrajectory(c.myTeamId);
    const cur = myTeam.elo;
    const initial = points.length ? points[0] : cur;
    const best = points.length ? Math.max(...points) : cur;
    const worst = points.length ? Math.min(...points) : cur;
    const delta = cur - initial;
    let html = `<div class="panel"><h2>Estadísticas &middot; ELO</h2><p class="hint">${escapeHtml(myTeam.name)}</p></div>`;
    html += `<div class="cs-cards-row">
      <div class="cs-stat-card"><div class="label">ELO actual</div><div class="value">${cur}</div></div>
      <div class="cs-stat-card"><div class="label">ELO inicial</div><div class="value">${initial}</div></div>
      <div class="cs-stat-card"><div class="label">Variación</div><div class="value" style="color:${delta>=0?'var(--green-win)':'var(--red)'};">${delta>=0?'+':''}${delta}</div></div>
      <div class="cs-stat-card"><div class="label">Mejor ELO</div><div class="value">${best}</div></div>
      <div class="cs-stat-card"><div class="label">Peor ELO</div><div class="value">${worst}</div></div>
    </div>`;
    html += `<div class="cs-section-title">Evolución &middot; ${points.length} partido${points.length===1?'':'s'} jugado${points.length===1?'':'s'} en la carrera</div>`;
    html += `<div class="panel">${renderEloSparkline(points)}</div>`;
    return html;

  function renderCareraCalendario(){
    const c = state.career;
    // Arma automáticamente octavos/cuartos/etc, rondas de Copa Argentina y copas nacionales apenas
    // corresponde, para que el botón de avanzar no "desaparezca" entre una etapa y la siguiente.
    careerTryAutoAdvanceStages();

    // Se listan todos los partidos del día, jugados o no, para que el resultado quede a la vista
    // después de simular en vez de desaparecer de la pantalla.
    const todays = careerAllDatedMatches().filter(m=>m.date === c.calendarDate);
    const pendingToday = todays.filter(m=>!m.played);
    const allPending = careerAllUnplayedDatedMatches();
    const pendingTotal = allPending.length;

    let html = `<div class="cs-hero">
      <div class="season-tag">Calendario &middot; Temporada ${c.year}</div>
      <div class="matchup" style="font-size:16px;">${formatCareerDate(c.calendarDate)}</div>
      <div class="meta">${todays.length ? `${todays.length} partido${todays.length===1?'':'s'} programado${todays.length===1?'':'s'} &middot; ${pendingToday.length ? pendingToday.length+' sin jugar' : 'ya se jugaron todos'}.` : 'Sin partidos programados para hoy.'}</div>

    if(todays.length === 0){
      html += `<div class="panel">`;
      if(pendingTotal === 0){
        html += `<p class="hint">No hay más partidos programados por el momento. Puede que haga falta armar algo desde el menú de la izquierda (por ejemplo sortear la Copa Argentina, o pasar de temporada una vez terminado el Clausura).</p>`;
      } else {
        html += `<p class="hint">Tocá "Avanzar calendario" para ir al próximo día con partidos.</p>`;
      }
      html += `</div>`;
    } else {
      const groups = [];

      todays.forEach(m => {

      groups.forEach(g => {
        html += `<div class="panel"><h2>${g.label}</h2>${g.matches.map(m=>renderCareerMatchRow(m, null)).join('')}</div>`;

        html += `<p class="hint">Ya se jugó todo lo de hoy. Avanzá el calendario para ir al próximo día con partidos.</p>`;
      }

    // Vista previa de las próximas fechas (solo lectura, agrupadas por día).
    const upcomingByDate = allPending.filter(m=>m.date && m.date !== c.calendarDate);
    const dates = [...new Set(upcomingByDate.map(m=>m.date))].sort().slice(0,4);
    if(dates.length){

          <div><div style="color:var(--ink);">${formatCareerDate(d)}</div><div style="color:var(--ink-dim);font-size:11.5px;">${comps.join(' &middot; ')}</div></div>
          <div style="color:var(--ink-dim);font-size:12.5px;">${ms.length} partido${ms.length===1?'':'s'}</div>
        </div>`;
      });
    }
    return html;
  }

  function renderCareraLiga(){
    const c = state.career;
    const myTeam = careerTeamById(c.myTeamId);
    const tournamentLabel = c.tournament === 'apertura' ? 'Copa de la Liga &mdash; Apertura' : 'Copa de la Liga &mdash; Clausura';
    const zoneA = c.teams.filter(t=>t.zone===0).map(t=>t.id);
    const zoneB = c.teams.filter(t=>t.zone===1).map(t=>t.id);

    const ligaMatches = c.matches.filter(m=>m.comp===c.tournament);
    const ligaDone = ligaMatches.length>0 && ligaMatches.every(m=>m.played);

    let body = `<div class="panel">
      <h2>${tournamentLabel} ${c.year}</h2>
      <p class="hint">Jugás con <strong style="color:var(--ink);">${myTeam?escapeHtml(myTeam.name):'&mdash;'}</strong> (Zona ${myTeam&&myTeam.zone===1?'B':'A'}).</p>
    </div>`;

    // FIXTURE fecha a fecha
    const rounds = [...new Set(ligaMatches.map(m=>m.round))].sort((a,b)=>a-b);
    const total = rounds.length;
    const cur = ensureCareerRoundPointer('career-liga', total);
    const curMatches = ligaMatches.filter(m=>m.round===cur);
    const anyPlayed = ligaMatches.some(m=>m.played && !m.bye);
    const zoneIdsForMeta = myTeam ? c.teams.filter(t=>t.zone===myTeam.zone).map(t=>t.id) : [];
    let meta = null;
    if(anyPlayed && zoneIdsForMeta.length){
      const standings = careerComputeStandings(zoneIdsForMeta, m=>m.comp===c.tournament);
      const posMap = {}; standings.forEach((r,i)=>posMap[r.id]=i+1);
      const formMap = {}; zoneIdsForMeta.forEach(id=>formMap[id]=careerComputeForm(id, m=>m.comp===c.tournament));
      meta = { posMap, formMap, zones: CAREER_ZONE_LEGEND };
    }

    body += `<div class="panel"><h2>Fixture</h2>`;
    body += `<div class="round-header"><h3>${curMatches.some(m=>m.interzonal)?'Fecha interzonal':'Fecha '+cur} de ${total}</h3></div>`;
    body += renderRoundNav('career-liga', cur, total, 'Fecha', 'career-nav-round');
    body += curMatches.map(m=>renderCareerMatchRow(m, meta)).join('');
    if(curMatches.some(m=>!m.played && !m.bye)){
      body += `<div class="btn-row"><button class="btn primary" data-action="career-simulate-round" data-scope="liga-round" data-round="${cur}">Simular esta fecha</button></div>`;
    }
    body += `</div>`;

    // TABLAS DE ZONA
    const standA = careerComputeStandings(zoneA, m=>m.comp===c.tournament);
    const standB = careerComputeStandings(zoneB, m=>m.comp===c.tournament);
    body += `<div class="group-block"><h3>Zona A</h3>${renderStandingsTable(standA, false, CAREER_ZONE_LEGEND, careerTeamById)}</div>`;
    body += `<div class="group-block"><h3>Zona B</h3>${renderStandingsTable(standB, false, CAREER_ZONE_LEGEND, careerTeamById)}</div>`;

    // PLAYOFFS
    const canPlayoffs = zoneA.length>=8 && zoneB.length>=8;
    if(ligaDone && !c.knockoutBuilt){
      body += canPlayoffs
        ? `<div class="btn-row"><button class="btn primary" data-action="career-build-playoffs">Generar Octavos de Final</button></div>`
        : `<div class="msg warn">Necesitás al menos 8 equipos por zona para armar la fase eliminatoria.</div>`;
    }
    if(c.knockoutBuilt) body += renderCareraPlayoffs();

    // Fin de torneo / avance de temporada
    if(c.champion && c.champion.tournament === c.tournament){
      const champ = careerTeamById(c.champion.teamId);
      body += `<div class="msg" style="background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.4);color:var(--gold-bright);">&#127942; Campeón de la ${c.tournament==='apertura'?'Copa de la Liga Apertura':'Copa de la Liga Clausura'} ${c.year}: <strong>${escapeHtml(champ.name)}</strong></div>`;
      if(c.tournament === 'apertura'){
        body += `<div class="btn-row"><button class="btn primary" data-action="career-start-clausura">Continuar al Clausura ${c.year}</button></div>`;
      } else {
        body += `<div class="panel"><h2>Fin de temporada ${c.year}</h2><p class="hint">Mirá la Tabla Anual, la Tabla de Promedios y los descensos en la pestaña "Tablas y Copas".</p><div class="btn-row"><button class="btn primary" data-action="career-start-next-apertura">Arrancar Apertura ${c.year+1}</button></div></div>`;
      }
    }

    return body;
  }

  function renderCareraPlayoffs(){
    const c = state.career;
    const stages = ['octavos','cuartos','semis','final'];
    const stageLabels = { octavos:'Octavos de Final', cuartos:'Cuartos de Final', semis:'Semifinales', final:'Final' };
    let html = `<div class="panel"><h2>Fase Eliminatoria</h2>`;
    stages.forEach(stage => {
      const ms = c.knockout.filter(m=>m.stage===stage);
      if(ms.length === 0) return;
      html += `<div class="round-header"><h3>${stageLabels[stage]}</h3></div>`;
      html += ms.map(m=>renderCareerMatchRow(m, null)).join('');
      const allPlayed = ms.every(m=>m.played);
      const nextStage = stages[stages.indexOf(stage)+1];
      if(!allPlayed){
        html += `<div class="btn-row"><button class="btn small" data-action="career-simulate-round" data-scope="${stage}">Simular ${stageLabels[stage].toLowerCase()}</button></div>`;
      }
      if(allPlayed && nextStage && c.knockout.filter(m=>m.stage===nextStage).length===0){
        html += `<div class="btn-row"><button class="btn primary" data-action="career-advance-playoffs" data-stage="${stage}">Avanzar a ${stageLabels[nextStage]}</button></div>`;
      }
    });
    html += `</div>`;
    return html;
  }

  function careerWorldLeagues(){
    const c = state.career;
    if(!c.worldLeagues) c.worldLeagues = {};
    return c.worldLeagues;
  }

  // Resultado de un partido usando el mismo modelo de ELO que el resto del juego (goleadas más
  // probables cuanto más grande el favorito, empates que se achican con la diferencia), pero
  // desacoplado de state.career/state.config para poder usarlo con equipos de cualquier país.
  function worldLeagueMatchResult(eloHome, eloAway, opts){
    opts = opts || {};
    const adv = opts.neutral ? 0 : (opts.homeAdvantage != null ? opts.homeAdvantage : 40);
    const surpriseFactor = opts.surpriseFactor != null ? opts.surpriseFactor : 45;
    const drawProbBase = opts.drawProb != null ? opts.drawProb : 0.25;
    const exp = eloExpected(eloHome + adv, eloAway);
    const adjusted = adjustedProbability(exp, surpriseFactor);
    const g = gapStrength(adjusted);
    const drawProb = drawProbBase * (0.2 + 0.8 * (1 - g));
    const pHome = adjusted * (1 - drawProb);
    const pAway = (1 - adjusted) * (1 - drawProb);
    const roll = Math.random();
    const outcome = roll < pHome ? 'home' : (roll < pHome + pAway ? 'away' : 'draw');
    const [homeScore, awayScore] = goalsForOutcome(outcome, adjusted);
    return { homeScore, awayScore };
  }
  function worldLeagueEloUpdate(eloHome, eloAway, homeScore, awayScore, opts){
    opts = opts || {};
    const adv = opts.neutral ? 0 : (opts.homeAdvantage != null ? opts.homeAdvantage : 40);
    const k = opts.kFactor != null ? opts.kFactor : 24;
    const expHome = eloExpected(eloHome + adv, eloAway);
    const sHome = homeScore > awayScore ? 1 : (homeScore < awayScore ? 0 : 0.5);
    const dHome = Math.round(k * (sHome - expHome));
    const dAway = Math.round(k * ((1 - sHome) - (1 - expHome)));
    return [eloHome + dHome, eloAway + dAway];
  }
  // Definición de penales genérica (series ida y vuelta con el agregado empatado): casi un cara o
  // ceca, apenas inclinado por el favorito, igual que en cualquier eliminatoria del resto del juego.
  function worldLeaguePenaltyWinner(eloA, eloB){
    const adjusted = adjustedProbability(eloExpected(eloA, eloB), 45);
    const tilted = 0.5 + (adjusted - 0.5) * 0.3;
    return Math.random() < tilted ? 'A' : 'B';
  }
  // Tabla de posiciones genérica a partir de una lista de partidos {home,away,homeScore,awayScore,played}
  // y un array de equipos {id,elo,...} — no depende de careerTeamById, así sirve para cualquier país.
  function computeGenericStandings(matches, teams){
    const rows = {};
    teams.forEach(t => { rows[t.id] = { id:t.id, pj:0, pg:0, pe:0, pp:0, gf:0, gc:0, pts:0 }; });
    matches.forEach(m => {
      if(!m.played) return;
      if(rows[m.home]){
        const r = rows[m.home];
        r.pj++; r.gf += m.homeScore; r.gc += m.awayScore;
        if(m.homeScore > m.awayScore){ r.pg++; r.pts += 3; }
        else if(m.homeScore < m.awayScore){ r.pp++; }
        else { r.pe++; r.pts += 1; }
      }
      if(rows[m.away]){
        const r = rows[m.away];
        r.pj++; r.gf += m.awayScore; r.gc += m.homeScore;
        if(m.awayScore > m.homeScore){ r.pg++; r.pts += 3; }
        else if(m.awayScore < m.homeScore){ r.pp++; }
        else { r.pe++; r.pts += 1; }
      }
    });
    const byId = {}; teams.forEach(t => byId[t.id] = t);
    const arr = Object.values(rows);
    arr.forEach(r => r.dg = r.gf - r.gc);
    arr.sort((x,y) => y.pts - x.pts || y.dg - x.dg || y.gf - x.gf || (byId[y.id].elo - byId[x.id].elo));
    return arr;
  }
  // Juega, dentro de una lista cualquiera de partidos {home,away,date,homeScore,awayScore,played},
  // todos los que ya tengan fecha pasada según el calendario único de la carrera, actualizando el
  // ELO de los equipos involucrados. Reutilizable tanto para la fase regular como para cualquier
  // eliminatoria (por ej. el reducido de ascenso de la Serie B).
  function careerWorldLeaguePlayDue(matches, byId, calendarDate, opts){
    let jugoAlguno = false;
    matches.forEach(m => {
      if(m.played || !m.date || m.date >= calendarDate) return;
      const home = byId[m.home], away = byId[m.away];
      const res = worldLeagueMatchResult(home.elo, away.elo, opts);
      m.homeScore = res.homeScore; m.awayScore = res.awayScore; m.played = true;
      const [nh, na] = worldLeagueEloUpdate(home.elo, away.elo, m.homeScore, m.awayScore, opts);
      home.elo = nh; away.elo = na;
      jugoAlguno = true;
    });
    return jugoAlguno;
  }
  // Arma el fixture completo de la temporada de una liga del exterior (por ahora, todos-contra-

  // jugar ningún partido todavía — eso lo hace careerWorldLeagueCatchUp a medida que el calendario
  // avanza. Los equipos persisten de un año a otro (con su ELO ya actualizado); si es la primera
  // vez que se arma esta liga, se cargan desde el registro. Si se pasa `newRoster` (el plantel ya
  // armado por la pirámide de ascensos/descensos, ver careerWorldLeaguePyramidNewRosters), se usa
  // eso en vez de repetir el plantel del año anterior tal cual.
  function careerWorldLeagueBuildSeason(def, newRoster){
    const c = state.career;
    const wl = careerWorldLeagues();
    const prev = wl[def.key];
    const teams = newRoster ? newRoster.map(t => ({ id:t.id, name:t.name, elo:t.elo }))
      : (prev && prev.teams && prev.teams.length)
        ? prev.teams.map(t => ({ id:t.id, name:t.name, elo:t.elo }))
        : def.teams.map((t,i) => ({ id:'wl_'+def.key+'_'+i, name:t.name, elo:t.elo }));
    const ids = teams.map(t=>t.id);
    let rounds = roundRobinRounds(ids);
    if(def.format === 'liga-ida-vuelta'){
      rounds = rounds.concat(rounds.map(r => r.map(m => ({ home:m.away, away:m.home }))));
    }
    // Arranca la misma semana que el Apertura argentino y juega una fecha por semana; así una
    // liga de ~38 fechas queda repartida a lo largo de todo el año, en paralelo al torneo local.
    const startBase = careerWorldSeasonStart(!!prev);
    // Algunas ligas (la Liga de Primera de Chile) arrancan unas semanas después del inicio de
    // temporada porque antes se juega una copa (`startOffsetWeeks`).
    const startDate = def.startOffsetWeeks ? addDaysISO(startBase, def.startOffsetWeeks * 7) : startBase;
    const matches = [];
    rounds.forEach((round, ri) => {
      const date = addDaysISO(startDate, ri*7);
      round.forEach(m => {
        if(m.home === null || m.away === null) return;
        matches.push({ id:'wl_'+def.key+'_'+c.year+'_'+matches.length, home:m.home, away:m.away, round:ri+1, date, homeScore:null, awayScore:null, played:false });
      });
    });
    const history = (prev && prev.history) ? prev.history.slice() : [];
    // Posiciones de tabla involucradas en el playoff de ascenso (si esta liga tiene uno definido),
    // para poder resaltarlas en la tabla en vivo aunque el playoff todavía no se haya armado.
    const promocionPlayoffPositions = def.promocionPlayoff ? def.promocionPlayoff.reduce((acc,p)=>acc.concat(p),[]) : [];
    wl[def.key] = {
      key: def.key, country: def.country, name: def.name, format: def.format,
      descensos: def.descensos || 0, promocionDirecta: def.promocionDirecta || 0,
      promocionPlayoff: def.promocionPlayoff || null, promocionPlayoffPositions,
      grupos: def.grupos || null,
      // `season` es un contador propio de esta división que suma 1 cada vez que arranca una
      // temporada nueva, sin importar el año de carrera — hace falta porque, con la pirámide de
      // ascensos ya funcionando, una división puede arrancar su siguiente temporada sin que
      // `c.year` haya cambiado todavía (si esta terminó antes que las otras 3). La Copa/Supercopa
      // do Brasil usan esto (no el año) para saber si el plantel de esta liga que tienen cargado
      // sigue siendo el vigente.
      season: (prev && prev.season) ? prev.season + 1 : 1,
      year: Number(startDate.slice(0,4)), teams, matches, table: [], championId: null, relegatedIds: [], promotedIds: [],
      playoff: null, stage: def.format === 'fases-grupos' ? 'fase1' : 'liga', fase2Groups: null, final: null,
      startBase, zonas: def.zonas || null,
      prevTableIds: (def.keepPrevTable && prev && prev.table && prev.table.length) ? prev.table.map(r => r.id) : null,
      history

  // Arma (o resuelve) una serie ida y vuelta entre dos equipos, sumando los puntos de partido (3/1/0)
  // de las dos idas y la diferencia de goles de la serie — no el resultado agregado tipo gol de visitante,
  // que es el criterio que describe la Segunda División uruguaya tanto para el reducido como para la final.
  function careerWorldLeagueBuildTwoLegTie(teamA, teamB, betterPlacedId, startDate){
    const idaHome = betterPlacedId === teamA ? teamB : teamA;
    const idaAway = betterPlacedId === teamA ? teamA : teamB;
    return {
      teamA, teamB, betterPlacedId, winnerId: null, wentToPenalties: false,
      legs: [
        { home: idaHome, away: idaAway, date: startDate, homeScore:null, awayScore:null, played:false },
        { home: betterPlacedId, away: (betterPlacedId===teamA?teamB:teamA), date: addDaysISO(startDate,7), homeScore:null, awayScore:null, played:false }
      ]
    };
  }
  // Resuelve una serie ya jugada (las 2 idas). `finalDecider` decide qué pasa si sigue empatada
  // en puntos y diferencia de goles tras las dos idas: en el reducido (no es la final) avanza
  // directamente el mejor ubicado en la Tabla Anual, sin alargue ni penales (así lo pide la regla);
  // en la final sí hay alargue y penales — se simplifica, como el resto del juego, a una definición
  // directa por penales.
  function careerWorldLeagueResolveTwoLegTie(tie, byId){
    const pts = {}, gf = {}, gc = {};
    [tie.teamA, tie.teamB].forEach(id=>{ pts[id]=0; gf[id]=0; gc[id]=0; });
    tie.legs.forEach(m=>{
      if(!m.played) return;
      if(m.homeScore > m.awayScore) pts[m.home] += 3;
      else if(m.homeScore < m.awayScore) pts[m.away] += 3;
      else { pts[m.home] += 1; pts[m.away] += 1; }
      gf[m.home] += m.homeScore; gc[m.home] += m.awayScore;
      gf[m.away] += m.awayScore; gc[m.away] += m.homeScore;
    });
    if(pts[tie.teamA] !== pts[tie.teamB]) return pts[tie.teamA] > pts[tie.teamB] ? tie.teamA : tie.teamB;
    const dgA = gf[tie.teamA]-gc[tie.teamA], dgB = gf[tie.teamB]-gc[tie.teamB];
    if(dgA !== dgB) return dgA > dgB ? tie.teamA : tie.teamB;
    return null; // sigue empatado: lo resuelve el caller (reducido: mejor ubicado; final: penales)
  }
  // ---------- Uruguay: Segunda División Profesional ----------

      regular: null, tablaAnual: [], promediosTable: [],
      playoff: null, relegatedIds: [], promotedIds: [], championId: null,
