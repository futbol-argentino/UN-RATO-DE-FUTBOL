        league.torneoInicial = {
          semis: [
            { home:semiTeams[0], away:semiTeams[1], date:startDate, homeScore:null, awayScore:null, played:false, wentToPenalties:false, winnerId:null },
            { home:semiTeams[2], away:semiTeams[3], date:startDate, homeScore:null, awayScore:null, played:false, wentToPenalties:false, winnerId:null }
          ],
          final: null, championId: null
        };
        const rounds = roundRobinRounds(clasificados);
        const matches = [];
        rounds.forEach((round, ri) => {
          const date = addDaysISO(startDate, ri*7);
          round.forEach(m => {
            if(m.home===null||m.away===null) return;
            matches.push({ id:'wl_uruguay-tercera_final_'+matches.length, home:m.home, away:m.away, round:ri+1, date, homeScore:null, awayScore:null, played:false });
          });
        });
        // El campeón del Torneo Inicial no asciende directo, pero se asegura un lugar en la
        // definición por el segundo ascenso al final de la temporada (ver stage 'segundo-ascenso').
        league.torneoFinal = { teamIds: clasificados, matches, table: [] };
        league.stage = 'final';
      }
    }

    if(league.stage === 'final'){
      // El Torneo Final (liga de los 18 clasificados) corre en paralelo a las semis y la final del
      // Torneo Inicial (que solo define SU propio campeón, no un ascenso).
      const ti = league.torneoInicial;
      if(ti.championId === null){
        careerWorldLeaguePlayDue(ti.semis, byId, c.calendarDate, {neutral:true});
        ti.semis.forEach(m => {
          if(m.played && !m.winnerId){
            if(m.homeScore > m.awayScore) m.winnerId = m.home;
            else if(m.awayScore > m.homeScore) m.winnerId = m.away;
            else { m.wentToPenalties = true; m.winnerId = worldLeaguePenaltyWinner(byId[m.home].elo, byId[m.away].elo) === 'A' ? m.home : m.away; }
          }
        });
        if(!ti.final && ti.semis.every(m=>m.winnerId)){
          const lastDate = ti.semis.reduce((mx,m)=> m.date>mx?m.date:mx, ti.semis[0].date);
          ti.final = { home:ti.semis[0].winnerId, away:ti.semis[1].winnerId, date:addDaysISO(lastDate,7), homeScore:null, awayScore:null, played:false, wentToPenalties:false, winnerId:null };
        }
        if(ti.final){
          careerWorldLeaguePlayDue([ti.final], byId, c.calendarDate, {neutral:true});
          if(ti.final.played && !ti.final.winnerId){
            if(ti.final.homeScore > ti.final.awayScore) ti.final.winnerId = ti.final.home;
            else if(ti.final.awayScore > ti.final.homeScore) ti.final.winnerId = ti.final.away;
            else { ti.final.wentToPenalties = true; ti.final.winnerId = worldLeaguePenaltyWinner(byId[ti.final.home].elo, byId[ti.final.away].elo) === 'A' ? ti.final.home : ti.final.away; }
            ti.championId = ti.final.winnerId;
          }
        }
      }
      careerWorldLeaguePlayDue(league.torneoFinal.matches, byId, c.calendarDate, {});
      league.torneoFinal.table = computeGenericStandings(league.torneoFinal.matches, league.torneoFinal.teamIds.map(id=>byId[id]));
      if(league.torneoFinal.matches.every(m=>m.played) && ti.championId !== null){
        const order = league.torneoFinal.table.map(r=>r.id);
        const primerAscenso = order[0], segundoFinal = order[1];
        league.championId = primerAscenso; // Campeón Uruguayo de Primera Divisional C
        if(segundoFinal === ti.championId){
          league.promotedIds = [primerAscenso, segundoFinal];
          league.segundoAscenso = { scenario: 1 };
          league.stage = 'definicion-lista';
        } else if(primerAscenso === ti.championId){
          // El campeón del Torneo Inicial ya ascendió directo por ser 1° del Torneo Final: no hay
          // definición posible (jugaría contra sí mismo) y el segundo ascenso es para el 2° del
          // Torneo Final. Sin este caso el mismo equipo quedaba ascendido dos veces y aparecía
          // duplicado en la pirámide.
          league.promotedIds = [primerAscenso, segundoFinal];
          league.segundoAscenso = { scenario: 3 };
          league.stage = 'definicion-lista';
        } else {
          const date = addDaysISO(league.torneoFinal.matches[league.torneoFinal.matches.length-1].date, 7);
          league.segundoAscenso = { scenario: 2, match: { home:segundoFinal, away:ti.championId, date, homeScore:null, awayScore:null, played:false, wentToPenalties:false, winnerId:null } };
          league.stage = 'segundo-ascenso';
        }
      }
    }

    if(league.stage === 'segundo-ascenso'){
      const m = league.segundoAscenso.match;
      careerWorldLeaguePlayDue([m], byId, c.calendarDate, {neutral:true});
      if(m.played && !m.winnerId){
        if(m.homeScore > m.awayScore) m.winnerId = m.home;
        else if(m.awayScore > m.homeScore) m.winnerId = m.away;
        else { m.wentToPenalties = true; m.winnerId = worldLeaguePenaltyWinner(byId[m.home].elo, byId[m.away].elo) === 'A' ? m.home : m.away; }
        league.promotedIds = [league.championId, m.winnerId];
        league.stage = 'definicion-lista';
      }
    }

    if(league.stage === 'definicion-lista'){
      // Desciende el último del Torneo Final, a la Divisional D (careerEnsureUruguayLeagues se
      // encarga del movimiento real).
      // Si el campeón del Torneo Inicial ganó la definición y ascendió pero terminó último en el
      // Torneo Final, desciende el peor de los que NO ascendieron.
      const ascendidosT = new Set(league.promotedIds || []);
      const tablaDesc = league.torneoFinal.table.filter(r => !ascendidosT.has(r.id));
      league.relegatedIds = [tablaDesc[tablaDesc.length-1].id];
      league.history.unshift({ year: league.year, championId: league.championId, championName: byId[league.championId].name });
      if(league.history.length > 15) league.history.length = 15;
      league.stage = 'done';
    }
  }
  // ---------- Uruguay: Divisional D (Cuarta División) ----------
  function careerWorldLeagueBuildSeasonUruguayCuarta(def, prevLeague, forcedRoster){
    const c = state.career;
    const wl = careerWorldLeagues();
    const teams = forcedRoster ? forcedRoster
      : (prevLeague && prevLeague.teams && prevLeague.teams.length)
        ? prevLeague.teams.map(t => ({ id:t.id, name:t.name, elo:t.elo }))
        : def.teams.map((t,i) => ({ id:'wl_'+def.key+'_'+i, name:t.name, elo:t.elo }));
    const ids = teams.map(t=>t.id);
    const startDate = careerWorldSeasonStart(!!prevLeague);
    const rounds = roundRobinRounds(ids);
    const matches = [];
    rounds.forEach((round, ri) => {
      const date = addDaysISO(startDate, ri*7);
      round.forEach(m => {
        if(m.home===null||m.away===null) return;
        matches.push({ id:'wl_'+def.key+'_regular_'+matches.length, home:m.home, away:m.away, round:ri+1, date, homeScore:null, awayScore:null, played:false });
      });
    });
    wl[def.key] = {
      key: def.key, country: def.country, name: def.name, format: def.format,
      season: (prevLeague && prevLeague.season) ? prevLeague.season + 1 : 1,
      year: Number(startDate.slice(0,4)), teams,
      stage: 'regular',
      regular: { matches, table: [] },
      regularChampionId: null, playoff: null, ascensoFinal: null,
      // Los 2 mejores de la tabla de la temporada anterior que no ascendieron: clasifican a la Copa
      // Uruguay de esta temporada (null en la primera temporada: entran Real Montevideo y Rincon).
      copaSlotIds: careerUruguayCuartaCopaSlots(prevLeague),
      promotedIds: [], championId: null,
      history: (prevLeague && prevLeague.history) ? prevLeague.history.slice() : []
    };
  }
  function careerWorldLeagueCatchUpUruguayCuarta(league){
    const c = state.career;
    const byId = {}; league.teams.forEach(t => byId[t.id] = t);

    function resolveSingle(m){
      if(m.played && !m.winnerId){
        if(m.homeScore > m.awayScore) m.winnerId = m.home;
        else if(m.awayScore > m.homeScore) m.winnerId = m.away;
        else { m.wentToPenalties = true; m.winnerId = worldLeaguePenaltyWinner(byId[m.home].elo, byId[m.away].elo) === 'A' ? m.home : m.away; }
      }
    }

    if(league.stage === 'regular'){
      careerWorldLeaguePlayDue(league.regular.matches, byId, c.calendarDate, {});
      league.regular.table = computeGenericStandings(league.regular.matches, league.teams);
      if(league.regular.matches.every(m=>m.played)){
        league.regularChampionId = league.regular.table[0].id;
        const top8 = league.regular.table.slice(0,8).map(r=>r.id); // 1° a 8°, cruces fijos por posición
        const lastDate = league.regular.matches[league.regular.matches.length-1].date;
        const startDate = addDaysISO(lastDate, 7);
        // Cuartos: 1v8, 2v7, 3v6, 4v5, a partido único en cancha del mejor posicionado.
        const qf = [[0,7],[1,6],[2,5],[3,4]].map(([hi,ai]) => ({
          home: top8[hi], away: top8[ai], date: startDate, homeScore:null, awayScore:null, played:false, wentToPenalties:false, winnerId:null
        }));
        league.playoff = { quarters: qf, semis: null, final: null, championId: null };
        league.stage = 'playoff-quarters';
      }
    }

    if(league.stage === 'playoff-quarters'){
      const po = league.playoff;
      careerWorldLeaguePlayDue(po.quarters, byId, c.calendarDate, {});
      po.quarters.forEach(resolveSingle);
      if(po.quarters.every(m=>m.winnerId) && !po.semis){
        const lastDate = po.quarters.reduce((mx,m)=> m.date>mx?m.date:mx, po.quarters[0].date);
        const date = addDaysISO(lastDate, 7);
        // Cruces de semis por el bracket de arriba: (1v8) vs (4v5) vs; (2v7) vs (3v6).
        po.semis = [
          { home:po.quarters[0].winnerId, away:po.quarters[3].winnerId, date, homeScore:null, awayScore:null, played:false, wentToPenalties:false, winnerId:null },
          { home:po.quarters[1].winnerId, away:po.quarters[2].winnerId, date, homeScore:null, awayScore:null, played:false, wentToPenalties:false, winnerId:null }
        ];
        league.stage = 'playoff-semis';
      }
    }

    if(league.stage === 'playoff-semis'){
      const po = league.playoff;
      careerWorldLeaguePlayDue(po.semis, byId, c.calendarDate, {neutral:true});
      po.semis.forEach(resolveSingle);
      if(po.semis.every(m=>m.winnerId) && !po.final){
        const lastDate = po.semis.reduce((mx,m)=> m.date>mx?m.date:mx, po.semis[0].date);
        po.final = { home:po.semis[0].winnerId, away:po.semis[1].winnerId, date:addDaysISO(lastDate,7), homeScore:null, awayScore:null, played:false, wentToPenalties:false, winnerId:null };
        league.stage = 'playoff-final';
      }
    }

    if(league.stage === 'playoff-final'){
      const po = league.playoff;
      careerWorldLeaguePlayDue([po.final], byId, c.calendarDate, {neutral:true});
      resolveSingle(po.final);
      if(po.final.winnerId && !po.championId){
        po.championId = po.final.winnerId;
        if(po.championId === league.regularChampionId){
          // Mismo equipo ganó la fase regular y los playoffs: asciende directo.
          league.championId = po.championId;
          league.promotedIds = [po.championId];
          league.stage = 'definicion-lista';
        } else {
          const date = addDaysISO(po.final.date, 7);
          league.ascensoFinal = careerWorldLeagueBuildTwoLegTie(league.regularChampionId, po.championId, league.regularChampionId, date);
          league.stage = 'ascenso-final';
        }
      }
    }

    if(league.stage === 'ascenso-final'){
      const f = league.ascensoFinal;
      careerWorldLeaguePlayDue(f.legs, byId, c.calendarDate, {});
      if(f.legs.every(l=>l.played) && !f.winnerId){
        const w = careerWorldLeagueResolveTwoLegTie(f, byId);
        f.winnerId = w || (worldLeaguePenaltyWinner(byId[f.teamA].elo, byId[f.teamB].elo) === 'A' ? f.teamA : f.teamB);
        if(!w) f.wentToPenalties = true;
        league.championId = f.winnerId;
        league.promotedIds = [f.winnerId];
        league.stage = 'definicion-lista';
      }
    }

    if(league.stage === 'definicion-lista'){
      // La Cuarta es la última categoría cargada por ahora: no hay descenso que resolver acá.
      league.history.unshift({ year: league.year, championId: league.championId, championName: byId[league.championId].name });
      if(league.history.length > 15) league.history.length = 15;
      league.stage = 'done';
    }
  }
  // ---------- Uruguay: Copa Uruguay y Supercopa Uruguaya ----------
  // COPA URUGUAY. 32 equipos, eliminación directa a partido único desde dieciseisavos, con las
  // cuatro categorías de Uruguay ya cargadas:
  //   - Primera: los 16 equipos.
  //   - Segunda: los mejores URUGUAY_COPA_SEGUNDA_CUPOS (10) de la tabla de la Fase Regular al
  //     terminar la PRIMERA RUEDA (ver nota abajo).
  //   - Primera Divisional C: los 8 mejores del Torneo Final son "candidatos", pero solo 4 llegan.
  //     Se sortean entre sí en una previa a partido único (empate = penales directos) y los 4
  //     ganadores entran al cuadro.
  //   - Divisional D: los 2 mejores de la tabla del año anterior que no hayan ascendido (en la
  //     primera temporada, que no hay año anterior: Real Montevideo y Rincon). Se guardan en
  //     `copaSlotIds` de la Divisional D al armar cada temporada (careerUruguayCuartaCopaSlots).
  // Dieciseisavos: se sortea el cuadro, con la única condición de que no se crucen dos equipos de
  // Primera (son 16 de Primera y 16 de categorías menores, así que cada uno de Primera cae con uno de
  // abajo). Una vez sorteado, el cuadro queda armado (ganador 1 vs ganador 2, etc.). Todos los partidos
  // son a partido único en cancha del equipo de la categoría menor; si son de la misma categoría no
  // hay "menor", así que se juega en cancha neutral. Empate = penales directos (sin alargue, la
  // misma simplificación del resto del motor).
  // NOTA sobre Segunda: el reglamento dice "10 equipos" pero también "los primeros 6 de la primera
  // rueda"; para que el cuadro cierre en 32 (16 + 10 + 4 + 2) se toman los 10 mejores. Se cambia
  // en una sola constante (URUGUAY_COPA_SEGUNDA_CUPOS).
  // Se arma una vez por temporada de Primera, apenas están listos los datos de Segunda (1ª rueda
  // de la Fase Regular) y Primera Divisional C (Torneo Final terminado). La próxima temporada de
  // las cuatro categorías NO arranca hasta que la Copa de la temporada termina (ver
  // careerUruguayCupsDone), así hay exactamente una Copa por temporada.
  //
  // SUPERCOPA URUGUAYA. Se arma apenas termina la Primera: partido único (cancha neutral) entre el
  // Campeón Uruguayo y el campeón del Torneo Intermedio de esa misma temporada; si son el mismo
  // equipo, su rival es el subcampeón del Intermedio. Se juega antes de que arranque la temporada
  // siguiente (esa temporada tampoco arranca hasta que la Supercopa se juegue).
  const URUGUAY_COPA_STAGES = ['dieciseisavos','octavos','cuartos','semis','final'];
  const URUGUAY_COPA_LABELS = {
    previa: 'Previa de la Primera Divisional C (8 &rarr; 4)',
    dieciseisavos: 'Dieciseisavos de Final',
    octavos: 'Octavos de Final',
    cuartos: 'Cuartos de Final',
    semis: 'Semifinales',
    final: 'Final'
  };
  const URUGUAY_COPA_LEVEL_LABELS = { 1:'Primera', 2:'Segunda', 3:'Primera Divisional C', 4:'Divisional D' };
  const URUGUAY_COPA_SEGUNDA_CUPOS = 10;
  const URUGUAY_COPA_TERCERA_CANDIDATOS = 8;
  const URUGUAY_COPA_CUARTA_INICIAL = ['Real Montevideo', 'Rincon'];

  // Inicio de temporada de las ligas del exterior (Uruguay y Brasil): primer domingo de febrero.
  // Cuando se arma la temporada SIGUIENTE (`isNext`) y ese domingo del año de carrera ya pasó según
  // el calendario (la anterior terminó en noviembre o diciembre), arranca en el febrero que viene.
  // Si no, las fechas quedaban en el pasado y la temporada entera se simulaba de golpe.
  function careerWorldSeasonStart(isNext){
    const c = state.career;
    let start = careerSeasonStart(c.year, 'apertura');
    let guard = 0;
    while(isNext && c.calendarDate && start <= c.calendarDate && guard++ < 5){
      start = careerSeasonStart(Number(start.slice(0,4)) + 1, 'apertura');
    }
    return start;
  }
  // Los 2 mejores de la tabla de la Divisional D de la temporada que termina, sin contar al que
  // ascendió. Devuelve null si no hay temporada anterior (primera temporada).
  function careerUruguayCuartaCopaSlots(prevLeague){
    if(!prevLeague || !prevLeague.regular || !prevLeague.regular.table || !prevLeague.regular.table.length) return null;
    const promoted = new Set(prevLeague.promotedIds || []);
    return prevLeague.regular.table.filter(r => !promoted.has(r.id)).slice(0,2).map(r => r.id);
  }
  function careerUruguayCopaCuartaIds(C){
    const ids = new Set(C.teams.map(t => t.id));
    let out = (C.copaSlotIds || []).filter(id => ids.has(id));
    if(!C.copaSlotIds){
      URUGUAY_COPA_CUARTA_INICIAL.forEach(n => {
        const t = C.teams.find(x => x.name === n);
        if(t && !out.includes(t.id)) out.push(t.id);
      });
    }
    if(out.length < 2){
      C.teams.slice().sort((a,b) => b.elo - a.elo).forEach(t => { if(out.length < 2 && !out.includes(t.id)) out.push(t.id); });
    }
    return out.slice(0,2);
  }
  // ¿Ya están los datos para armar la Copa de esta temporada? Segunda: primera rueda de la Fase
  // Regular jugada completa. Tercera: Torneo Final jugado completo.
  function careerUruguayCopaReady(P, S, T){
    if(!P || !S || !T || !S.regular || !T.torneoFinal) return false;
    const sm = S.regular.matches, tm = T.torneoFinal.matches;
    if(!sm.length || !tm.length) return false;
    const half = Math.max.apply(null, sm.map(m => m.round)) / 2;
    return sm.filter(m => m.round <= half).every(m => m.played) && tm.every(m => m.played);
  }
  // La próxima temporada de las 4 categorías solo arranca cuando la Copa y la Supercopa de la
  // temporada actual ya terminaron.
  function careerUruguayCupsDone(P, S, T){
    const wl = careerWorldLeagues();
    const copa = wl['uruguay-copa'], sc = wl['uruguay-supercopa'];
    // Si (por algún estado raro) la Copa no se pudo armar porque faltan datos, no se traba la
    // pirámide entera esperándola.
    const copaOk = (copa && copa.primeraSeason === P.season) ? copa.stage === 'done' : !careerUruguayCopaReady(P, S, T);
    const scOk = !!(sc && sc.primeraSeason === P.season && sc.championId);
    return copaOk && scOk;
  }
  // Local de un cruce: el de la categoría menor (número de nivel más alto); si son de la misma
  // categoría, cancha neutral.
  function careerUruguayCopaMatchup(a, b, levels){
    const la = levels[a], lb = levels[b];
    if(la === lb) return { home:a, away:b, neutral:true };
    return la > lb ? { home:a, away:b, neutral:false } : { home:b, away:a, neutral:false };
  }
  function careerUruguayCopaMk(league, tag, home, away, date, neutral){
    return { id:'wl_uruguay-copa_'+league.primeraSeason+'_'+tag, home, away, date, neutral:!!neutral, homeScore:null, awayScore:null, played:false, wentToPenalties:false, winnerId:null };
  }
  function careerUruguayCopaMaxDate(matches, fallback){
    return matches.reduce((mx,m) => (m.date && m.date > mx) ? m.date : mx, fallback);
  }
  function careerEnsureCopaUruguay(){
    const wl = careerWorldLeagues();
    const P = wl['uruguay-primera'], S = wl['uruguay-segunda'], T = wl['uruguay-tercera'], C = wl['uruguay-cuarta'];
    if(!P || !S || !T || !C) return;
    let copa = wl['uruguay-copa'];
    if(!copa || (copa.stage === 'done' && copa.primeraSeason !== P.season)){
      if(careerUruguayCopaReady(P, S, T)) careerWorldLeagueBuildUruguayCopa(P, S, T, C);
      copa = wl['uruguay-copa'];
    }
    if(copa && copa.stage !== 'done') careerWorldLeagueCatchUpUruguayCopa(copa);
  }
  function careerWorldLeagueBuildUruguayCopa(P, S, T, C){
    const c = state.career;
    const wl = careerWorldLeagues();
    const prev = wl['uruguay-copa'];
    // Segunda: mejores N de la tabla al cierre de la primera rueda de la Fase Regular.
    const half = Math.max.apply(null, S.regular.matches.map(m => m.round)) / 2;
    const segTable = computeGenericStandings(S.regular.matches.filter(m => m.round <= half), S.teams);
    const segIds = segTable.slice(0, URUGUAY_COPA_SEGUNDA_CUPOS).map(r => r.id);
    // Primera Divisional C: 8 mejores del Torneo Final (candidatos a la previa).
    const tById = {}; T.teams.forEach(t => tById[t.id] = t);
    const terTable = computeGenericStandings(T.torneoFinal.matches, T.torneoFinal.teamIds.map(id => tById[id]));
    const terIds = terTable.slice(0, URUGUAY_COPA_TERCERA_CANDIDATOS).map(r => r.id);
    // Divisional D: los 2 lugares (ver careerUruguayCuartaCopaSlots).
    const cuaIds = careerUruguayCopaCuartaIds(C);
    const pick = (L, ids) => ids.map(id => L.teams.find(t => t.id === id)).filter(Boolean);
    const teamsP = P.teams.slice(), teamsS = pick(S, segIds), teamsT = pick(T, terIds), teamsC = pick(C, cuaIds);
    const levels = {};
    teamsP.forEach(t => levels[t.id] = 1);
    teamsS.forEach(t => levels[t.id] = 2);
    teamsT.forEach(t => levels[t.id] = 3);
    teamsC.forEach(t => levels[t.id] = 4);
    const league = {
      key:'uruguay-copa', country:'Uruguay', name:'Copa Uruguay', format:'uruguay-copa',
      season: (prev && prev.season) ? prev.season + 1 : 1,
      primeraSeason: P.season, year: P.year,
      // Mismos objetos de equipo que usan las ligas (así el ELO de los partidos de Copa también
      // se refleja en ellas mientras dure la temporada).
      teams: [].concat(teamsP, teamsS, teamsT, teamsC), levels,
      qualified: { primera: teamsP.map(t=>t.id), segunda: teamsS.map(t=>t.id), tercera: teamsT.map(t=>t.id), cuarta: teamsC.map(t=>t.id) },
      previa: { matches: [], advancedIds: [] },
      rounds: [], stage: 'previa',
      championId: null, runnerUpId: null,
      history: (prev && prev.history) ? prev.history.slice() : []
    };
    // Previa de la Primera Divisional C: los 8 candidatos se sortean entre sí, un solo partido
    // (el primero sorteado es local), penales directos si empatan.
    const date = nextWeekdayAfter(c.calendarDate || careerSeasonStart(c.year, 'apertura'), 3);

    });
    if(league.semis){
      html += `<div class="panel"><h3>Semifinales</h3><p class="hint">Ida y vuelta; el mejor clasificado juega la vuelta de local. Si empatan el global, penales.</p>`;

        html += `<div class="cs-fixture-card"><div>${escapeHtml(A.name)} ${seedTxt(tie.teamA)} vs ${escapeHtml(B.name)} ${seedTxt(tie.teamB)}<div class="hint" style="font-size:11.5px;">ida en cancha de ${escapeHtml(B.name)}, vuelta en cancha de ${escapeHtml(A.name)}</div></div><div class="num">${legs}${win}</div></div>`;

    if(league.final){
      const f = league.final;

      html += `<div class="panel"><h3>Final</h3><p class="hint">Partido único en cancha neutral; si empatan, penales.</p><div class="cs-fixture-card"><div>${escapeHtml(byId[f.home].name)} vs ${escapeHtml(byId[f.away].name)}</div><div class="num">${res}</div></div></div>`;

      html += `<div class="msg" style="background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.4);color:var(--gold-bright);">&#127942; Campeón de la Copa de la Liga ${league.year}: <strong>${escapeHtml(byId[league.championId].name)}</strong></div>`;
      html += `<div class="panel"><p class="hint">Cupo a la fase de grupos de la Copa Libertadores: ${league.libertadoresListo ? (league.libertadoresId ? `<strong style="color:var(--ink);">${escapeHtml(byId[league.libertadoresId].name)}</strong>${league.libertadoresId !== league.championId ? ' (el campeón ya clasificó por la tabla de la Liga, así que el cupo pasa al siguiente)' : ''}` : 'sin definir') : 'se define al terminar la Liga de Primera (si el campeón ya clasificó por la tabla, pasa al subcampeón, y así sucesivamente).'}</p></div>`;

  // Íconos de país para las tarjetas de "Ligas del Mundo" (fallback: globo terráqueo).
  const COUNTRY_FLAGS = { 'Brasil': '&#127463;&#127479;', 'Uruguay': '&#127482;&#127466;', 'Chile': '&#127464;&#127473;' };
  // Tarjeta clicable genérica, misma pinta que competitionCard pero con una data-action propia.
  function worldNavCard(icon, title, subtitle, action, dataAttrs){
    return `<div class="cs-comp-card" data-action="${action}" ${dataAttrs}>
      <div class="cc-icon">${icon}</div>
      <div class="cc-title">${escapeHtml(title)}</div>
      <div class="cc-sub">${subtitle}</div>
      <div class="cc-cta">Ver &rarr;</div>

  // Frase de estado de una liga/copa para las tarjetas de selección de competición.
  function worldLeagueStatusLabel(league){
    const byId = {}; league.teams.forEach(t=>byId[t.id]=t);
    if(league.format === 'chile-copa-liga'){
      if(league.stage === 'done' || league.championId) return `Campeón: ${escapeHtml(byId[league.championId].name)}`;
      if(league.stage === 'grupos'){
        const jugadas = Math.max.apply(null, CHILE_COPA_LIGA_GRUPO_ORDEN.map(g => league.grupos[g].matches.filter(m => m.played).length)) / 2;
        return jugadas > 0 ? `Fase de grupos (${Math.min(6, Math.ceil(jugadas))}/6 fechas)` : 'Fase de grupos';
      }
      return league.stage === 'semis' ? 'Semifinales' : 'Final';
    }
    if(league.format === 'uruguay-primera'){
      if(league.stage === 'done' || league.championId) return `Campeón Uruguayo ${league.year}: ${escapeHtml(byId[league.championId].name)}`;
      const labels = { apertura:'Torneo Apertura', 'intermedio-series':'Torneo Intermedio (series)', 'intermedio-final':'Final del Intermedio', clausura:'Torneo Clausura', 'definicion-semifinal':'Definición del título (semifinal)', 'definicion-final':'Definición del título (final)' };
      return labels[league.stage] || 'En juego';
    }
    if(league.format === 'uruguay-segunda'){
      if(league.stage === 'done' || league.championId) return `Campeón de Segunda ${league.year}: ${escapeHtml(byId[league.championId].name)}`;
      const labels = { competencia:'Torneo Competencia (zonas)', 'competencia-final':'Final del Competencia', regular:'Fase Regular', 'playoff-semis':'Reducido de ascenso (semifinales)', 'playoff-final':'Reducido de ascenso (final)' };
      return labels[league.stage] || 'En juego';
    }
    if(league.format === 'uruguay-tercera'){
      if(league.stage === 'done' || league.championId) return `Campeón de Primera Divisional C ${league.year}: ${escapeHtml(byId[league.championId].name)}`;
      const labels = { series:'Series (Torneo Inicial)', final:'Torneo Final / Torneo Inicial', 'segundo-ascenso':'Definición del segundo ascenso' };
      return labels[league.stage] || 'En juego';
    }
    if(league.format === 'uruguay-cuarta'){
      if(league.stage === 'done' || league.championId) return `Asciende a la Tercera ${league.year}: ${escapeHtml(byId[league.championId].name)}`;
      const labels = { regular:'Fase Regular', 'playoff-quarters':'Playoffs (cuartos)', 'playoff-semis':'Playoffs (semifinales)', 'playoff-final':'Playoffs (final)', 'ascenso-final':'Final de ascenso' };
      return labels[league.stage] || 'En juego';
    }
    if(league.format === 'uruguay-copa'){
      if(league.stage === 'done' || league.championId) return `Campeón: ${escapeHtml(byId[league.championId].name)}`;
      if(league.stage === 'previa') return `${URUGUAY_COPA_LABELS.previa} en curso`;
      const ko = league.rounds[league.rounds.length-1];
      return `${URUGUAY_COPA_LABELS[ko.stage] || ko.stage} en curso`;
    }
    if(league.format === 'uruguay-supercopa'){
      if(league.championId) return `Campeón: ${escapeHtml(byId[league.championId].name)}`;
      if(!league.match) return `Pendiente`;
      return league.match.played ? `Jugado` : `Se juega el ${formatCareerDate(league.match.date)}`;
    }
    if(league.format === 'copa-eliminacion'){
      if(league.championId) return `Campeón: ${escapeHtml(byId[league.championId].name)}`;
      const ko = league.knockoutRounds[league.knockoutRounds.length-1];
      return `${COPA_BRASIL_LABELS[ko.stage] || ko.stage} en curso`;
    }
    if(league.format === 'partido-unico'){
      if(league.championId) return `Campeón: ${escapeHtml(byId[league.championId].name)}`;
      if(!league.match) return `Pendiente de los dos campeones de este año`;
      return league.match.played ? `Jugado` : `Se juega el ${formatCareerDate(league.match.date)}`;
    }
    if(league.format === 'grupos-multiples'){
      const grupos = Object.values(league.grupos);
      const total = grupos.reduce((s,g)=>s+g.matches.length,0);
      const jugados = grupos.reduce((s,g)=>s+g.matches.filter(m=>m.played).length,0);
      if(league.championId) return `Campeón: ${escapeHtml(byId[league.championId].name)} &middot; Ascienden: ${escapeHtml((league.promotedIds||[]).map(id=>byId[id].name).join(', '))}`;
      if(league.promotedIds && league.promotedIds.length) return `Jugando semifinales/final &middot; Ascienden: ${escapeHtml(league.promotedIds.map(id=>byId[id].name).join(', '))}`;
      if(league.stage === 'knockout'){
        const ko = league.knockoutRounds[league.knockoutRounds.length-1];
        return `Eliminatoria de ascenso &middot; ${KO_GRUPOS_LABELS[ko.stage] || ko.stage}`;
      }
      if(jugados === 0) return `Todavía no arrancó &middot; ${grupos.length} grupos de 6 equipos`;
      if(jugados === total) return `Fase de grupos completa &middot; arrancando la eliminatoria de ascenso`;
      return `Fase de grupos &middot; ${jugados}/${total} partidos jugados`;
    }
    const jugados = league.matches.filter(m=>m.played).length;
    const total = league.matches.length;
    const totalRounds = total ? Math.max(...league.matches.map(m=>m.round)) : 0;
    const roundsWithPlay = league.matches.filter(m=>m.played).map(m=>m.round);
    const currentRound = roundsWithPlay.length ? Math.max(...roundsWithPlay) : 0;
    if(league.format === 'fases-grupos'){
      if(league.championId) return `Campeón: ${escapeHtml(byId[league.championId].name)} &middot; Ascienden: ${escapeHtml(league.promotedIds.map(id=>byId[id].name).join(', '))}`;
      if(league.stage === 'final') return `Jugando la final &middot; Ascienden: ${escapeHtml(league.promotedIds.map(id=>byId[id].name).join(', '))}`;
      if(league.stage === 'fase2') return `Fase 2 en curso`;
      if(jugados === 0) return `Todavía no arrancó &middot; Fase 1 (${totalRounds} fechas)`;
      return `Fase 1 &middot; Fecha ${currentRound} de ${totalRounds} &middot; ${jugados}/${total} partidos jugados`;
    }
    if(league.playoff && league.playoff.resolved){
      return `Campeón: ${escapeHtml(byId[league.championId].name)} &middot; Ascienden: ${escapeHtml(league.promotedIds.map(id=>byId[id].name).join(', '))}`;
    }
    if(league.championId){
      const champTeam = league.teams.find(t=>t.id===league.championId);
      return `Campeón: ${escapeHtml(champTeam ? champTeam.name : '')}${league.promocionPlayoff ? ' &middot; Jugando el reducido de ascenso' : ''}`;
    }
    if(jugados === 0) return `Todavía no arrancó &middot; ${totalRounds} fechas en total`;
    return `Fecha ${currentRound} de ${totalRounds} &middot; ${jugados}/${total} partidos jugados`;
  }
  // Fila simple (no editable) de un partido de liga del mundo, para las pestañas de Fixture y
  // Resultados: solo muestra local, visitante y resultado (si ya se jugó), sin botones de
  // simular ni confirmar porque estos partidos se juegan solos.
  function renderWorldMatchRow(m, byId){
    const home = byId[m.home], away = byId[m.away];
    if(!home || !away) return '';
    return `<div class="cs-fixture-card">
      <div>${escapeHtml(home.name)} <span class="num" style="color:var(--ink-dim);">(${home.elo})</span> &nbsp;vs&nbsp; ${escapeHtml(away.name)} <span class="num" style="color:var(--ink-dim);">(${away.elo})</span></div>
      <div class="num">${m.played ? `${m.homeScore} &ndash; ${m.awayScore}` : '&mdash;'}</div>
    </div>`;

  // Pestaña de Fixture o Resultados para una lista de partidos con su propio contexto de
  // navegación por fecha (reutiliza el mismo mecanismo de fixtureNav que el resto de la carrera).
  function renderWorldLeagueMatchesTab(ctx, matches, byId, mode){
    if(!matches.length) return `<div class="panel"><p class="hint">Todavía no hay partidos.</p></div>`;
    const rounds = [...new Set(matches.map(m=>m.round))].sort((a,b)=>a-b);
    const total = rounds.length;
    if(!state.career.fixtureNav) state.career.fixtureNav = {};
    if(state.career.fixtureNav[ctx] === undefined){
      if(mode === 'resultados'){
        const played = matches.filter(m=>m.played).map(m=>m.round);
        state.career.fixtureNav[ctx] = played.length ? Math.max(...played) : rounds[0];
      } else {
        const pending = matches.filter(m=>!m.played).map(m=>m.round);
        state.career.fixtureNav[ctx] = pending.length ? Math.min(...pending) : rounds[rounds.length-1];
      }
    }
    const cur = ensureCareerRoundPointer(ctx, total);
    let curMatches = matches.filter(m=>m.round===cur);
    if(mode === 'resultados') curMatches = curMatches.filter(m=>m.played);
    let html = `<div class="panel"><h3>${mode==='resultados'?'Resultados':'Fixture'} &mdash; Fecha ${cur} de ${total}</h3>`;
    html += renderRoundNav(ctx, cur, total, 'Fecha', 'career-nav-round');
    if(!curMatches.length){
      html += `<p class="hint">${mode==='resultados' ? 'Todavía no se jugó ningún partido en esta fecha.' : 'No hay partidos programados en esta fecha.'}</p>`;
    } else {
      html += curMatches.map(m=>renderWorldMatchRow(m, byId)).join('');
    }
    html += `</div>`;
    return html;
  }
  // Junta, para las pestañas de Fixture/Resultados, todos los partidos de una liga sin importar
  // la etapa (fase 1, grupos de fase 2, final), así se ve todo el calendario de una sola vez.
  function worldLeagueAllMatchesFlat(league){
    let matches = league.matches ? league.matches.slice() : [];
    if(league.fase2Groups) Object.values(league.fase2Groups).forEach(g => { matches = matches.concat(g.matches); });
    if(league.final) matches = matches.concat(league.final.legs);
    return matches;
  }
  // Grilla de los 16 grupos de la Serie D, cada uno como tarjeta clicable con su estado.

  // Tabla de un grupo de la Serie D: los 4 primeros clasifican a la eliminatoria de ascenso

  // Cuadro de eliminatoria de ascenso de la Serie D: una tarjeta por ronda (Segunda Fase, Tercera

  // Tarjeta de la Supercopa: un único partido (o directamente el bicampeón, sin partido, si el

  function renderWorldLeagueSupercopa(league){

    }
    if(!league.match) return `<div class="panel"><p class="hint">Se arma apenas estén el campeón del Brasileirão y el de la Copa do Brasil de este año.</p></div>`;
    const m = league.match;
    const teamA = byIdAll[m.home], teamB = byIdAll[m.away];
    let html = `<div class="panel"><div class="cs-fixture-card"><div>${escapeHtml(teamA.name)} vs ${escapeHtml(teamB.name)}</div><div class="num">${m.played ? `${m.homeScore} &ndash; ${m.awayScore}` : '&mdash;'}</div></div>`;
    if(league.championId){
      html += `<p class="hint" style="margin-top:10px;">&#127942; Campeón de la Supercopa do Brasil ${league.year}: <strong>${escapeHtml(byIdAll[league.championId].name)}</strong>${league.wentToPenalties?' (penales)':''}</p>`;
    }
    html += `</div>`;
    return html;
  }
  // ---------- Ligas del Mundo: navegación en 3-4 niveles (país -> competición -> [grupo] -> pestaña) ----------
  function renderCareraLigasMundo(){
    const c = state.career;
    careerEnsureWorldLeagues();
    const wl = careerWorldLeagues();
    if(WORLD_LEAGUES_REGISTRY.length === 0){
      return `<div class="panel"><h2>Ligas del Mundo</h2><p class="hint">Las ligas que no son de Argentina se juegan solas en segundo plano, fecha a fecha, en paralelo al torneo local.</p></div><div class="panel cs-stub"><div class="big">&#127758;</div><h2>Todavía no hay ligas cargadas</h2><p class="hint">A medida que se sumen los formatos de cada país, sus ligas y copas van a aparecer acá.</p></div>`;
    }
    const byCountry = {};
    WORLD_LEAGUES_REGISTRY.forEach(def => {
      if(!byCountry[def.country]) byCountry[def.country] = [];
      byCountry[def.country].push(def);
    });

    // Nivel 1: elegir país.
    if(!c.wlPais || !byCountry[c.wlPais]){
      let html = `<div class="panel"><h2>Ligas del Mundo</h2><p class="hint">Las ligas que no son de Argentina se juegan solas en segundo plano, fecha a fecha, en paralelo al torneo local. Elegí un país para ver sus divisiones y copas por separado.</p></div>`;
      html += `<div class="cs-comp-grid">`;
      Object.keys(byCountry).forEach(country => {
        const defs = byCountry[country];
        html += worldNavCard(COUNTRY_FLAGS[country] || '&#127760;', country, `${defs.length} competici${defs.length===1?'ón':'ones'}`, 'career-wl-set-pais', `data-pais="${escapeHtml(country)}"`);
      });
      html += `</div>`;
      return html;
    }

    const defs = byCountry[c.wlPais];

    // Nivel 2: elegir competición dentro del país.
    if(!c.wlComp || !defs.find(d=>d.key===c.wlComp)){
      let html = `<div class="panel">
        <div class="btn-row" style="margin-top:0;"><button class="btn ghost small" data-action="career-wl-back-pais">&larr; Ligas del Mundo</button></div>
        <h2>${escapeHtml(c.wlPais)}</h2>
        <p class="hint">Elegí una división o copa para ver su tabla, fixture y resultados.</p>
      </div>`;
      html += `<div class="cs-comp-grid">`;
      defs.forEach(def => {
        const league = wl[def.key];
        html += worldNavCard('&#127942;', def.name, league ? worldLeagueStatusLabel(league) : 'Todavía no arrancó', 'career-wl-set-comp', `data-comp="${escapeHtml(def.key)}"`);
      });
      html += `</div>`;
      return html;
    }

    const def = defs.find(d=>d.key===c.wlComp);
    const league = wl[def.key];
    if(!league){
      // Competición todavía sin armar: siempre con botones para volver, así no queda trabada.
      return `<div class="panel"><div class="btn-row" style="margin-top:0;">
        <button class="btn ghost small" data-action="career-wl-back-pais">&larr; Ligas del Mundo</button>
        <button class="btn ghost small" data-action="career-wl-back-comp">&larr; ${escapeHtml(c.wlPais)}</button>
      </div><h2>${escapeHtml(def.name)}</h2><p class="hint">${def.pendingHint || 'Todavía no se armó esta competición.'}</p></div>`;
    }

    const backBar = `<div class="btn-row" style="margin-top:0;">
      <button class="btn ghost small" data-action="career-wl-back-pais">&larr; Ligas del Mundo</button>
      <button class="btn ghost small" data-action="career-wl-back-comp">&larr; ${escapeHtml(c.wlPais)}</button>
      ${league.format==='grupos-multiples' && c.wlGrupo ? `<button class="btn ghost small" data-action="career-wl-back-grupo">&larr; ${escapeHtml(league.name)}</button>` : ''}
    </div>`;

    // Copa do Brasil y Supercopa do Brasil: eliminatoria/partido único sin pestañas de Tabla, ya
    // que no hay una tabla de posiciones que mostrar, solo el cuadro (o el partido) en sí.
    if(league.format === 'copa-eliminacion' || league.format === 'partido-unico' || league.format === 'uruguay-copa' || league.format === 'uruguay-supercopa' || league.format === 'chile-copa-liga'){
      let html = `<div class="panel">${backBar}<h2>${escapeHtml(league.name)} ${league.year}</h2><p class="hint">${worldLeagueStatusLabel(league)}</p></div>`;
      if(league.format === 'copa-eliminacion') html += renderWorldLeagueKnockoutCopa(league);
      else if(league.format === 'uruguay-copa') html += renderWorldLeagueUruguayCopa(league);
      else if(league.format === 'uruguay-supercopa') html += renderWorldLeagueUruguaySupercopa(league);
      else if(league.format === 'chile-copa-liga') html += renderWorldLeagueChileCopaLiga(league);
      else html += renderWorldLeagueSupercopa(league);
      if(league.history && league.history.length > 1){
        const rows = league.history.slice(1).map(h => `<tr><td class="num">${h.year}</td><td>${escapeHtml(h.championName)}</td></tr>`).join('');
        html += `<div class="panel"><h3>Campeones anteriores</h3><table><thead><tr><th>Año</th><th>Campeón</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }
      return html;
    }

    // Primera, Segunda, Tercera y Cuarta de Uruguay: formato propio, todo en un solo panel.
    if(league.format === 'uruguay-primera' || league.format === 'uruguay-segunda' || league.format === 'uruguay-tercera' || league.format === 'uruguay-cuarta'){
      let html = `<div class="panel">${backBar}<h2>${escapeHtml(league.name)} ${league.year}</h2><p class="hint">${worldLeagueStatusLabel(league)}</p></div>`;
      if(league.format === 'uruguay-primera') html += renderWorldLeagueUruguay(league);
      else if(league.format === 'uruguay-segunda') html += renderWorldLeagueUruguaySegunda(league);
      else if(league.format === 'uruguay-tercera') html += renderWorldLeagueUruguayTercera(league);
      else html += renderWorldLeagueUruguayCuarta(league);
      if(league.history && league.history.length > 1){
        const rows = league.history.slice(1).map(h => `<tr><td class="num">${h.year}</td><td>${escapeHtml(h.championName)}</td></tr>`).join('');
        html += `<div class="panel"><h3>Campeones anteriores</h3><table><thead><tr><th>Año</th><th>Campeón</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }
      return html;
    }

    // Serie D (y cualquier otro formato de grupos múltiples): primero hay que elegir el grupo.
    if(league.format === 'grupos-multiples' && (!c.wlGrupo || !league.grupos[c.wlGrupo])){
      let html = `<div class="panel">${backBar}<h2>${escapeHtml(league.name)} ${league.year}</h2><p class="hint">${worldLeagueStatusLabel(league)}</p></div>`;
      html += renderWorldLeagueGruposGrid(league);
      html += renderWorldLeagueKnockoutGrupos(league);
      if(league.history && league.history.length > 1){
        const rows = league.history.slice(1).map(h => `<tr><td class="num">${h.year}</td><td>${escapeHtml(h.championName)}</td></tr>`).join('');
        html += `<div class="panel"><h3>Campeones anteriores</h3><table><thead><tr><th>Año</th><th>Campeón</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }
      return html;
    }

    if(!c.wlTab) c.wlTab = 'tabla';
    const byIdAll = {}; league.teams.forEach(t=>byIdAll[t.id]=t);
    let titulo = league.name, subtitulo = worldLeagueStatusLabel(league);
    let matches, tablaHtml;
    if(league.format === 'grupos-multiples'){
      const g = league.grupos[c.wlGrupo];
      titulo = `${league.name} &middot; ${g.nombre}`;
      const jugados = g.matches.filter(m=>m.played).length, total = g.matches.length;
      subtitulo = jugados===total ? 'Fase de grupos completa' : `${jugados}/${total} partidos jugados`;
      matches = g.matches;
      tablaHtml = g.table.length ? `<div class="panel">${renderWorldLeagueGrupoDTable(g, byIdAll)}</div>` : `<div class="panel"><p class="hint">Todavía no hay tabla.</p></div>`;
    } else {
      matches = worldLeagueAllMatchesFlat(league);
      tablaHtml = league.format === 'fases-grupos' ? renderWorldLeagueFasesGrupos(league) : `<div class="panel">${renderWorldLeagueTable(league)}</div>${renderWorldLeaguePlayoff(league)}`;
      if(def.clasificacionNota) tablaHtml += `<div class="panel"><p class="hint">${def.clasificacionNota}</p></div>`;
    }
    const ctxBase = league.format === 'grupos-multiples' ? `wl_${def.key}_${c.wlGrupo}` : `wl_${def.key}`;

    let html = `<div class="panel">${backBar}<h2>${titulo} ${league.year}</h2><p class="hint">${subtitulo}</p></div>`;
    html += `<div class="btn-row" style="margin-top:0;">
      <button class="btn small ${c.wlTab==='tabla'?'primary':'ghost'}" data-action="career-wl-set-tab" data-tab="tabla">Tabla</button>
      <button class="btn small ${c.wlTab==='fixture'?'primary':'ghost'}" data-action="career-wl-set-tab" data-tab="fixture">Fixture</button>
      <button class="btn small ${c.wlTab==='resultados'?'primary':'ghost'}" data-action="career-wl-set-tab" data-tab="resultados">Resultados</button>
    </div>`;

    if(c.wlTab === 'fixture') html += renderWorldLeagueMatchesTab(ctxBase+'_fx', matches, byIdAll, 'fixture');
    else if(c.wlTab === 'resultados') html += renderWorldLeagueMatchesTab(ctxBase+'_res', matches, byIdAll, 'resultados');
    else html += tablaHtml;

    if(league.format !== 'grupos-multiples' && league.history && league.history.length > 1){
      const rows = league.history.slice(1).map(h => `<tr><td class="num">${h.year}</td><td>${escapeHtml(h.championName)}</td></tr>`).join('');
      html += `<div class="panel"><h3>Campeones anteriores</h3><table><thead><tr><th>Año</th><th>Campeón</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    return html;
  }

  // ---------- Historial de Campeones ----------
  const COMPETITION_LABELS = {
    apertura: 'Torneo Apertura',
    clausura: 'Torneo Clausura',
    'trofeo-campeones': 'Trofeo de Campeones',
    'copa-argentina': 'Copa Argentina',
    'supercopa-argentina': 'Supercopa Argentina',
    libertadores: 'Copa Libertadores',
    sudamericana: 'Copa Sudamericana',
    'supercopa-internacional': 'Supercopa Internacional',
    nacional: 'Primera Nacional (ascenso)',
    bmetro: 'B Metropolitana (ascenso)',
    federal: 'Federal A (ascenso)',
    primerac: 'Primera C (ascenso)',
    'promocional-apertura': 'Promocional Amateur — Apertura',
    'promocional-clausura': 'Promocional Amateur — Clausura'
  };
  const COMPETITION_ORDER = ['apertura','clausura','trofeo-campeones','copa-argentina','supercopa-argentina','libertadores','sudamericana','supercopa-internacional','nacional','bmetro','federal','primerac','promocional-apertura','promocional-clausura'];
  function renderCareraHistorialCampeones(){
    const c = state.career;
    const titles = c.titles || [];
    let html = `<div class="panel"><h2>Historia</h2><p class="hint">Campeones de cada competición, temporada por temporada.</p></div>`;
    let any = false;
    COMPETITION_ORDER.forEach(key => {
      const list = titles.filter(t=>t.competition===key).slice().sort((a,b)=>b.year-a.year);
      if(!list.length) return;
      any = true;
      html += `<div class="cs-section-title">${COMPETITION_LABELS[key] || key}</div>`;
      html += `<div class="table-scroll"><table><thead><tr><th>Año</th><th>Campeón</th></tr></thead><tbody>`;
      list.forEach(t => {
        const team = careerTeamById(t.teamId);
        const name = t.teamName || (team ? team.name : null) || 'Equipo no disponible';
        html += `<tr><td class="num">${t.year}</td><td><div style="display:flex;align-items:center;gap:8px;">${teamBadgeHtml({name},20)}<span>${escapeHtml(name)}</span></div></td></tr>`;
      });
      html += `</tbody></table></div>`;
    });
    if(!any) html += `<div class="panel"><p class="hint">Todavía no hay campeones registrados en esta carrera.</p></div>`;
    return html;
  }

  function renderCopaSlot(title, hint, comp){
    const c = state.career;
    careerMaybeBuildTrofeo();
    careerMaybeBuildSupercopaArgentina();
    careerMaybeBuildSupercopaInternacional();
    const titleWinner = careerGetTitle(c.year, comp);
    const match = (c.cupMatches||[]).find(m=>m.comp===comp && m.year===c.year);
    let inner;
    if(titleWinner){
      inner = `<p class="hint">Campeón: <strong style="color:var(--ink);">${escapeHtml(careerTeamById(titleWinner).name)}</strong></p>`;
    } else if(match){
      inner = renderCareerMatchRow(match, null);
    } else {
      inner = `<p class="hint">${hint}</p>`;
    }
    return `<div class="panel"><h2>${title} ${c.year}</h2>${inner}</div>`;
  }

  // Ascensos y descensos de todas las categorías al cerrar la temporada anterior.
  function renderResumenMovimientos(){
    const c = state.career;
    const mov = c.lastMovements;
    if(!mov) return '';
    const nombres = ids => (ids || []).map(careerNombre).join(', ');
    const filas = [];
    if(mov.subenAPrimera && mov.subenAPrimera.length) filas.push(['Primera División', 'Ascienden', nombres(mov.subenAPrimera)]);
    if(mov.bajanANacional && mov.bajanANacional.length) filas.push(['Primera División', 'Descienden', nombres(mov.bajanANacional)]);
    if(mov.subenANacional && mov.subenANacional.length) filas.push(['Primera Nacional', 'Ascienden', nombres(mov.subenANacional)]);
    if(mov.bajanDeNacional && mov.bajanDeNacional.length) filas.push(['Primera Nacional', 'Descienden', nombres(mov.bajanDeNacional)]);
    if(mov.subenALaB && mov.subenALaB.length) filas.push(['Primera B Metropolitana', 'Ascienden', nombres(mov.subenALaB)]);
    if(mov.bajanDeB && mov.bajanDeB.length) filas.push(['Primera B Metropolitana', 'Descienden', nombres(mov.bajanDeB)]);
    if(mov.bajanDeFederal && mov.bajanDeFederal.length) filas.push(['Torneo Federal A', 'Descienden', nombres(mov.bajanDeFederal)]);
    if(mov.subeALaC) filas.push(['Primera C Metropolitana', 'Asciende (campeón del Promocional Apertura)', careerNombre(mov.subeALaC)]);
    if(mov.desafiliado) filas.push(['Primera C Metropolitana', 'Desafiliado', careerNombre(mov.desafiliado)]);
    if(mov.promocion) filas.push(['Promoción C / Promocional', 'Asciende a la Primera C', careerNombre(mov.promocion)]);
    if(!filas.length) return '';
    const rows = filas.map(([cat, tipo, quien]) => `<tr><td>${escapeHtml(cat)}</td><td>${escapeHtml(tipo)}</td><td>${quien}</td></tr>`).join('');
    return `<div class="panel">
      <h2>Movimientos de fin de temporada ${mov.year}</h2>
      <p class="hint">Ascensos y descensos entre las seis categorías al pasar del Clausura ${mov.year} al Apertura ${mov.year+1}.</p>
      <table><thead><tr><th>Categoría</th><th>Movimiento</th><th>Equipos</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }

  function renderCareraCopasNacionales(){
    const c = state.career;
    const desc = careerComputeDescensos();
    let html = renderResumenMovimientos();
    html += `<div class="panel"><h2>Tabla Anual ${c.year}</h2><p class="hint">Suma los puntos de fase regular del Apertura y el Clausura (no cuenta la fase eliminatoria). El último desciende a la Primera Nacional.</p>${renderAnnualTable(desc.annual, desc.relegatedAnnual)}</div>`;
    html += `<div class="panel"><h2>Tabla de Promedios</h2><p class="hint">Promedio de puntos por partido de las últimas hasta 3 temporadas. El último también desciende (si coincide con el último de la Tabla Anual, desciende el penúltimo de esa tabla en su lugar).</p>${renderPromediosTable(desc.promedios, desc.relegatedPromedios)}</div>`;
    html += renderClasificacionCopasBlock();
    html += renderCopaSlot('Trofeo de Campeones', 'Se define cuando estén los campeones de Apertura y Clausura de este año.', 'trofeo-campeones');
    html += renderCopaSlot('Supercopa Argentina', 'Se define cuando estén el campeón del Trofeo de Campeones y el de la Copa Argentina.', 'supercopa-argentina');
    html += renderCopaSlot('Supercopa Internacional', 'Se define cuando termine la temporada (Clausura) y esté el campeón del Trofeo de Campeones.', 'supercopa-internacional');
    return html;
  }

  // ---------- Init ----------
  (function initApp(){
    const idx = loadIndex();
    if(idx.length > 0){
      state.step = 'menu';
    } else {
      newTournament();
    }
  })();
  render();
  // Los escudos guardados se leen de IndexedDB de forma asíncrona: cuando llegan se redibuja.
  crestLoadAll().then(function(){ render(); });
})();
</script>
</body>
</html>
