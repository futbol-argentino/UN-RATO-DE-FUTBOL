  // Tabla Anual (excluyendo a los que ya clasificaron a la Libertadores).
  function careerLibertadoresArgQualifiers(){
    const c = state.career;
    const annual = careerAnnualTable();
    const libertadores = [];
    const aptChamp = careerGetTitle(c.year,'apertura');
    const clzChamp = careerGetTitle(c.year,'clausura');
    if(aptChamp) libertadores.push(aptChamp);
    if(clzChamp && !libertadores.includes(clzChamp)) libertadores.push(clzChamp);
    annual.slice(0,3).forEach(r => { if(!libertadores.includes(r.id)) libertadores.push(r.id); });
    const copaChamp = (c.copaArgentina && c.copaArgentina.champion && c.copaArgentina.champion.year===c.year) ? c.copaArgentina.champion.teamId : null;
    if(copaChamp && !libertadores.includes(copaChamp)) libertadores.push(copaChamp);
    return libertadores;
  }
  function careerSudamericanaArgQualifiers(){
    const annual = careerAnnualTable();
    const libertadores = careerLibertadoresArgQualifiers();
    return annual.slice(3,10).map(r=>r.id).filter(id=>!libertadores.includes(id));
  }
  function careerBuildContinentalCup(cupKey, argIds){
    const c = state.career;
    const need = Math.max(0, 16 - argIds.length);
    const foreign = careerPickForeignTeams(need, []);
    c[cupKey] = { foreignTeams: foreign, matches: [], built: true, champion: null };
    const pool = argIds.concat(foreign.map(t=>t.id));
    const seeded = shuffleArr(pool.slice());
    const pairs = buildFirstKnockoutRound(seeded);
    const date = nextWeekdayAfter(c.calendarDate || careerSeasonStart(c.year, c.tournament), 3);
    pairs.forEach(p => c[cupKey].matches.push(careerMkMatch(cupKey, null, 1, p.home, p.away, {stage:'octavos', neutral:true, date})));
  }
  function careerBuildLibertadores(){
    const c = state.career;
    if(c.libertadores && c.libertadores.built) return;
    careerBuildContinentalCup('libertadores', careerLibertadoresArgQualifiers());
  }
  function careerBuildSudamericana(){
    const c = state.career;
    if(c.sudamericana && c.sudamericana.built) return;
    const argIds = careerSudamericanaArgQualifiers();
    const need = Math.max(0, 16 - argIds.length);
    const usedForeignNames = (c.libertadores && c.libertadores.foreignTeams) ? c.libertadores.foreignTeams.map(t=>t.name) : [];
    const foreign = careerPickForeignTeams(need, usedForeignNames);
    c.sudamericana = { foreignTeams: foreign, matches: [], built: true, champion: null };
    const pool = argIds.concat(foreign.map(t=>t.id));
    const seeded = shuffleArr(pool.slice());
    const pairs = buildFirstKnockoutRound(seeded);
    const date = nextWeekdayAfter(c.calendarDate || careerSeasonStart(c.year, c.tournament), 3);
    pairs.forEach(p => c.sudamericana.matches.push(careerMkMatch('sudamericana', null, 1, p.home, p.away, {stage:'octavos', neutral:true, date})));
  }
  function careerAdvanceContinental(cupKey, fromStage){
    const c = state.career;
    const bucket = c[cupKey];
    if(!bucket) return;
    const stages = CONTINENTAL_STAGES;
    const nextStage = stages[stages.indexOf(fromStage)+1];
    if(!nextStage) return;
    const matches = bucket.matches.filter(m=>m.stage===fromStage);
    const winners = matches.map(m=>careerMatchWinner(m));
    const fromDate = (matches.length && matches[0].date) ? matches[0].date : c.calendarDate;
    const date = addDaysISO(fromDate, 14);
    const pairs = [];
    for(let i=0;i<winners.length;i+=2) pairs.push({ home: winners[i], away: winners[i+1] });
    const round = stages.indexOf(nextStage)+1;
    pairs.forEach(p => bucket.matches.push(careerMkMatch(cupKey, null, round, p.home, p.away, {stage:nextStage, neutral:true, date})));
  }

  function careerTeamById(id){
    let t = state.career.teams.find(t=>t.id===id);
    if(t) return t;
    const extras = [
      state.career.nacional && state.career.nacional.teams,
      state.career.bmetro && state.career.bmetro.teams,
      state.career.federal && state.career.federal.teams,
      state.career.primerac && state.career.primerac.teams,
      state.career.promocional && state.career.promocional.teams
    ];
    for(let i=0;i<extras.length;i++){
      if(!extras[i]) continue;
      t = extras[i].find(x=>x.id===id);
      if(t) return t;
    }
    if(state.career.copaArgentina && state.career.copaArgentina.otherTeams){
      t = state.career.copaArgentina.otherTeams.find(t=>t.id===id);
      if(t) return t;
    }
    if(state.career.libertadores && state.career.libertadores.foreignTeams){
      t = state.career.libertadores.foreignTeams.find(t=>t.id===id);
      if(t) return t;
    }
    if(state.career.sudamericana && state.career.sudamericana.foreignTeams){
      t = state.career.sudamericana.foreignTeams.find(t=>t.id===id);
      if(t) return t;
    }
    return null;
  }
  function careerUid(prefix){ return prefix + (state.career.matchCounter++); }

  function careerMkMatch(comp, zone, round, home, away, extra){
    extra = extra || {};
    const base = { id: careerUid('cm'), comp, zone, round, home, away, homeScore:null, awayScore:null, played:false, bye:false };
    if(home === null || away === null){ base.played = true; base.bye = true; }
    return Object.assign(base, extra);
  }

  function careerEloExpected(a,b){ return 1/(1+Math.pow(10,(b-a)/400)); }

  function careerMatchAdjustedProb(m){
    const home = careerTeamById(m.home), away = careerTeamById(m.away);
    const adv = m.neutral ? 0 : state.career.engine.homeAdvantage;
    const exp = careerEloExpected(home.elo + adv, away.elo);
    return adjustedProbability(exp, state.career.engine.surpriseFactor);
  }

  function careerSimulateResult(m){
    const adjusted = careerMatchAdjustedProb(m);
    const g = gapStrength(adjusted);
    const drawProb = state.career.engine.drawProb * (0.2 + 0.8*(1-g));
    const pHome = adjusted * (1-drawProb);
    const pAway = (1-adjusted) * (1-drawProb);
    const roll = Math.random();
    let outcome;
    if(roll < pHome) outcome = 'home';
    else if(roll < pHome+pAway) outcome = 'away';
    else outcome = 'draw';
    if(!state.career.engine.allowDraws && outcome==='draw'){
      outcome = Math.random() < adjusted ? 'home' : 'away';
    }
    return goalsForOutcome(outcome, adjusted);
  }

  function careerApplyEloUpdate(m){
    const home = careerTeamById(m.home), away = careerTeamById(m.away);
    if(!home || !away) return;
    const adv = m.neutral ? 0 : state.career.engine.homeAdvantage;
    const expHome = careerEloExpected(home.elo+adv, away.elo);
    const expAway = 1-expHome;
    let sHome;
    if(m.homeScore > m.awayScore) sHome = 1;
    else if(m.homeScore < m.awayScore) sHome = 0;
    else sHome = 0.5;
    const sAway = 1-sHome;
    const k = state.career.engine.kFactor;
    const dH = Math.round(k*(sHome-expHome));
    const dA = Math.round(k*(sAway-expAway));
    home.elo += dH; away.elo += dA;
    m.deltaHome = dH; m.deltaAway = dA;
  }

  // En los octavos, cuartos, semis y final del formato real no hay alargue: empate en 90' va directo a penales.
  function resolvePenaltiesWinner(m){
    const adjusted = careerMatchAdjustedProb(m);
    const tilted = 0.5 + (adjusted-0.5) * 0.3; // los penales son casi un cara o ceca
    return Math.random() < tilted ? m.home : m.away;
  }
  // Los penales solo se patean en partido único sin ventaja deportiva.
  // Una serie de ida y vuelta se define por el global, nunca por un empate suelto.
  function careerMatchNeedsPenalties(m){
    if(!m.stage) return false;
    if(m.leg) return false;
    if(m.advantage) return false;
    return true;
  }
  function careerMatchWinner(m){
    if(m.homeScore > m.awayScore) return m.home;
    if(m.awayScore > m.homeScore) return m.away;
    return m.penaltyWinner || m.advantage || null;
  }

  function careerComputeStandings(teamIds, matchFilter){
    return careerComputeStandingsFrom(state.career.matches.filter(matchFilter), teamIds);
  }

  function careerComputeStandingsFrom(list, teamIds){
    const rows = {};
    teamIds.forEach(id => { rows[id] = { id, pj:0, pg:0, pe:0, pp:0, gf:0, gc:0, pts:0 }; });
    list.forEach(m => {
      if(!m.played || m.bye) return;
      if(rows[m.home]){
        const r = rows[m.home];
        r.pj++; r.gf += m.homeScore; r.gc += m.awayScore;
        if(m.homeScore > m.awayScore){ r.pg++; r.pts += 3; }
        else if(m.homeScore < m.awayScore){ r.pp++; }
        else { r.pe++; r.pts += 1; }
      }
      if(rows[m.away]){
        const r = rows[m.away];
        r.pj++; r.gf += m.awayScore; r.gc += m.homeScore;
        if(m.awayScore > m.homeScore){ r.pg++; r.pts += 3; }
        else if(m.awayScore < m.homeScore){ r.pp++; }
        else { r.pe++; r.pts += 1; }
      }
    });
    const arr = Object.values(rows);
    arr.forEach(r => r.dg = r.gf - r.gc);
    arr.sort((x,y) => y.pts - x.pts || y.dg - x.dg || y.gf - x.gf || (careerTeamById(y.id).elo - careerTeamById(x.id).elo));
    return arr;
  }

  function careerComputeForm(teamId, matchFilter){
    const involved = state.career.matches.filter(m => !m.bye && m.played && matchFilter(m) && (m.home===teamId || m.away===teamId));
    involved.sort((a,b) => (a.playedAt||0) - (b.playedAt||0));
    return involved.slice(-3).map(m => {
      const isHome = m.home === teamId;
      const gf = isHome ? m.homeScore : m.awayScore;
      const gc = isHome ? m.awayScore : m.homeScore;
      if(gf > gc) return 'G';
      if(gf < gc) return 'P';
      return 'E';
    });
  }

  function shuffleArr(arr){
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  }

  // Cruces interzonales que se jugaron en el Apertura de este año (ya archivado), para
  // repetirlos en el Clausura con la localía invertida.
  function careerAperturaInterzonalPairs(){
    const c = state.career;
    const apertura = (c.history || []).find(h => h.year === c.year && h.tournament === 'apertura');
    if(!apertura) return null;
    return apertura.matches.filter(m => m.interzonal && !m.bye).map(m => ({ home: m.home, away: m.away }));
  }

  function careerGenerateTournament(){
    const c = state.career;
    c.matches = [];
    c.knockout = [];
    c.knockoutBuilt = false;
    c.matchCounter = 0;
    c.playSeq = 0;
    c.fixtureNav = {};
    c.champion = null;

    const seasonStart = careerSeasonStart(c.year, c.tournament);
    const dateForRound = (ri) => addDaysISO(seasonStart, (ri-1)*7);

    const zoneA = c.teams.filter(t=>t.zone===0).map(t=>t.id);
    const zoneB = c.teams.filter(t=>t.zone===1).map(t=>t.id);
    let maxRounds = 0;

    // El fixture del Clausura usa el mismo cruce de partidos que el Apertura, pero con las
    // localías invertidas: quien jugó de local en el Apertura visita en el Clausura.
    const esClausura = c.tournament === 'clausura';
    [zoneA, zoneB].forEach((zoneIds, zi) => {
      if(zoneIds.length < 2) return;
      const rounds = roundRobinRounds(zoneIds);
      rounds.forEach((round, ri) => {
        round.forEach(mm => {
          const home = esClausura ? mm.away : mm.home;
          const away = esClausura ? mm.home : mm.away;
          c.matches.push(careerMkMatch(c.tournament, zi, ri+1, home, away, {date: dateForRound(ri+1)}));
        });
      });
      maxRounds = Math.max(maxRounds, rounds.length);
    });

    // Fecha interzonal: en el Apertura se sortea un rival de la otra zona; en el Clausura
    // se repiten esos mismos cruces con la localía invertida.
    if(zoneA.length && zoneB.length){
      const interRound = maxRounds + 1;
      const interDate = dateForRound(interRound);
      const aperturaInter = esClausura ? careerAperturaInterzonalPairs() : null;
      if(aperturaInter && aperturaInter.length){
        aperturaInter.forEach(p => {
          c.matches.push(careerMkMatch(c.tournament, null, interRound, p.away, p.home, {interzonal:true, date: interDate}));
        });
      } else {
        const shuffledA = shuffleArr(zoneA.slice());
        const shuffledB = shuffleArr(zoneB.slice());
        const n = Math.min(shuffledA.length, shuffledB.length);
        for(let i=0;i<n;i++){
          const homeIsA = Math.random() < 0.5;
          const home = homeIsA ? shuffledA[i] : shuffledB[i];
          const away = homeIsA ? shuffledB[i] : shuffledA[i];
          c.matches.push(careerMkMatch(c.tournament, null, interRound, home, away, {interzonal:true, date: interDate}));
        }
      }
    }
    c.calendarDate = addDaysISO(seasonStart, -1);
    careerEnsureNacional();
    c.step = 'temporada';
  }

  function careerBuildPlayoffs(){
    const c = state.career;
    const zoneA = c.teams.filter(t=>t.zone===0).map(t=>t.id);
    const zoneB = c.teams.filter(t=>t.zone===1).map(t=>t.id);
    const standA = careerComputeStandings(zoneA, m=>m.comp===c.tournament).slice(0,8).map(r=>r.id);
    const standB = careerComputeStandings(zoneB, m=>m.comp===c.tournament).slice(0,8).map(r=>r.id);
    const ligaDates = c.matches.filter(m=>m.comp===c.tournament && m.date).map(m=>m.date).sort();
    const lastLigaDate = ligaDates.length ? ligaDates[ligaDates.length-1] : c.calendarDate;
    const date = addDaysISO(lastLigaDate, 14);
    const pairs = [];
    for(let i=0;i<4;i++) pairs.push({ home: standB[i], away: standA[7-i] });   // 8°A vs 1°B ... 5°A vs 4°B (local: mejor ubicado)
    for(let i=0;i<4;i++) pairs.push({ home: standA[i], away: standB[7-i] });   // 8°B vs 1°A ... 5°B vs 4°A
    pairs.forEach(p => c.knockout.push(careerMkMatch(c.tournament, null, 1, p.home, p.away, {stage:'octavos', neutral:false, date})));
    c.knockoutBuilt = true;
    if(!c.fixtureNav) c.fixtureNav = {};
    c.fixtureNav['career-playoffs'] = 1;
  }

  function careerAdvancePlayoffs(fromStage){
    const c = state.career;
    const stages = ['octavos','cuartos','semis','final'];
    const roundsMap = {octavos:1, cuartos:2, semis:3, final:4};
    const nextStage = stages[stages.indexOf(fromStage)+1];
    if(!nextStage) return;
    const matches = c.knockout.filter(m=>m.stage===fromStage);
    const winners = matches.map(m=>careerMatchWinner(m));
    const fromDate = (matches.length && matches[0].date) ? matches[0].date : c.calendarDate;
    const date = addDaysISO(fromDate, 14);
    const nextPairs = [];
    for(let i=0;i<winners.length;i+=2) nextPairs.push({ home: winners[i], away: winners[i+1] });
    nextPairs.forEach(p => c.knockout.push(careerMkMatch(c.tournament, null, roundsMap[nextStage], p.home, p.away, {stage:nextStage, neutral:true, date})));
  }

  // ---------- Historial de títulos ----------
  function careerRecordTitle(competition, teamId){
    const c = state.career;
    if(!c.titles) c.titles = [];
    const team = careerTeamById(teamId);
    c.titles.push({ year: c.year, competition, teamId, teamName: team ? team.name : null });
  }
  function careerGetTitle(year, competition){
    const c = state.career;
    const found = (c.titles||[]).filter(x=>x.year===year && x.competition===competition);
    return found.length ? found[found.length-1].teamId : null;

  function checkCareerChampion(m){
    if(!m || !m.played || m.stage !== 'final') return;
    const winner = careerMatchWinner(m);
    if(m.comp === 'copa-argentina'){
      if(!state.career.copaArgentina) return;
      state.career.copaArgentina.champion = { year: state.career.year, teamId: winner };
      careerRecordTitle('copa-argentina', winner);
    } else if(m.comp === 'apertura' || m.comp === 'clausura'){
      state.career.champion = { tournament: m.comp, year: state.career.year, teamId: winner };
      careerRecordTitle(m.comp, winner);
    } else if(m.comp === 'trofeo-campeones' || m.comp === 'supercopa-argentina' || m.comp === 'supercopa-internacional'){
      careerRecordTitle(m.comp, winner);
    } else if(m.comp === 'libertadores'){
      if(!state.career.libertadores) return;
      state.career.libertadores.champion = { year: state.career.year, teamId: winner };
      careerRecordTitle('libertadores', winner);
    } else if(m.comp === 'sudamericana'){
      if(!state.career.sudamericana) return;
      state.career.sudamericana.champion = { year: state.career.year, teamId: winner };
      careerRecordTitle('sudamericana', winner);
    }
  }

  // ---------- Tabla Anual / Tabla de Promedios / Descensos ----------
  function careerMatchPointsRow(matches, id){
    let pts=0,pj=0,pg=0,pe=0,pp=0,gf=0,gc=0;
    matches.forEach(m => {
      if(m.bye || !m.played) return;
      if(m.home === id){
        pj++; gf+=m.homeScore; gc+=m.awayScore;
        if(m.homeScore>m.awayScore){ pg++; pts+=3; } else if(m.homeScore<m.awayScore){ pp++; } else { pe++; pts+=1; }
      } else if(m.away === id){
        pj++; gf+=m.awayScore; gc+=m.homeScore;
        if(m.awayScore>m.homeScore){ pg++; pts+=3; } else if(m.awayScore<m.homeScore){ pp++; } else { pe++; pts+=1; }
      }
    });
    return { pts, pj, pg, pe, pp, gf, gc };
  }

  function careerAnnualTable(){
    const c = state.career;
    const allIds = c.teams.map(t=>t.id);
    const aperturaHist = (c.history||[]).find(h=>h.year===c.year && h.tournament==='apertura');
    const aperturaMatches = c.tournament === 'apertura' ? c.matches : (aperturaHist ? aperturaHist.matches : []);
    const clausuraMatches = c.tournament === 'clausura' ? c.matches : [];
    const rows = allIds.map(id => {
      const a = careerMatchPointsRow(aperturaMatches, id);
      const cl = careerMatchPointsRow(clausuraMatches, id);
      return {
        id, pts:a.pts+cl.pts, pj:a.pj+cl.pj, pg:a.pg+cl.pg, pe:a.pe+cl.pe, pp:a.pp+cl.pp,
        gf:a.gf+cl.gf, gc:a.gc+cl.gc, dg:(a.gf+cl.gf)-(a.gc+cl.gc)
      };
    });
    rows.sort((x,y) => y.pts-x.pts || y.dg-x.dg || y.gf-x.gf || careerTeamById(y.id).elo-careerTeamById(x.id).elo);
    return rows;
  }

  function careerPromediosTable(){
    const c = state.career;
    const annual = careerAnnualTable();
    const map = {}; annual.forEach(r=>map[r.id]=r);
    const rows = c.teams.map(t => {
      const log = (c.seasonLog && c.seasonLog[t.id]) ? c.seasonLog[t.id].slice(-2) : [];
      const cur = map[t.id] || {pts:0,pj:0};
      const totalPts = log.reduce((s,x)=>s+x.pts,0) + cur.pts;
      const totalPj = log.reduce((s,x)=>s+x.pj,0) + cur.pj;
      return { id: t.id, avg: totalPj>0 ? totalPts/totalPj : 0, totalPj };
    });
    rows.sort((x,y) => y.avg-x.avg || careerTeamById(y.id).elo-careerTeamById(x.id).elo);
    return rows;
  }

  function careerComputeDescensos(){
    const annual = careerAnnualTable();
    const promedios = careerPromediosTable();
    if(annual.length < 2 || promedios.length < 2){
      return { annual, promedios, relegated: [], relegatedAnnual: [], relegatedPromedios: [] };
    }
    const lastAnnual = annual[annual.length-1].id;
    const lastProm = promedios[promedios.length-1].id;
    let relegated, relegatedPromedios;
    if(lastAnnual === lastProm){
      // Mismo equipo último en las dos tablas: ese desciende por la Tabla Anual, y el segundo
      // descenso pasa a ser el penúltimo de la Tabla de Promedios (se marca ahí, además del último).
      const secondLastProm = promedios[promedios.length-2].id;
      relegated = [lastAnnual, secondLastProm];
      relegatedPromedios = [lastProm, secondLastProm];
    } else {
      // Caso normal: uno por tabla, cada una marca solo su propio último puesto.
      relegated = [lastAnnual, lastProm];
      relegatedPromedios = [lastProm];
    }
    return { annual, promedios, relegated, relegatedAnnual: [lastAnnual], relegatedPromedios };
  }

  // ==================== SEGUNDA DIVISIÓN — PRIMERA NACIONAL ====================
  // Se juega en paralelo a la Primera durante todo el año: 36 equipos en 2 zonas de 18,
  // todos contra todos a 2 ruedas más 2 fechas interzonales (36 fechas en total).

  const NAC_STAGE_LABELS = {
    'final-titulo': 'Final por el título y el 1° ascenso',
    'red-f1': 'Reducido · Primera fase',
    'red-f2': 'Reducido · Segunda fase',
    'red-semis': 'Reducido · Semifinales',
    'red-final': 'Reducido · Final por el 2° ascenso',
    'desempate-descenso': 'Desempate por el descenso'
  };
  const NAC_STAGE_ORDER = ['final-titulo','red-f1','red-f2','red-semis','red-final','desempate-descenso'];
  const NAC_ZONE_LEGEND = [
    { id:'final', label:'Final por el título y el 1° ascenso', from:1, to:1, color:'#C9A227' },
    { id:'reducido', label:'Reducido por el 2° ascenso', from:2, to:8, color:'#5A8F5A' },
    { id:'descenso', label:'Descenso', from:17, to:18, color:'#B4433A' }
  ];

  function careerNacional(){
    const c = state.career;
    if(!c.nacional) c.nacional = defaultNacional();
    return c.nacional;
  }
  function careerNacionalTeamsFromDb(){
    const n = careerNacional();
    n.teams = [];
    let i = 0;
    const push = (t, zone) => n.teams.push({ id:'nt'+(i++)+'_'+Math.random().toString(36).slice(2,7), name:t.name, elo:t.elo, zone });
    CAREER_TEAM_DB.nacional.zoneA.forEach(t=>push(t,0));

  function careerNacionalZoneIds(z){ return careerNacional().teams.filter(t=>t.zone===z).map(t=>t.id); }
  function careerNacionalRegularMatches(){ return careerNacional().matches.filter(m=>!m.stage); }
  function careerNacionalStandings(z){
    return careerComputeStandingsFrom(careerNacionalRegularMatches(), careerNacionalZoneIds(z));
  }
  function careerNacionalStageMatches(stage){ return careerNacional().matches.filter(m=>m.stage===stage); }
  function careerNacionalHasStage(stage){ return careerNacionalStageMatches(stage).length > 0; }
  function careerNacionalStageDone(stage){
    const ms = careerNacionalStageMatches(stage);
    return ms.length > 0 && ms.every(m=>m.played);
  }
  function careerNacionalStageLastDate(stage){
    const ds = careerNacionalStageMatches(stage).map(m=>m.date).filter(Boolean).sort();
    return ds.length ? ds[ds.length-1] : state.career.calendarDate;

  function careerNacionalLastRegularDate(){

  // Genera el año completo de la Primera Nacional.
  function careerGenerateNacional(){
    const c = state.career;
    const n = careerNacional();
    if(n.teams.length === 0) careerNacionalTeamsFromDb();
    n.matches = [];
    n.champion = null; n.promoted = []; n.relegated = [];
    n.seedOrder = []; n.redSeeds = [];
    n.generatedYear = c.year;

    // La Nacional juega los sábados; la Primera, los domingos.
    const start = firstWeekdayOfMonth(c.year, 1, 6);
    const dateFor = (r) => addDaysISO(start, (r-1)*7);
    const zoneA = careerNacionalZoneIds(0), zoneB = careerNacionalZoneIds(1);
    if(zoneA.length < 2 || zoneB.length < 2) return;

    const rr = [roundRobinRounds(zoneA), roundRobinRounds(zoneB)];
    const nRounds = Math.max(rr[0].length, rr[1].length);

    // Primera rueda
    [0,1].forEach(zi => {
      rr[zi].forEach((round, ri) => {
        round.forEach(mm => n.matches.push(careerMkMatch('nacional', zi, ri+1, mm.home, mm.away, {date: dateFor(ri+1)})));
      });
    });
    // Interzonal de ida
    const interIda = nRounds + 1;
    const sa = shuffleArr(zoneA.slice()), sb = shuffleArr(zoneB.slice());
    const interPairs = [];
    for(let i=0;i<Math.min(sa.length, sb.length);i++) interPairs.push([sa[i], sb[i]]);
    interPairs.forEach(p => n.matches.push(careerMkMatch('nacional', null, interIda, p[0], p[1], {interzonal:true, date: dateFor(interIda)})));
    // Segunda rueda (localías invertidas)
    [0,1].forEach(zi => {
      rr[zi].forEach((round, ri) => {
        const rn = interIda + 1 + ri;
        round.forEach(mm => n.matches.push(careerMkMatch('nacional', zi, rn, mm.away, mm.home, {date: dateFor(rn)})));
      });
    });
    // Interzonal de vuelta
    const interVta = interIda + nRounds + 1;
    interPairs.forEach(p => n.matches.push(careerMkMatch('nacional', null, interVta, p[1], p[0], {interzonal:true, date: dateFor(interVta)})));
  }

  // Si la carrera venía de antes (o de un guardado viejo), arma las otras categorías y las pone al día.
  function careerEnsureNacional(){ careerEnsureDivisions(); }
  function careerEnsureDivisions(){
    const c = state.career;
    const pendientes = [];
    const n = careerNacional();
    if(n.generatedYear !== c.year || !n.matches.length){ careerGenerateNacional(); pendientes.push(n.matches); }
    const b = careerBmetro();
    if(b.generatedYear !== c.year || !b.matches.length){ careerGenerateBmetro(); pendientes.push(b.matches); }
    const f = careerFederal();
    if(f.generatedYear !== c.year || !f.matches.length){ careerGenerateFederal(); pendientes.push(f.matches); }
    const pc = careerPrimeraC();
    if(pc.generatedYear !== c.year || !pc.matches.length){ careerGeneratePrimeraC(); pendientes.push(pc.matches); }
    const pr = careerPromocional();
    if(pr.generatedYear !== c.year || !pr.matches.length){ careerGeneratePromocional(); pendientes.push(pr.matches); }
    pendientes.forEach(list => careerCatchUpMatches(list));
    careerEnsureWorldLeagues();
  }
  // Juega de una todo lo que haya quedado atrasado respecto de la fecha actual de la carrera.
  function careerCatchUpMatches(list){
    const c = state.career;
    if(!c.calendarDate) return;
    list.forEach(m => {
      if(m.played || m.bye || !m.date || m.date >= c.calendarDate) return;
      const [h,a] = careerSimulateResult(m);
      m.homeScore = h; m.awayScore = a; m.played = true;
      m.playedAt = ++c.playSeq;
      careerApplyEloUpdate(m);
    });
  }

  // ---- Series ida y vuelta con ventaja deportiva (genérico para todas las categorías) ----
  function careerSeriesOfList(ms){
    const series = [], idx = {};
    ms.forEach(m => {
      const key = m.serie || m.id;
      if(!(key in idx)){ idx[key] = series.length; series.push({ serie:key, legs:[] }); }
      series[idx[key]].legs.push(m);
    });
    series.forEach(s => s.legs.sort((a,b)=>(a.leg||1)-(b.leg||1)));
    return series;
  }
  function careerNacionalSeriesOf(stage){ return careerSeriesOfList(careerNacionalStageMatches(stage)); }
  function careerSerieAggregate(legs){
    const agg = {};
    legs.forEach(m => {
      if(!m.played) return;
      agg[m.home] = (agg[m.home]||0) + m.homeScore;
      agg[m.away] = (agg[m.away]||0) + m.awayScore;
    });
    return agg;
  }
  function careerSerieWinner(legs){
    if(!legs.length || !legs.every(m=>m.played)) return null;
    if(legs.length === 1) return careerMatchWinner(legs[0]);
    const agg = careerSerieAggregate(legs);
    const a = legs[0].home, b = legs[0].away;
    if((agg[a]||0) > (agg[b]||0)) return a;
    if((agg[b]||0) > (agg[a]||0)) return b;
    if(legs[0].advantage) return legs[0].advantage;
    const pen = legs.find(m => m.penaltyWinner);
    return pen ? pen.penaltyWinner : null;
  }
  // Series sin ventaja deportiva (la final del Federal A): global empatado, penales.
  function careerResolveSeriePenalties(series){
    let did = false;
    series.forEach(sr => {
      const legs = sr.legs;
      if(legs.length < 2 || !legs.every(m=>m.played)) return;
      if(legs[0].advantage || legs.some(m=>m.penaltyWinner)) return;
      const agg = careerSerieAggregate(legs);
      const a = legs[0].home, b = legs[0].away;
      if((agg[a]||0) !== (agg[b]||0)) return;
      const last = legs[legs.length-1];
      last.wentToPenalties = true;
      last.penaltyWinner = resolvePenaltiesWinner(last);
      did = true;
    });
    return did;
  }
  // Construye una llave ida y vuelta. El mejor ubicado cierra de local y pasa ante igualdad.
  function careerBuildSeries(arr, comp, stage, pairs, dIda, dVta, opts){
    opts = opts || {};
    pairs.forEach((pr, i) => {
      const serie = stage + '-' + (i+1);
      const adv = opts.noAdvantage ? null : pr.better;
      arr.push(careerMkMatch(comp, null, 1, pr.worse, pr.better, {stage, serie, leg:1, advantage:adv, date:dIda}));
      arr.push(careerMkMatch(comp, null, 2, pr.better, pr.worse, {stage, serie, leg:2, advantage:adv, date:dVta}));
    });
  }
  // Cruces clásicos 1 vs N, 2 vs N-1, ... a partir de un ordenamiento.
  function careerSeedPairs(order){
    const pairs = [];
    for(let i=0;i<Math.floor(order.length/2);i++) pairs.push({ better: order[i], worse: order[order.length-1-i] });
    return pairs;
  }
  function careerMaxDate(list){
    const ds = list.map(m=>m.date).filter(Boolean).sort();
    return ds.length ? ds[ds.length-1] : null;
  }
  // El mejor ubicado define de local (juega la vuelta en casa) y pasa ante igualdad.
  function careerNacionalBuildTwoLeg(stage, pairs, dateIda, dateVta){
    careerBuildSeries(careerNacional().matches, 'nacional', stage, pairs, dateIda, dateVta);
  }

  // ---- Definición: final por el título, reducido y descensos ----
  function careerNacionalBuildDefinicion(){
    const c = state.career, n = careerNacional();
    const standA = careerNacionalStandings(0), standB = careerNacionalStandings(1);
    if(standA.length < 9 || standB.length < 9) return false;
    const last = careerNacionalLastRegularDate();
    const d1 = addDaysISO(last, 7);

    // Final por el título y el primer ascenso: 1° de cada zona, partido único en cancha neutral.
    n.matches.push(careerMkMatch('nacional', null, 1, standA[0].id, standB[0].id, {stage:'final-titulo', neutral:true, date:d1}));

    // Reducido — primera fase: del 2° al 8° de cada zona, tabla general y partido único.
    const pool = standA.slice(1,8).concat(standB.slice(1,8));
    pool.sort((x,y) => y.pts-x.pts || y.dg-x.dg || y.gf-x.gf || careerTeamById(y.id).elo-careerTeamById(x.id).elo);
    n.seedOrder = pool.map(r=>r.id);
    const total = pool.length;
    for(let i=0;i<Math.floor(total/2);i++){
      const better = pool[i].id, worse = pool[total-1-i].id;
      n.matches.push(careerMkMatch('nacional', null, 1, better, worse, {stage:'red-f1', serie:'red-f1-'+(i+1), leg:1, advantage:better, date:d1}));
    }

    careerNacionalBuildDescensos(standA, standB, d1);
    return true;
  }

  function careerNacionalBuildDescensos(standA, standB, date){
    const n = careerNacional();
    n.relegated = [];
    [standA, standB].forEach((st, zi) => {
      if(st.length < 3) return;
      const ultimo = st[st.length-1], penultimo = st[st.length-2], salvado = st[st.length-3];
      n.relegated.push(ultimo.id);
      // Ante igualdad de puntos y diferencia de gol se juega un desempate por el descenso.
      if(penultimo.pts === salvado.pts && penultimo.dg === salvado.dg){
        n.matches.push(careerMkMatch('nacional', zi, 1, salvado.id, penultimo.id, {stage:'desempate-descenso', neutral:true, serie:'desc-'+zi, date}));
      } else {
        n.relegated.push(penultimo.id);
      }
    });
  }

  function careerNacionalAutoAdvance(){
    const c = state.career;
    const n = careerNacional();
    if(!n.teams || n.teams.length < 4) return false;
    let did = false;

    const reg = careerNacionalRegularMatches();
    const regDone = reg.length > 0 && reg.every(m=>m.played);
    if(!regDone) return false;

    if(!careerNacionalHasStage('final-titulo')){
      if(careerNacionalBuildDefinicion()) return true;
      return false;
    }

    // Desempates por el descenso
    careerNacionalStageMatches('desempate-descenso').forEach(m => {
      if(!m.played || m.resolved) return;
      const w = careerMatchWinner(m);
      const loser = (w === m.home) ? m.away : m.home;
      if(loser && !n.relegated.includes(loser)) n.relegated.push(loser);
      m.resolved = true; did = true;
    });

    // Campeón y primer ascenso
    const ft = careerNacionalStageMatches('final-titulo')[0];
    if(ft && ft.played && !n.champion){
      const w = careerMatchWinner(ft);
      if(w){
        n.champion = w;
        if(!n.promoted.includes(w)) n.promoted.push(w);
        careerRecordTitle('nacional', w);
        did = true;
      }
    }

    // Reducido — segunda fase: los 7 ganadores + el perdedor de la final (preclasificado 1°)
    if(careerNacionalStageDone('final-titulo') && careerNacionalStageDone('red-f1') && !careerNacionalHasStage('red-f2')){
      const w = careerMatchWinner(ft);
      const loser = (w === ft.home) ? ft.away : ft.home;
      const winners = careerNacionalStageMatches('red-f1').map(m=>careerMatchWinner(m)).filter(Boolean);
      winners.sort((a,b) => n.seedOrder.indexOf(a) - n.seedOrder.indexOf(b));
      const seeds = [loser].concat(winners);
      n.redSeeds = seeds.slice();
      const base = careerNacionalStageLastDate('red-f1');
      const pairs = [];
      const half = Math.floor(seeds.length/2);
      for(let i=0;i<half;i++) pairs.push({ better: seeds[i], worse: seeds[seeds.length-1-i] });
      careerNacionalBuildTwoLeg('red-f2', pairs, addDaysISO(base,7), addDaysISO(base,14));
      return true;
    }

    if(careerNacionalStageDone('red-f2') && !careerNacionalHasStage('red-semis')){
      const ws = careerNacionalSeriesOf('red-f2').map(s=>careerSerieWinner(s.legs)).filter(Boolean);
      ws.sort((a,b) => n.redSeeds.indexOf(a) - n.redSeeds.indexOf(b));
      const base = careerNacionalStageLastDate('red-f2');
      const pairs = [];
      for(let i=0;i<Math.floor(ws.length/2);i++) pairs.push({ better: ws[i], worse: ws[ws.length-1-i] });
      careerNacionalBuildTwoLeg('red-semis', pairs, addDaysISO(base,7), addDaysISO(base,14));
      return true;
    }

    if(careerNacionalStageDone('red-semis') && !careerNacionalHasStage('red-final')){
      const ws = careerNacionalSeriesOf('red-semis').map(s=>careerSerieWinner(s.legs)).filter(Boolean);
      ws.sort((a,b) => n.redSeeds.indexOf(a) - n.redSeeds.indexOf(b));
      const base = careerNacionalStageLastDate('red-semis');
      if(ws.length >= 2){
        n.matches.push(careerMkMatch('nacional', null, 1, ws[0], ws[1], {stage:'red-final', neutral:true, date: addDaysISO(base,7)}));
        return true;
      }
    }

    // Segundo ascenso
    const rf = careerNacionalStageMatches('red-final')[0];
    if(rf && rf.played){
      const w = careerMatchWinner(rf);
      if(w && !n.promoted.includes(w)){ n.promoted.push(w); did = true; }
    }

    return did;
  }

  // ---- Ascensos y descensos encadenados entre las cuatro categorías ----
  // El que baja ocupa el lugar exacto (y la zona) del que sube, así ninguna categoría se descuadra.
  // Al equipo que asciende se le resta 100 de ELO (llega "crudo" a la categoría de arriba, no con
  // el rating completo que se ganó abajo — si no, es demasiado fácil volver a subir o salir campeón
  // apenas llega). Al que desciende no se le toca nada.
  function careerSwapDivisions(arriba, abajo, bajanIds, subenIds){
    const cant = Math.min(bajanIds.length, subenIds.length);
    for(let i=0;i<cant;i++){
      const dIdx = arriba.findIndex(t=>t.id===bajanIds[i]);
      const uIdx = abajo.findIndex(t=>t.id===subenIds[i]);
      if(dIdx < 0 || uIdx < 0) continue;
      const bajando = arriba[dIdx], subiendo = abajo[uIdx];
      const zArriba = bajando.zone, zAbajo = subiendo.zone;
      arriba.splice(dIdx, 1, Object.assign({}, subiendo, { zone: zArriba, elo: subiendo.elo - 100 }));
      abajo.splice(uIdx, 1, Object.assign({}, bajando, { zone: zAbajo }));
    }
  }
  function careerUsedNames(){
    const c = state.career;
    return new Set(
      c.teams.map(t=>t.name)
        .concat(careerNacional().teams.map(t=>t.name))
        .concat(careerBmetro().teams.map(t=>t.name))
        .concat(careerFederal().teams.map(t=>t.name))
    );
  }
  // Los que se van al fondo se reemplazan con clubes de la categoría de abajo que todavía no estén en juego.
  function careerReplaceWithPool(div, ids, pool, prefix){
    const usados = careerUsedNames();
    const libres = pool.filter(t => !usados.has(t.name)).sort((a,b)=>b.elo-a.elo);
    let pi = 0;
    ids.forEach(id => {
      const idx = div.teams.findIndex(t=>t.id===id);
      if(idx < 0) return;
      const rep = libres[pi++];
      if(!rep) return;
      const zone = div.teams[idx].zone;
      div.teams.splice(idx, 1, { id:prefix+Math.random().toString(36).slice(2,9), name:rep.name, elo:rep.elo, zone });
    });
  }

  function careerApplyPromotionsRelegations(){
    const c = state.career;
    const n = careerNacional(), b = careerBmetro(), f = careerFederal();
    const db = CAREER_TEAM_DB;
    const mov = { year: c.year };

    // Primera <-> Primera Nacional
    const desc = careerComputeDescensos();
    const bajanPrimera = (desc.relegated || []).slice(0,2);
    const subenDeNacional = (n.promoted || []).slice(0,2);
    if(bajanPrimera.length === 2 && subenDeNacional.length === 2){
      careerSwapDivisions(c.teams, n.teams, bajanPrimera, subenDeNacional);
      subenDeNacional.forEach(id => { if(c.seasonLog) delete c.seasonLog[id]; });
      mov.subenAPrimera = subenDeNacional.slice();
      mov.bajanANacional = bajanPrimera.slice();
    }

    // Primera Nacional <-> tercera división: suben 2 de la B Metro y 2 del Federal A,
    // y los 4 que bajan de la Nacional se reparten entre esas dos categorías.
    const bajanNacional = (n.relegated || []).slice(0,4);
    const subenDeB = (b.promoted || []).slice(0,2);
    const subenDeF = (f.promoted || []).slice(0,2);
    if(subenDeB.length) careerSwapDivisions(n.teams, b.teams, bajanNacional.slice(0, subenDeB.length), subenDeB);
    if(subenDeF.length) careerSwapDivisions(n.teams, f.teams, bajanNacional.slice(subenDeB.length, subenDeB.length + subenDeF.length), subenDeF);
    if(subenDeB.length || subenDeF.length) mov.subenANacional = subenDeB.concat(subenDeF);
    if(bajanNacional.length) mov.bajanDeNacional = bajanNacional.slice();

    // B Metropolitana <-> Primera C: bajan el 21° y el 22°, suben el campeón y el del reducido
    const pc = careerPrimeraC(), pr = careerPromocional();
    const subenDeC = (pc.promoted || []).slice(0,2);
    const bajanDeB = (b.relegated || []).slice(0,2);
    if(subenDeC.length){
      careerSwapDivisions(b.teams, pc.teams, bajanDeB.slice(0, subenDeC.length), subenDeC);
      mov.subenALaB = subenDeC.slice();
    }
    if(bajanDeB.length) mov.bajanDeB = bajanDeB.slice();

    // Primera C <-> Promocional Amateur
    // El desafiliado deja su lugar al campeón del Apertura del Promocional.
    if(pc.desafiliado && pr.aperturaChampion){
      const dIdx = pc.teams.findIndex(t=>t.id===pc.desafiliado);
      const aIdx = pr.teams.findIndex(t=>t.id===pr.aperturaChampion);
      if(dIdx >= 0 && aIdx >= 0){
        const zonaC = pc.teams[dIdx].zone, zonaP = pr.teams[aIdx].zone;
        pc.teams.splice(dIdx, 1, Object.assign({}, pr.teams[aIdx], { zone: zonaC, elo: pr.teams[aIdx].elo - 100 }));
        // el desafiliado se va del sistema: el Promocional suma un club nuevo en su lugar
        pr.teams.splice(aIdx, 1);
        const usadosPr = careerUsedNames();
        const nuevoPr = db.amateur.filter(t=>!usadosPr.has(t.name)).sort((x,y)=>y.elo-x.elo)[0];
        if(nuevoPr) pr.teams.splice(aIdx, 0, { id:'pr'+Math.random().toString(36).slice(2,9), name:nuevoPr.name, elo:nuevoPr.elo, zone: zonaP });
        mov.desafiliado = pc.desafiliado;
        mov.subeALaC = pr.aperturaChampion;
      }
    }
    // Si el Promocional ganó la promoción, se cambian de categoría
    if(pr.promocionWinner && pr.clausuraChampion && pr.promocionWinner === pr.clausuraChampion && pc.permanenciaWinner){
      careerSwapDivisions(pc.teams, pr.teams, [pc.permanenciaWinner], [pr.clausuraChampion]);
      mov.promocion = pr.clausuraChampion;
    }

    // Lo único que todavía no tiene torneo propio es el Regional Amateur
    if((f.relegated||[]).length) mov.bajanDeFederal = f.relegated.slice(0,4);
    careerReplaceWithPool(f, (f.relegated || []).slice(0,4), db.regional, 'ft');

    n.promoted = []; n.relegated = [];
    b.promoted = []; b.relegated = []; b.champion = null;
    f.promoted = []; f.relegated = []; f.champion = null;
    pc.promoted = []; pc.champion = null; pc.desafiliado = null; pc.permanenciaWinner = null;
    pr.promoted = []; pr.aperturaChampion = null; pr.clausuraChampion = null; pr.promocionWinner = null;
    c.lastMovements = mov;
  }

  // ---- Vista ----
  function renderCareraNacional(){
    const c = state.career;
    careerEnsureNacional();
    careerTryAutoAdvanceStages();
    const n = careerNacional();

    let html = `<div class="panel">
      <h2>Primera Nacional ${c.year}</h2>
      <p class="hint">36 equipos en dos zonas de 18. Todos contra todos a dos ruedas más dos fechas interzonales: 36 fechas que corren en paralelo a la Primera División. Ascienden dos por año: el ganador de la final entre los dos punteros y el ganador del reducido. Descienden los dos últimos de cada zona.</p>
    </div>`;

    // Fixture
    const reg = careerNacionalRegularMatches();
    const rounds = [...new Set(reg.map(m=>m.round))].sort((a,b)=>a-b);
    const total = rounds.length;
    if(total){
      const cur = ensureCareerRoundPointer('career-nacional', total);
      const curMatches = reg.filter(m=>m.round===cur);
      html += `<div class="panel"><h2>Fixture</h2>`;
      html += `<div class="round-header"><h3>${curMatches.some(m=>m.interzonal) ? 'Fecha interzonal' : 'Fecha '+cur} de ${total}</h3></div>`;
      html += renderRoundNav('career-nacional', cur, total, 'Fecha', 'career-nav-round');
      html += curMatches.map(m=>renderCareerMatchRow(m, null)).join('');
      if(curMatches.some(m=>!m.played && !m.bye)){
        html += `<div class="btn-row"><button class="btn primary" data-action="career-simulate-round" data-scope="nacional-round" data-round="${cur}">Simular esta fecha</button></div>`;
      }
      html += `</div>`;
    }

    // Tablas
    const standA = careerNacionalStandings(0), standB = careerNacionalStandings(1);
    html += `<div class="group-block"><h3>Zona A</h3>${renderStandingsTable(standA, false, NAC_ZONE_LEGEND, careerTeamById)}</div>`;
    html += `<div class="group-block"><h3>Zona B</h3>${renderStandingsTable(standB, false, NAC_ZONE_LEGEND, careerTeamById)}</div>`;

    // Definición
    const hayDefinicion = NAC_STAGE_ORDER.some(st => careerNacionalHasStage(st));
    if(hayDefinicion){
      html += `<div class="panel"><h2>Definición</h2>`;
      NAC_STAGE_ORDER.forEach(stage => {
        const ms = careerNacionalStageMatches(stage);
        if(!ms.length) return;
        html += `<div class="round-header"><h3>${NAC_STAGE_LABELS[stage]}</h3></div>`;
        if(stage === 'red-f2' || stage === 'red-semis'){
          careerNacionalSeriesOf(stage).forEach(s => { html += renderNacionalSerie(s); });
        } else {
          html += ms.map(m=>renderCareerMatchRow(m, null)).join('');
        }
        if(ms.some(m=>!m.played)){
          html += `<div class="btn-row"><button class="btn small" data-action="career-simulate-round" data-scope="nacional-stage" data-stage="${stage}">Simular ${NAC_STAGE_LABELS[stage].toLowerCase()}</button></div>`;
        }
      });
      html += `</div>`;
    }

    // Resumen del año
    if(n.champion || (n.promoted && n.promoted.length) || (n.relegated && n.relegated.length)){
      const nombre = id => { const t = careerTeamById(id); return t ? escapeHtml(t.name) : '—'; };
      let resumen = '';
      if(n.champion) resumen += `<div class="msg" style="background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.4);color:var(--gold-bright);">&#127942; Campeón de la Primera Nacional ${c.year}: <strong>${nombre(n.champion)}</strong></div>`;
      if(n.promoted && n.promoted.length) resumen += `<p class="hint">Ascienden a Primera División: <strong style="color:var(--ink);">${n.promoted.map(nombre).join(', ')}</strong>${n.promoted.length<2?' (falta definir el segundo ascenso)':''}</p>`;
      if(n.relegated && n.relegated.length) resumen += `<p class="hint">Descienden a la tercera división: <strong style="color:var(--ink);">${n.relegated.map(nombre).join(', ')}</strong></p>`;
      html += `<div class="panel"><h2>Temporada ${c.year}</h2>${resumen}</div>`;
    }

    return html;
  }

  function renderNacionalSerie(s){ return renderSerieBlock(s); }


  // ==================== TERCERA DIVISIÓN A — PRIMERA B METROPOLITANA ====================
  // 22 equipos, todos contra todos a dos ruedas (42 fechas). El 1° es campeón y asciende
  // directo; el segundo ascenso sale de un reducido del 2° al 9°. Bajan el 21° y el 22°.

  const BMETRO_STAGE_LABELS = {
    'cuartos': 'Reducido · Cuartos de final',
    'semis': 'Reducido · Semifinales',
    'final': 'Reducido · Final por el 2° ascenso'
  };
  const BMETRO_STAGE_ORDER = ['cuartos','semis','final'];
  const BMETRO_ZONE_LEGEND = [
    { id:'campeon', label:'Campeón y ascenso directo', from:1, to:1, color:'#C9A227' },
    { id:'reducido', label:'Reducido por el 2° ascenso', from:2, to:9, color:'#5A8F5A' },
    { id:'descenso', label:'Desciende a la Primera C', from:21, to:22, color:'#B4433A' }
  ];

  function careerBmetro(){
    const c = state.career;
    if(!c.bmetro) c.bmetro = defaultBmetro();
    return c.bmetro;
  }
  function careerBmetroTeamsFromDb(){
    const b = careerBmetro();
    b.teams = CAREER_TEAM_DB.bmetro.map((t,i) => ({ id:'bt'+i+'_'+Math.random().toString(36).slice(2,7), name:t.name, elo:t.elo }));
  }
  function careerBmetroRegular(){ return careerBmetro().matches.filter(m=>!m.stage); }
  function careerBmetroStageMatches(stage){ return careerBmetro().matches.filter(m=>m.stage===stage); }
  function careerBmetroHasStage(stage){ return careerBmetroStageMatches(stage).length > 0; }
  function careerBmetroStageDone(stage){
    const ms = careerBmetroStageMatches(stage);
    return ms.length > 0 && ms.every(m=>m.played);
  }
  function careerBmetroStandings(){
    const b = careerBmetro();
    return careerComputeStandingsFrom(careerBmetroRegular(), b.teams.map(t=>t.id));
  }

  function careerGenerateBmetro(){
    const c = state.career;
    const b = careerBmetro();
    if(b.teams.length === 0) careerBmetroTeamsFromDb();
    b.matches = [];
    b.champion = null; b.promoted = []; b.relegated = []; b.seedOrder = [];
    b.generatedYear = c.year;

    // La B Metropolitana juega los lunes.
    const start = firstWeekdayOfMonth(c.year, 1, 1);
    const dateFor = (r) => addDaysISO(start, (r-1)*7);
    const ids = b.teams.map(t=>t.id);
    if(ids.length < 2) return;
    const rounds = roundRobinRounds(ids);
    rounds.forEach((round, ri) => {
      round.forEach(mm => b.matches.push(careerMkMatch('bmetro', null, ri+1, mm.home, mm.away, {date: dateFor(ri+1)})));
    });
    rounds.forEach((round, ri) => {
      const rn = rounds.length + ri + 1;
      round.forEach(mm => b.matches.push(careerMkMatch('bmetro', null, rn, mm.away, mm.home, {date: dateFor(rn)})));
    });
  }

  function careerBmetroAutoAdvance(){
    const b = careerBmetro();
    if(!b.teams || b.teams.length < 4) return false;
    const reg = careerBmetroRegular();
    if(reg.length === 0 || !reg.every(m=>m.played)) return false;
    let did = false;
    const tabla = careerBmetroStandings();

    // Campeón, ascenso directo y descensos
    if(!b.champion && tabla.length){
      b.champion = tabla[0].id;
      if(!b.promoted.includes(b.champion)) b.promoted.push(b.champion);
      careerRecordTitle('bmetro', b.champion);
      b.relegated = tabla.slice(-2).map(r=>r.id);
      did = true;
    }

    // Reducido: cuartos con el 2° al 9°
    if(!careerBmetroHasStage('cuartos') && tabla.length >= 9){
      const clasificados = tabla.slice(1,9).map(r=>r.id);
      b.seedOrder = clasificados.slice();
      const base = careerMaxDate(reg);
      careerBuildSeries(b.matches, 'bmetro', 'cuartos', careerSeedPairs(clasificados), addDaysISO(base,7), addDaysISO(base,14));
      return true;
    }
    if(careerBmetroStageDone('cuartos') && !careerBmetroHasStage('semis')){
      const ws = careerSeriesOfList(careerBmetroStageMatches('cuartos')).map(sr=>careerSerieWinner(sr.legs)).filter(Boolean);
      ws.sort((x,y) => b.seedOrder.indexOf(x) - b.seedOrder.indexOf(y));
      const base = careerMaxDate(careerBmetroStageMatches('cuartos'));
      careerBuildSeries(b.matches, 'bmetro', 'semis', careerSeedPairs(ws), addDaysISO(base,7), addDaysISO(base,14));
      return true;
    }
    if(careerBmetroStageDone('semis') && !careerBmetroHasStage('final')){
      const ws = careerSeriesOfList(careerBmetroStageMatches('semis')).map(sr=>careerSerieWinner(sr.legs)).filter(Boolean);
      ws.sort((x,y) => b.seedOrder.indexOf(x) - b.seedOrder.indexOf(y));
      const base = careerMaxDate(careerBmetroStageMatches('semis'));
      if(ws.length >= 2){
        // Final a partido único en cancha neutral: empate, alargue y penales.
        b.matches.push(careerMkMatch('bmetro', null, 1, ws[0], ws[1], {stage:'final', neutral:true, date: addDaysISO(base,7)}));
        return true;
      }
    }
    const fin = careerBmetroStageMatches('final')[0];
    if(fin && fin.played){
      const w = careerMatchWinner(fin);
      if(w && !b.promoted.includes(w)){ b.promoted.push(w); did = true; }
    }
    return did;
  }

  // ==================== TERCERA DIVISIÓN B — TORNEO FEDERAL A ====================
  // 37 equipos. Fase regular en 4 zonas, un camino principal de 5 fases por el primer
  // ascenso y una Reválida de 6 fases por el segundo, con 4 descensos al Regional Amateur.

  const FEDERAL_STAGE_LABELS = {
    'f2': 'Segunda Fase',
    'f3': 'Tercera Fase',
    'f4': 'Cuarta Fase',
    'f5': 'Final por el 1° ascenso',
    'rev1': 'Reválida · Primera Etapa',
    'rev2': 'Reválida · Segunda Etapa',
    'rev3': 'Reválida · Tercera Fase',
    'rev4': 'Reválida · Cuarta Fase',
    'rev5': 'Reválida · Quinta Fase',
    'rev6': 'Reválida · Final por el 2° ascenso'
  };
  const FEDERAL_STAGE_ORDER = ['f2','f3','f4','f5','rev1','rev2','rev3','rev4','rev5','rev6'];

  function careerFederal(){
    const c = state.career;
    if(!c.federal) c.federal = defaultFederal();
    return c.federal;
  }
  function careerFederalTeamsFromDb(){
    const f = careerFederal();
    f.teams = [];
    let i = 0;
    const push = (t, zone) => f.teams.push({ id:'ft'+(i++)+'_'+Math.random().toString(36).slice(2,7), name:t.name, elo:t.elo, zone });
    CAREER_TEAM_DB.federalA.zoneA.forEach(t=>push(t,0));
    CAREER_TEAM_DB.federalA.zoneB.forEach(t=>push(t,1));
    CAREER_TEAM_DB.federalA.zoneC.forEach(t=>push(t,2));
    CAREER_TEAM_DB.federalA.zoneD.forEach(t=>push(t,3));
  }
  function careerFederalRegular(){ return careerFederal().matches.filter(m=>!m.stage); }
  function careerFederalStageMatches(stage){ return careerFederal().matches.filter(m=>m.stage===stage); }
  function careerFederalHasStage(stage){ return careerFederalStageMatches(stage).length > 0; }
  function careerFederalStageDone(stage){
    const ms = careerFederalStageMatches(stage);
    return ms.length > 0 && ms.every(m=>m.played);
  }
  function careerFederalZoneIds(z){ return careerFederal().teams.filter(t=>t.zone===z).map(t=>t.id); }
  function careerFederalStandings(z){
    return careerComputeStandingsFrom(careerFederalRegular(), careerFederalZoneIds(z));
  }
  function careerFederalGroupStandings(stage, gi, ids){
    return careerComputeStandingsFrom(careerFederalStageMatches(stage).filter(m=>m.group===gi), ids);
  }

  function careerGenerateFederal(){
    const c = state.career;
    const f = careerFederal();
    if(f.teams.length === 0) careerFederalTeamsFromDb();
    f.matches = [];
    f.champion = null; f.promoted = []; f.relegated = [];
    f.f2Groups = []; f.f2Seeds = []; f.rev1Groups = [];
    f.rev2Rank = []; f.rev3Rank = []; f.rev4Rank = []; f.rev5Rank = [];
    f.generatedYear = c.year;

    // El Federal A juega los miércoles.
    const start = firstWeekdayOfMonth(c.year, 1, 3);
    const dateFor = (r) => addDaysISO(start, (r-1)*7);
    let maxR = 0;
    [0,1,2,3].forEach(z => {
      const ids = careerFederalZoneIds(z);
      if(ids.length < 2) return;
      const rounds = roundRobinRounds(ids);
      maxR = Math.max(maxR, rounds.length);
      rounds.forEach((round, ri) => {
        round.forEach(mm => f.matches.push(careerMkMatch('federal', z, ri+1, mm.home, mm.away, {date: dateFor(ri+1)})));
      });
      rounds.forEach((round, ri) => {
        const rn = rounds.length + ri + 1;
        round.forEach(mm => f.matches.push(careerMkMatch('federal', z, rn, mm.away, mm.home, {date: dateFor(rn)})));
      });
    });
  }

  // Reparte una lista ordenada en dos zonas parejas (serpentina).
  function careerSerpentine(ordered, groups){
    const out = Array.from({length:groups}, ()=>[]);
    ordered.forEach((id, i) => {
      const ciclo = Math.floor(i/groups), pos = i % groups;
      out[(ciclo % 2 === 0) ? pos : (groups-1-pos)].push(id);
    });
    return out;
  }
  function careerFederalBuildGroupStage(stage, groups, startDate){
    const f = careerFederal();
    let maxR = 0;
    groups.forEach((ids, gi) => {
      if(ids.length < 2) return;
      const rounds = roundRobinRounds(ids);
      maxR = Math.max(maxR, rounds.length);
      rounds.forEach((round, ri) => {
        round.forEach(mm => f.matches.push(careerMkMatch('federal', null, ri+1, mm.home, mm.away, {stage, group:gi, date: addDaysISO(startDate, ri*7)})));
      });
    });
    return maxR;
  }

  // Puntos y partidos de un equipo a lo largo de toda la fase regular más la Reválida.
  function careerFederalPromedio(id){
    const f = careerFederal();
    const list = f.matches.filter(m => !m.stage || m.stage === 'rev1');
    const row = careerMatchPointsRow(list, id);
    return { id, pts: row.pts, pj: row.pj, avg: row.pj > 0 ? row.pts / row.pj : 0 };
  }

  function careerFederalBuildSegundaFaseYRevalida(){
    const f = careerFederal();
    const st = [0,1,2,3].map(z => careerFederalStandings(z));
    if(st.some(x => x.length < 5)) return false;

    // Clasifican 18: los 5 primeros de la zona de 10, los 4 primeros de cada zona de 9
    // y el mejor 5° entre esas tres zonas.
    const clasif = st[0].slice(0,5).map(r=>r.id);
    [1,2,3].forEach(z => st[z].slice(0,4).forEach(r => clasif.push(r.id)));
    const quintos = [1,2,3].map(z => st[z][4]).filter(Boolean)
      .sort((x,y) => y.pts-x.pts || y.dg-x.dg || y.gf-x.gf || careerTeamById(y.id).elo-careerTeamById(x.id).elo);
    if(quintos[0]) clasif.push(quintos[0].id);

    const todos = f.teams.map(t=>t.id);
    const resto = todos.filter(id => !clasif.includes(id));

    const ordenados = clasif.slice().sort((a,b) => careerTeamById(b).elo - careerTeamById(a).elo);
    f.f2Groups = careerSerpentine(ordenados, 2);
    const restoOrden = resto.slice().sort((a,b) => careerTeamById(b).elo - careerTeamById(a).elo);
    f.rev1Groups = careerSerpentine(restoOrden, 2);

    const base = addDaysISO(careerMaxDate(careerFederalRegular()), 7);
    careerFederalBuildGroupStage('f2', f.f2Groups, base);
    careerFederalBuildGroupStage('rev1', f.rev1Groups, base);
    return true;
  }

  function careerFederalResolveDescensos(){
    const f = careerFederal();
    if(f.relegated && f.relegated.length) return false;
    if(!careerFederalStageDone('rev1')) return false;
    f.relegated = [];
    // En cada zona de la Reválida se arma una tabla de promedios y bajan los dos peores.
    f.rev1Groups.forEach(ids => {
      const filas = ids.map(id => careerFederalPromedio(id))
        .sort((x,y) => y.avg - x.avg || careerTeamById(y.id).elo - careerTeamById(x.id).elo);
      filas.slice(-2).forEach(r => f.relegated.push(r.id));
    });
    return true;
  }

  function careerFederalAutoAdvance(){
    const f = careerFederal();
    if(!f.teams || f.teams.length < 8) return false;
    const reg = careerFederalRegular();
    if(reg.length === 0 || !reg.every(m=>m.played)) return false;
    let did = false;

    if(!careerFederalHasStage('f2')){
      return careerFederalBuildSegundaFaseYRevalida();
    }
    if(careerFederalResolveDescensos()) did = true;

    const f2Stand = f.f2Groups.map((ids, gi) => careerFederalGroupStandings('f2', gi, ids));

    // Tercera Fase: 1°A-4°B, 1°B-4°A, 2°A-3°B, 2°B-3°A
    if(careerFederalStageDone('f2') && !careerFederalHasStage('f3')){
      const seeds = [];
      for(let pos=0; pos<4; pos++){
        const par = [f2Stand[0][pos], f2Stand[1][pos]].filter(Boolean)
          .sort((x,y) => y.pts-x.pts || y.dg-x.dg || y.gf-x.gf);
        par.forEach(r => seeds.push(r.id));
      }
      f.f2Seeds = seeds;
      const A = f2Stand[0].map(r=>r.id), B = f2Stand[1].map(r=>r.id);
      const crudos = [[A[0],B[3]], [B[0],A[3]], [A[1],B[2]], [B[1],A[2]]];
      const pairs = crudos.map(([x,y]) => {
        const mejor = seeds.indexOf(x) <= seeds.indexOf(y) ? x : y;
        return { better: mejor, worse: mejor === x ? y : x };
      });
      const base = careerMaxDate(careerFederalStageMatches('f2'));
      careerBuildSeries(f.matches, 'federal', 'f3', pairs, addDaysISO(base,7), addDaysISO(base,14));
      return true;
    }

    const f3Series = careerSeriesOfList(careerFederalStageMatches('f3'));
    const ordenarPorSeed = arr => arr.slice().sort((x,y) => f.f2Seeds.indexOf(x) - f.f2Seeds.indexOf(y));

    // Cuarta Fase: los 4 ganadores, cruces según la Segunda Fase
    if(careerFederalStageDone('f3') && !careerFederalHasStage('f4')){
      const ws = ordenarPorSeed(f3Series.map(sr=>careerSerieWinner(sr.legs)).filter(Boolean));
      const base = careerMaxDate(careerFederalStageMatches('f3'));
      careerBuildSeries(f.matches, 'federal', 'f4', careerSeedPairs(ws), addDaysISO(base,7), addDaysISO(base,14));
      return true;
    }

    // Final por el primer ascenso: partido único en cancha neutral
    if(careerFederalStageDone('f4') && !careerFederalHasStage('f5')){
      const ws = ordenarPorSeed(careerSeriesOfList(careerFederalStageMatches('f4')).map(sr=>careerSerieWinner(sr.legs)).filter(Boolean));
      const base = careerMaxDate(careerFederalStageMatches('f4'));
      if(ws.length >= 2){
        f.matches.push(careerMkMatch('federal', null, 1, ws[0], ws[1], {stage:'f5', neutral:true, date: addDaysISO(base,7)}));
        return true;
      }
    }
    const f5 = careerFederalStageMatches('f5')[0];
    if(f5 && f5.played && !f.champion){
      const w = careerMatchWinner(f5);
      if(w){
        f.champion = w;
        if(!f.promoted.includes(w)) f.promoted.push(w);
        careerRecordTitle('federal', w);
        did = true;
      }
    }

    // ---- Reválida ----
    // Segunda Etapa: 24 equipos con un ordenamiento del 1 al 24.
    if(careerFederalStageDone('f3') && careerFederalStageDone('rev1') && !careerFederalHasStage('rev2')){
      const perdedoresF3 = ordenarPorSeed(f3Series.map(sr => {
        const w = careerSerieWinner(sr.legs);
        const ids = [sr.legs[0].home, sr.legs[0].away];
        return ids.find(x => x !== w);
      }).filter(Boolean));

      // Puestos 5° a 14°: los que quedaron del 5° al 9° en cada zona de la Segunda Fase
      const desdeF2 = [];
      for(let pos=4; pos<9; pos++){
        const par = [f2Stand[0][pos], f2Stand[1][pos]].filter(Boolean)
          .sort((x,y) => y.pts-x.pts || y.dg-x.dg || y.gf-x.gf);
        par.forEach(r => desdeF2.push(r.id));
      }
      // Puestos 15° a 24°: del 1° al 5° de cada zona de la Primera Etapa, por promedio
      const rev1Stand = f.rev1Groups.map((ids, gi) => careerFederalGroupStandings('rev1', gi, ids));
      const desdeRev1 = [];
      for(let pos=0; pos<5; pos++){
        const par = [rev1Stand[0][pos], rev1Stand[1][pos]].filter(Boolean)
          .map(r => careerFederalPromedio(r.id))
          .sort((x,y) => y.avg - x.avg || y.pts - x.pts);
        par.forEach(r => desdeRev1.push(r.id));
      }
      const rank = perdedoresF3.concat(desdeF2, desdeRev1);
      f.rev2Rank = rank;
      const base = addDaysISO(careerMaxDate(careerFederalStageMatches('rev1').concat(careerFederalStageMatches('f3'))), 7);
      careerBuildSeries(f.matches, 'federal', 'rev2', careerSeedPairs(rank), base, addDaysISO(base,7));
      return true;
    }

    // Tercera Fase de la Reválida: 12 ganadores + los 2 perdedores de la Cuarta Fase (1° y 2°)
    if(careerFederalStageDone('rev2') && careerFederalStageDone('f4') && !careerFederalHasStage('rev3')){
      const ws = careerSeriesOfList(careerFederalStageMatches('rev2')).map(sr=>careerSerieWinner(sr.legs)).filter(Boolean)
        .sort((x,y) => f.rev2Rank.indexOf(x) - f.rev2Rank.indexOf(y));
      const perdedoresF4 = ordenarPorSeed(careerSeriesOfList(careerFederalStageMatches('f4')).map(sr => {
        const w = careerSerieWinner(sr.legs);
        const ids = [sr.legs[0].home, sr.legs[0].away];
        return ids.find(x => x !== w);
      }).filter(Boolean));
      const rank = perdedoresF4.concat(ws);
      f.rev3Rank = rank;
      const base = addDaysISO(careerMaxDate(careerFederalStageMatches('rev2').concat(careerFederalStageMatches('f4'))), 7);
      careerBuildSeries(f.matches, 'federal', 'rev3', careerSeedPairs(rank), base, addDaysISO(base,7));
      return true;
    }

    // Cuarta Fase de la Reválida: 7 ganadores + el perdedor de la final, que entra como 1°
    if(careerFederalStageDone('rev3') && f5 && f5.played && !careerFederalHasStage('rev4')){
      const ws = careerSeriesOfList(careerFederalStageMatches('rev3')).map(sr=>careerSerieWinner(sr.legs)).filter(Boolean)
        .sort((x,y) => f.rev3Rank.indexOf(x) - f.rev3Rank.indexOf(y));
      const wF5 = careerMatchWinner(f5);
      const perdedorFinal = (wF5 === f5.home) ? f5.away : f5.home;
      const rank = [perdedorFinal].concat(ws);
      f.rev4Rank = rank;
      const base = addDaysISO(careerMaxDate(careerFederalStageMatches('rev3').concat([f5])), 7);
      careerBuildSeries(f.matches, 'federal', 'rev4', careerSeedPairs(rank), base, addDaysISO(base,7));
      return true;
    }

    if(careerFederalStageDone('rev4') && !careerFederalHasStage('rev5')){
      const ws = careerSeriesOfList(careerFederalStageMatches('rev4')).map(sr=>careerSerieWinner(sr.legs)).filter(Boolean)
        .sort((x,y) => f.rev4Rank.indexOf(x) - f.rev4Rank.indexOf(y));
      f.rev5Rank = ws.slice();
      const base = addDaysISO(careerMaxDate(careerFederalStageMatches('rev4')), 7);
      careerBuildSeries(f.matches, 'federal', 'rev5', careerSeedPairs(ws), base, addDaysISO(base,7));
      return true;
    }

    // Final por el segundo ascenso: la ida en cancha del 2° y la vuelta en la del 1°.
    // Si el global termina igualado se va directo a los penales, sin ventaja deportiva.
    if(careerFederalStageDone('rev5') && !careerFederalHasStage('rev6')){
      const ws = careerSeriesOfList(careerFederalStageMatches('rev5')).map(sr=>careerSerieWinner(sr.legs)).filter(Boolean)
        .sort((x,y) => f.rev5Rank.indexOf(x) - f.rev5Rank.indexOf(y));
      const base = addDaysISO(careerMaxDate(careerFederalStageMatches('rev5')), 7);
      if(ws.length >= 2){
        careerBuildSeries(f.matches, 'federal', 'rev6', [{ better: ws[0], worse: ws[1] }], base, addDaysISO(base,7), { noAdvantage:true });
        return true;
      }
    }
    if(careerFederalHasStage('rev6')){
      const series = careerSeriesOfList(careerFederalStageMatches('rev6'));
      if(careerResolveSeriePenalties(series)) did = true;
      const w = careerSerieWinner(series[0].legs);
      if(w && !f.promoted.includes(w)){ f.promoted.push(w); did = true; }
    }

    return did;
  }


  // ---- Vistas de la tercera división ----
  function careerNombre(id){
    const t = careerTeamById(id);
    return t ? escapeHtml(t.name) : '&mdash;';
  }
  // Bloque de una llave ida y vuelta, con el global y quién avanza.
  function renderSerieBlock(sr){
    let html = sr.legs.map(m=>renderCareerMatchRow(m, null)).join('');
    if(sr.legs.length > 1 && sr.legs.every(m=>m.played)){
      const agg = careerSerieAggregate(sr.legs);
      const a = sr.legs[0].home, b = sr.legs[0].away;
      const w = careerSerieWinner(sr.legs);
      const pen = sr.legs.some(m=>m.wentToPenalties) ? ' (por penales)' : '';
      html += `<p class="hint" style="margin:-4px 0 16px;">Global: ${careerNombre(a)} ${agg[a]||0} &ndash; ${agg[b]||0} ${careerNombre(b)} &middot; avanza <strong style="color:var(--ink);">${w?careerNombre(w):'&mdash;'}</strong>${pen}</p>`;
    }
    return html;
  }
  // Fixture navegable de una fase de todos contra todos.
  function renderDivisionFixture(ctx, matches, scope, extra){
    if(!matches.length) return '';
    extra = extra || '';
    const rounds = [...new Set(matches.map(m=>m.round))].sort((a,b)=>a-b);
    const total = rounds.length;
    const cur = ensureCareerRoundPointer(ctx, total);
    const curMatches = matches.filter(m=>m.round===cur);
    let html = `<div class="panel"><h2>Fixture</h2>`;
    html += `<div class="round-header"><h3>Fecha ${cur} de ${total}</h3></div>`;
    html += renderRoundNav(ctx, cur, total, 'Fecha', 'career-nav-round');
    html += curMatches.map(m=>renderCareerMatchRow(m, null)).join('');
    if(curMatches.some(m=>!m.played && !m.bye)){
      html += `<div class="btn-row"><button class="btn primary" data-action="career-simulate-round" data-scope="${scope}" data-round="${cur}"${extra}>Simular esta fecha</button></div>`;
    }
    html += `</div>`;
    return html;
  }

  function renderCareraBmetro(){
    const c = state.career;
    careerEnsureDivisions();
    careerTryAutoAdvanceStages();
    const b = careerBmetro();

    let html = `<div class="panel">
      <h2>Primera B Metropolitana ${c.year}</h2>
      <p class="hint">Tercera división de los clubes afiliados directamente a la AFA. 22 equipos, todos contra todos a dos ruedas: 42 fechas. El 1° sale campeón y asciende directo a la Primera Nacional; el segundo ascenso se define en un reducido del 2° al 9°. El 21° y el 22° se van a la Primera C.</p>
    </div>`;

    html += renderDivisionFixture('career-bmetro', careerBmetroRegular(), 'bmetro-round');

    const tabla = careerBmetroStandings();
    html += `<div class="group-block"><h3>Tabla de posiciones</h3>${renderStandingsTable(tabla, false, BMETRO_ZONE_LEGEND, careerTeamById)}</div>`;

    if(BMETRO_STAGE_ORDER.some(st => careerBmetroHasStage(st))){
      html += `<div class="panel"><h2>Reducido por el segundo ascenso</h2>`;
      BMETRO_STAGE_ORDER.forEach(stage => {
        const ms = careerBmetroStageMatches(stage);
        if(!ms.length) return;
        html += `<div class="round-header"><h3>${BMETRO_STAGE_LABELS[stage]}</h3></div>`;
        if(stage === 'final') html += ms.map(m=>renderCareerMatchRow(m, null)).join('');
        else careerSeriesOfList(ms).forEach(sr => { html += renderSerieBlock(sr); });
        if(ms.some(m=>!m.played)){
          html += `<div class="btn-row"><button class="btn small" data-action="career-simulate-round" data-scope="bmetro-stage" data-stage="${stage}">Simular</button></div>`;
        }
      });
      html += `</div>`;
    }

    if(b.champion || (b.promoted && b.promoted.length) || (b.relegated && b.relegated.length)){
      let resumen = '';
      if(b.champion) resumen += `<div class="msg" style="background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.4);color:var(--gold-bright);">&#127942; Campeón de la Primera B Metropolitana ${c.year}: <strong>${careerNombre(b.champion)}</strong></div>`;
      if(b.promoted && b.promoted.length) resumen += `<p class="hint">Ascienden a la Primera Nacional: <strong style="color:var(--ink);">${b.promoted.map(careerNombre).join(', ')}</strong>${b.promoted.length<2?' (falta el ganador del reducido)':''}</p>`;
      if(b.relegated && b.relegated.length) resumen += `<p class="hint">Descienden a la Primera C: <strong style="color:var(--ink);">${b.relegated.map(careerNombre).join(', ')}</strong></p>`;
      html += `<div class="panel"><h2>Temporada ${c.year}</h2>${resumen}</div>`;
    }
    return html;
  }

  function renderCareraFederal(){
    const c = state.career;
    careerEnsureDivisions();
    careerTryAutoAdvanceStages();
    const f = careerFederal();
    const zonaNombres = ['Zona A','Zona B','Zona C','Zona D'];

    let html = `<div class="panel">
      <h2>Torneo Federal A ${c.year}</h2>
      <p class="hint">Tercera división de los clubes del interior, afiliados indirectamente a la AFA. 37 equipos: una zona de 10 y tres de 9, todos contra todos a dos ruedas. Los 18 mejores siguen por el camino principal hasta la final por el primer ascenso; los otros 19 van a la Reválida, que reparte el segundo ascenso y define los cuatro descensos al Regional Amateur.</p>
    </div>`;

    html += renderDivisionFixture('career-federal', careerFederalRegular(), 'federal-round');

    [0,1,2,3].forEach(z => {
      const ids = careerFederalZoneIds(z);
      if(!ids.length) return;
      const clasifican = (z === 0) ? 5 : 4;
      const legend = [{ id:'clasifica', label:'Clasifica a la Segunda Fase', from:1, to:clasifican, color:'#5A8F5A' }];
      if(z !== 0) legend.push({ id:'repechaje', label:'Entra si es el mejor 5°', from:5, to:5, color:'#8A7A2E' });
      html += `<div class="group-block"><h3>${zonaNombres[z]}</h3>${renderStandingsTable(careerFederalStandings(z), false, legend, careerTeamById)}</div>`;
    });

    // Segunda Fase y Primera Etapa de la Reválida
    [['f2', f.f2Groups, 'Segunda Fase', 4, 'Clasifica a la Tercera Fase'],
     ['rev1', f.rev1Groups, 'Reválida · Primera Etapa', 5, 'Pasa a la Segunda Etapa']].forEach(([stage, groups, titulo, corte, etiqueta]) => {
      if(!careerFederalHasStage(stage)) return;
      html += `<div class="panel"><h2>${titulo}</h2>`;
      (groups || []).forEach((ids, gi) => {
        const legend = [{ id:'pasa', label:etiqueta, from:1, to:corte, color:'#5A8F5A' }];
        html += `<div class="group-block"><h3>Zona ${gi===0?'1':'2'}</h3>${renderStandingsTable(careerFederalGroupStandings(stage, gi, ids), false, legend, careerTeamById)}</div>`;
      });
      const ms = careerFederalStageMatches(stage);
      if(ms.some(m=>!m.played)){
        html += `<div class="btn-row"><button class="btn small" data-action="career-simulate-round" data-scope="federal-stage" data-stage="${stage}">Simular ${titulo.toLowerCase()} completa</button></div>`;
      }
      if(stage === 'rev1' && f.relegated && f.relegated.length){
        html += `<p class="hint">Descienden al Regional Amateur (tabla de promedios): <strong style="color:var(--ink);">${f.relegated.map(careerNombre).join(', ')}</strong></p>`;
      }
      html += `</div>`;
    });

    // Llaves
    const llaves = FEDERAL_STAGE_ORDER.filter(st => st !== 'f2' && st !== 'rev1' && careerFederalHasStage(st));
    if(llaves.length){
      html += `<div class="panel"><h2>Fases eliminatorias</h2>`;
      llaves.forEach(stage => {
        const ms = careerFederalStageMatches(stage);
        html += `<div class="round-header"><h3>${FEDERAL_STAGE_LABELS[stage]}</h3></div>`;
        if(stage === 'f5') html += ms.map(m=>renderCareerMatchRow(m, null)).join('');
        else careerSeriesOfList(ms).forEach(sr => { html += renderSerieBlock(sr); });
        if(ms.some(m=>!m.played)){
          html += `<div class="btn-row"><button class="btn small" data-action="career-simulate-round" data-scope="federal-stage" data-stage="${stage}">Simular</button></div>`;
        }
      });
      html += `</div>`;
    }

    if(f.champion || (f.promoted && f.promoted.length) || (f.relegated && f.relegated.length)){
      let resumen = '';
      if(f.champion) resumen += `<div class="msg" style="background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.4);color:var(--gold-bright);">&#127942; Ganador de la final por el primer ascenso ${c.year}: <strong>${careerNombre(f.champion)}</strong></div>`;
      if(f.promoted && f.promoted.length) resumen += `<p class="hint">Ascienden a la Primera Nacional: <strong style="color:var(--ink);">${f.promoted.map(careerNombre).join(', ')}</strong>${f.promoted.length<2?' (falta el ganador de la Reválida)':''}</p>`;
      if(f.relegated && f.relegated.length) resumen += `<p class="hint">Descienden al Regional Amateur: <strong style="color:var(--ink);">${f.relegated.map(careerNombre).join(', ')}</strong></p>`;
      html += `<div class="panel"><h2>Temporada ${c.year}</h2>${resumen}</div>`;
    }
    return html;
  }


  // ==================== CUARTA DIVISIÓN — PRIMERA C METROPOLITANA ====================
  // 28 equipos en 2 zonas de 14. Todos contra todos dentro de la zona a dos ruedas más
  // tres cruces interzonales por rueda: 32 fechas. Dos ascensos a la B Metropolitana.

  const PC_STAGE_LABELS = {
    'final-titulo': 'Final por el campeonato y el 1° ascenso',
    'red-r1': 'Reducido · Primera ronda',
    'red-r2': 'Reducido · Semifinales (7 equipos)',
    'red-semis': 'Reducido · Antesala de la final',
    'red-final': 'Reducido · Final por el 2° ascenso',
    'permanencia': 'Partido por la permanencia'
  };
  const PC_STAGE_ORDER = ['final-titulo','red-r1','red-r2','red-semis','red-final','permanencia'];
  const PC_ZONE_LEGEND = [
    { id:'final', label:'Final por el campeonato y el 1° ascenso', from:1, to:1, color:'#C9A227' },
    { id:'reducido', label:'Reducido por el 2° ascenso', from:2, to:7, color:'#5A8F5A' },
    { id:'permanencia', label:'Juega la permanencia', from:14, to:14, color:'#B4433A' }
  ];

  function careerPrimeraC(){
    const c = state.career;
    if(!c.primerac) c.primerac = defaultPrimeraC();
    return c.primerac;
  }
  function careerPcTeamsFromDb(){
    const pc = careerPrimeraC();
    pc.teams = [];
    let i = 0;
    const push = (t, zone) => pc.teams.push({ id:'pc'+(i++)+'_'+Math.random().toString(36).slice(2,7), name:t.name, elo:t.elo, zone });
    CAREER_TEAM_DB.primeraC.zoneA.forEach(t=>push(t,0));
    CAREER_TEAM_DB.primeraC.zoneB.forEach(t=>push(t,1));
  }
  function careerPcZoneIds(z){ return careerPrimeraC().teams.filter(t=>t.zone===z).map(t=>t.id); }
  function careerPcRegular(){ return careerPrimeraC().matches.filter(m=>!m.stage); }
  function careerPcStandings(z){ return careerComputeStandingsFrom(careerPcRegular(), careerPcZoneIds(z)); }
  function careerPcStageMatches(stage){ return careerPrimeraC().matches.filter(m=>m.stage===stage); }
  function careerPcHasStage(stage){ return careerPcStageMatches(stage).length > 0; }
  function careerPcStageDone(stage){
    const ms = careerPcStageMatches(stage);
    return ms.length > 0 && ms.every(m=>m.played);
  }

  function careerGeneratePrimeraC(){
    const c = state.career;
    const pc = careerPrimeraC();
    if(pc.teams.length === 0) careerPcTeamsFromDb();
    pc.matches = [];
    pc.champion = null; pc.promoted = []; pc.desafiliado = null;
    pc.permanenciaWinner = null; pc.redOrder = []; pc.redBye = null;
    pc.generatedYear = c.year;

    // La Primera C juega los viernes.
    const start = firstWeekdayOfMonth(c.year, 1, 5);
    const dateFor = (r) => addDaysISO(start, (r-1)*7);
    const zA = careerPcZoneIds(0), zB = careerPcZoneIds(1);
    if(zA.length < 2 || zB.length < 2) return;

    const rr = [roundRobinRounds(zA), roundRobinRounds(zB)];
    const nR = Math.max(rr[0].length, rr[1].length);   // 13

    // Primera rueda de zona
    [0,1].forEach(zi => rr[zi].forEach((round, ri) => {
      round.forEach(mm => pc.matches.push(careerMkMatch('primerac', zi, ri+1, mm.home, mm.away, {date: dateFor(ri+1)})));
    }));

    // Tres cruces interzonales por rueda, con rivales distintos en cada uno
    const sa = shuffleArr(zA.slice()), sb = shuffleArr(zB.slice());
    const n = Math.min(sa.length, sb.length);
    const cruces = [0,1,2].map(k => {
      const lista = [];
      for(let i=0;i<n;i++) lista.push([sa[i], sb[(i+k) % n]]);
      return lista;
    });
    cruces.forEach((lista, k) => {
      const rn = nR + 1 + k;
      lista.forEach((par, i) => pc.matches.push(careerMkMatch('primerac', null, rn, i%2===0?par[0]:par[1], i%2===0?par[1]:par[0], {interzonal:true, date: dateFor(rn)})));
    });

    // Segunda rueda de zona, con las localías invertidas
    const off = nR + 3;
    [0,1].forEach(zi => rr[zi].forEach((round, ri) => {
      const rn = off + ri + 1;
      round.forEach(mm => pc.matches.push(careerMkMatch('primerac', zi, rn, mm.away, mm.home, {date: dateFor(rn)})));
    }));
    // Interzonales de vuelta
    cruces.forEach((lista, k) => {
      const rn = off + nR + 1 + k;
      lista.forEach((par, i) => pc.matches.push(careerMkMatch('primerac', null, rn, i%2===0?par[1]:par[0], i%2===0?par[0]:par[1], {interzonal:true, date: dateFor(rn)})));
    });
  }

  // Tabla general de la Primera C, para ordenar el reducido.
  function careerPcTablaGeneral(){
    const pc = careerPrimeraC();
    return careerComputeStandingsFrom(careerPcRegular(), pc.teams.map(t=>t.id));
  }
  function careerPcSeries(stage){ return careerSeriesOfList(careerPcStageMatches(stage)); }
  // En la C ninguna llave tiene ventaja deportiva: si el global queda igualado, van a penales.
  function careerPcOrdenar(ids, general){
    const pos = {}; general.forEach((r,i)=>pos[r.id]=i);
    return ids.slice().sort((a,b) => (pos[a]===undefined?999:pos[a]) - (pos[b]===undefined?999:pos[b]));
  }

  function careerPrimeraCAutoAdvance(){
    const pc = careerPrimeraC();
    if(!pc.teams || pc.teams.length < 8) return false;
    const reg = careerPcRegular();
    if(reg.length === 0 || !reg.every(m=>m.played)) return false;
    let did = false;
    const general = careerPcTablaGeneral();

    if(!careerPcHasStage('final-titulo')){
      const stA = careerPcStandings(0), stB = careerPcStandings(1);
      if(stA.length < 14 || stB.length < 14) return false;
      const base = careerMaxDate(reg);
      // Final por el campeonato: el de mejor rendimiento general cierra de local.
      const mejor = careerPcOrdenar([stA[0].id, stB[0].id], general);
      careerBuildSeries(pc.matches, 'primerac', 'final-titulo', [{ better: mejor[0], worse: mejor[1] }],
        addDaysISO(base,7), addDaysISO(base,14), { noAdvantage:true });
      // Reducido: 2° al 7° de cada zona, los cruces se arman adentro de cada zona
      const pares = [];
      [stA, stB].forEach(st => {
        pares.push({ better: st[1].id, worse: st[6].id });
        pares.push({ better: st[2].id, worse: st[5].id });
        pares.push({ better: st[3].id, worse: st[4].id });
      });
      careerBuildSeries(pc.matches, 'primerac', 'red-r1', pares, addDaysISO(base,7), addDaysISO(base,14), { noAdvantage:true });
      // Partido por la permanencia entre los dos últimos
      pc.matches.push(careerMkMatch('primerac', null, 1, stA[13].id, stB[13].id, {stage:'permanencia', neutral:true, date: addDaysISO(base,7)}));
      return true;
    }

    PC_STAGE_ORDER.forEach(stage => {
      if(careerResolveSeriePenalties(careerPcSeries(stage))) did = true;
    });

    // Campeón y primer ascenso
    const finalSerie = careerPcSeries('final-titulo')[0];
    const campeon = finalSerie ? careerSerieWinner(finalSerie.legs) : null;
    if(campeon && !pc.champion){
      pc.champion = campeon;
      if(!pc.promoted.includes(campeon)) pc.promoted.push(campeon);
      careerRecordTitle('primerac', campeon);
      did = true;
    }

    // Permanencia y desafiliación
    const perm = careerPcStageMatches('permanencia')[0];
    if(perm && perm.played && !pc.permanenciaWinner){
      const w = careerMatchWinner(perm);
      if(w){
        pc.permanenciaWinner = w;
        pc.desafiliado = (w === perm.home) ? perm.away : perm.home;
        did = true;
      }
    }

    // Segunda ronda del reducido: los 6 ganadores más el perdedor de la final.
    // Con 7 equipos, el mejor ubicado pasa de instancia sin jugar.
    if(campeon && careerPcStageDone('red-r1') && !careerPcHasStage('red-r2')){
      const ids = [finalSerie.legs[0].home, finalSerie.legs[0].away];
      const perdedorFinal = ids.find(x => x !== campeon);
      const ganadores = careerPcSeries('red-r1').map(sr=>careerSerieWinner(sr.legs)).filter(Boolean);
      if(ganadores.length === 6 && perdedorFinal){
        const orden = [perdedorFinal].concat(careerPcOrdenar(ganadores, general));
        pc.redOrder = orden;
        pc.redBye = orden[0];
        const resto = orden.slice(1);   // 6 equipos: 2vs7, 3vs6, 4vs5
        const base = careerMaxDate(careerPcStageMatches('red-r1').concat(careerPcStageMatches('final-titulo')));
        careerBuildSeries(pc.matches, 'primerac', 'red-r2', careerSeedPairs(resto), addDaysISO(base,7), addDaysISO(base,14), { noAdvantage:true });
        return true;
      }
    }
    if(careerPcStageDone('red-r2') && !careerPcHasStage('red-semis')){
