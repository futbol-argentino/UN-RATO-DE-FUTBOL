<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Torneos por ELO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1B14;
    --panel:#16261C;
    --panel-alt:#1C2F22;
    --line:#33473A;
    --ink:#ECE7DA;
    --ink-dim:#9FAC98;
    --gold:#C9A227;
    --gold-bright:#E4C64E;
    --red:#B23A2E;
    --green-win:#5A8F5A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 40px, transparent 40px, transparent 80px);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,.num{ font-family:'Oswald', sans-serif; font-weight:500; letter-spacing:0.01em; }
  .num{ font-variant-numeric: tabular-nums; }
  button{ font-family:'Work Sans', sans-serif; cursor:pointer; }
  input, select{ font-family:'Work Sans', sans-serif; }
  ::selection{ background:var(--gold); color:#0F1B14; }

  #app{ max-width:1040px; margin:0 auto; padding:0 20px 60px; }
  body.carrera-mode #app{ max-width:none; padding:0; margin:0; }

  /* ---------- Modo Carrera: tema propio (azul petróleo / celeste) ---------- */
  /* Redefine las mismas variables que ya usan .panel/.match/tablas/botones, así
     todo lo que ya existe se reskinea solo, sin tocar ninguna función de render. */
  .carrera-shell{
    --bg:#0A1622;
    --panel:#0F2130;
    --panel-alt:#15293C;
    --line:#204158;
    --ink:#EAF3FB;
    --ink-dim:#7E97AE;
    --gold:#38BDF0;
    --gold-bright:#6BD6FF;
    --red:#EF4E4E;
    --green-win:#34D399;
    background-color:var(--bg);
    background-image:
      radial-gradient(1100px 560px at 12% -8%, rgba(56,189,240,0.12), transparent 60%),
      radial-gradient(800px 460px at 100% 0%, rgba(56,189,240,0.07), transparent 55%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
  }
  .cs-sidebar{
    position:sticky; top:0; height:100vh; width:240px; flex:0 0 auto;
    background:var(--panel); border-right:1px solid var(--line);
    padding:18px 12px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;
  }
  .cs-brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 18px; }
  .cs-brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); }
  .cs-brand .txt{ font-family:'Oswald',sans-serif; font-size:15px; color:var(--ink); letter-spacing:.02em; }
  .cs-brand .txt span{ color:var(--gold-bright); }
  .cs-navgroup-label{ font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); margin:16px 10px 6px; }
  .cs-nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    color:var(--ink-dim); text-decoration:none; font-size:13.5px; cursor:pointer;
    transition:background .15s ease,color .15s ease; border:none; background:none; width:100%; text-align:left;
    font-family:'Work Sans',sans-serif;
  }
  .cs-nav-item:hover{ background:var(--panel-alt); color:var(--ink); }
  .cs-nav-item.active{ background:var(--panel-alt); color:var(--gold-bright); box-shadow:inset 2px 0 0 var(--gold); }
  .cs-nav-item .ic{ width:18px; text-align:center; font-size:14.5px; flex:0 0 auto; }
  .cs-nav-item.disabled{ opacity:.4; cursor:default; }
  .cs-nav-item.disabled:hover{ background:none; color:var(--ink-dim); }
  .cs-main{ flex:1 1 auto; min-width:0; }
  .cs-topbar{
    position:sticky; top:0; z-index:5; background:rgba(15,33,48,.86); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center;
    justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .cs-topbar .cs-tb-left{ display:flex; flex-direction:column; gap:2px; }
  .cs-topbar .cs-tb-left .team{ font-family:'Oswald',sans-serif; font-size:17px; color:var(--ink); }
  .cs-topbar .cs-tb-left .season{ font-size:12px; color:var(--ink-dim); }
  .cs-topbar .cs-tb-right{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-dim); }
  .cs-content{ padding:22px 26px 70px; max-width:1180px; }
  .cs-hero{
    background:linear-gradient(135deg, var(--panel-alt), var(--panel));
    border:1px solid var(--line); border-radius:16px; padding:22px 24px; margin-bottom:20px;
  }
  .cs-hero .season-tag{ color:var(--gold-bright); font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:12px; }
  .cs-hero .matchup{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; font-family:'Oswald',sans-serif; font-size:19px; margin:6px 0 10px; }
  .cs-hero .matchup > span{ display:flex; align-items:center; gap:10px; }
  .cs-hero .vs-sep{ color:var(--ink-dim); font-size:13px; }
  .cs-hero .meta{ color:var(--ink-dim); font-size:13px; margin-bottom:14px; }
  .cs-cards-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:10px; margin-bottom:24px; }
  .cs-stat-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 14px 11px; }
  .cs-stat-card .label{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
  .cs-stat-card .value{ font-family:'Oswald',sans-serif; font-size:22px; color:var(--ink); }
  .cs-section-title{ font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-dim); margin:24px 0 10px; }
  .cs-fixture-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 14px;
    margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    transition:border-color .15s ease;
  }
  .cs-fixture-card:hover{ border-color:var(--gold); }
  .cs-badge{ border-radius:7px; display:inline-flex; align-items:center; justify-content:center; font-weight:600; color:#06121C; flex:0 0 auto; font-family:'Work Sans',sans-serif; }
  .cs-result-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .cs-result-row:last-child{ border-bottom:none; }
  .cs-result-dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .cs-result-dot.win{ background:var(--green-win); }
  .cs-result-dot.draw{ background:var(--ink-dim); }
  .cs-result-dot.loss{ background:var(--red); }
  .cs-empty-hint{ color:var(--ink-dim); font-size:13px; padding:16px 0; }
  .cs-stub{ text-align:center; padding:60px 20px; color:var(--ink-dim); }
  .cs-stub .big{ font-size:34px; margin-bottom:10px; }
  .cs-comp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; margin-bottom:8px; }
  .cs-comp-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px;
    cursor:pointer; transition:border-color .15s ease, transform .15s ease;
  }
  .cs-comp-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
  .cs-comp-card .cc-icon{ font-size:21px; margin-bottom:8px; }
  .cs-comp-card .cc-title{ font-family:'Oswald',sans-serif; font-size:15.5px; color:var(--ink); margin-bottom:4px; }
  .cs-comp-card .cc-sub{ font-size:12px; color:var(--ink-dim); margin-bottom:14px; min-height:30px; }
  .cs-comp-card .cc-cta{ font-size:11.5px; color:var(--gold-bright); }
  .cs-stage-rail{ display:flex; align-items:center; flex-wrap:wrap; gap:4px; margin:12px 0 18px; }
  .cs-stage-pip{ padding:5px 11px; border-radius:20px; border:1px solid var(--line); background:var(--panel); font-size:11px; color:var(--ink-dim); }
  .cs-stage-pip.active{ color:var(--gold-bright); border-color:var(--gold); background:var(--panel-alt); }
  .cs-stage-pip.done{ color:var(--ink); }
  .cs-stage-sep{ color:var(--ink-dim); font-size:11px; }
  .cs-team-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:6px; }
  .cs-team-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 14px;
    text-align:center; cursor:pointer; transition:border-color .15s ease, transform .15s ease;
  }
  .cs-team-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
  .cs-team-card .cs-badge{ margin:0 auto 10px; }
  .ctc-name{ font-size:13px; color:var(--ink); margin-bottom:4px; min-height:34px; }
  .ctc-tag{ display:block; font-size:9.5px; letter-spacing:.04em; color:var(--gold-bright); margin-top:3px; }
  .ctc-elo{ font-family:'Oswald',sans-serif; font-size:15px; color:var(--ink-dim); }
  .cs-elo-chart{ width:100%; height:140px; display:block; }
  @media (max-width:860px){
    .carrera-shell{ flex-direction:column; }
    .cs-sidebar{
      position:fixed; left:0; right:0; bottom:0; top:auto; width:100%; height:auto;
      flex-direction:row; overflow-x:auto; padding:6px 8px; z-index:20;
      border-right:none; border-top:1px solid var(--line); gap:0;
    }
    .cs-brand, .cs-navgroup-label{ display:none; }
    .cs-nav-item{ flex-direction:column; gap:2px; font-size:9.5px; padding:7px 9px; white-space:nowrap; border-radius:6px; }
    .cs-nav-item .ic{ font-size:16px; }
    .cs-main{ width:100%; padding-bottom:64px; }
    .cs-content{ padding:16px 14px 24px; }
    .cs-topbar{ padding:12px 14px; }
    .cs-hero .matchup{ font-size:16px; }
  }

  .topbar{
    padding:28px 0 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:24px;
  }
  .topbar h1{
    font-size:26px; margin:0 0 4px; color:var(--ink);
  }
  .topbar h1 span{ color:var(--gold); }
  .topbar .sub{ color:var(--ink-dim); font-size:13.5px; margin:0 0 18px; }

  .tabs{ display:flex; gap:4px; flex-wrap:wrap; }
  .tab{
    display:flex; align-items:center; gap:8px;
    padding:9px 16px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink-dim);
    border-radius:3px;
    font-size:13.5px;
  }
  .tab .n{
    font-family:'Oswald', sans-serif;
    color:var(--ink-dim);
    border:1px solid var(--line);
    width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    font-size:11px;
  }
  .tab.active{ border-color:var(--gold); color:var(--ink); background:var(--panel-alt); }
  .tab.active .n{ border-color:var(--gold); color:var(--gold); }
  .tab.done .n{ background:var(--gold); color:#16210F; border-color:var(--gold); }
  .tab.locked{ opacity:0.4; cursor:not-allowed; }
  .tab:not(.locked){ cursor:pointer; }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:24px;
    margin-bottom:20px;
  }
  .panel h2{ font-size:19px; margin:0 0 4px; }
  .panel .hint{ color:var(--ink-dim); font-size:13px; margin:0 0 18px; }

  .grid{ display:grid; gap:16px; }
  .grid.cols-2{ grid-template-columns:1fr 1fr; }
  .grid.cols-3{ grid-template-columns:1fr 1fr 1fr; }
  @media(max-width:640px){ .grid.cols-2, .grid.cols-3{ grid-template-columns:1fr; } }

  label{ display:block; font-size:12.5px; color:var(--ink-dim); margin-bottom:6px; }
  input[type=text], input[type=number], select, textarea{
    width:100%;
    background:#0F1B14;
    border:1px solid var(--line);
    color:var(--ink);
    padding:9px 10px;
    border-radius:3px;
    font-size:14px;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--gold); }
  textarea{ resize:vertical; min-height:80px; font-family:'Work Sans',sans-serif; }
  .field{ margin-bottom:0; }
  .field-row{ display:flex; align-items:center; gap:10px; }
  .checkline{ display:flex; align-items:center; gap:8px; padding:10px 0; }
  .checkline input{ width:auto; }
  .checkline label{ margin:0; color:var(--ink); font-size:14px; }

  .btn{
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold-bright);
    padding:10px 18px;
    border-radius:3px;
    font-size:13.5px;
    font-weight:500;
  }
  .btn:hover{ background:rgba(201,162,39,0.1); }
  .btn.primary{ background:var(--gold); color:#16210F; border-color:var(--gold); }
  .btn.primary:hover{ background:var(--gold-bright); }
  .btn.ghost{ border-color:var(--line); color:var(--ink-dim); }
  .btn.ghost:hover{ border-color:var(--ink-dim); color:var(--ink); }
  .btn.small{ padding:6px 12px; font-size:12.5px; }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; color:var(--ink-dim); font-weight:500; font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); }
  td{ padding:7px 8px; border-bottom:1px solid rgba(51,71,58,0.5); }
  tr.top3 td:first-child{ border-left:2px solid var(--gold); }

  .team-row{ display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid rgba(51,71,58,0.5); }
  .team-row .name{ flex:1; }
  .team-row .elo{ font-family:'Oswald',sans-serif; color:var(--gold); width:60px; text-align:right; }
  .team-row button{ background:none; border:none; color:var(--ink-dim); font-size:16px; padding:2px 6px; }
  .team-row button:hover{ color:var(--red); }

  .empty{ color:var(--ink-dim); font-size:13.5px; padding:20px 0; text-align:center; border:1px dashed var(--line); border-radius:4px; }

  .match{
    display:grid;
    grid-template-columns: 1fr auto auto auto 1fr;
    align-items:center;
    gap:10px;
    padding:12px 10px;
    border-bottom:1px solid rgba(51,71,58,0.5);
  }
  .match .side{ font-size:13.5px; }
  .match .side.away{ text-align:right; }
  .match .side .elo-tag{ color:var(--ink-dim); font-size:11px; display:block; }
  .match .score-input{ width:38px; text-align:center; padding:6px 2px; }
  .match .vs{ color:var(--ink-dim); font-size:12px; }
  .match .prob{ font-size:11px; color:var(--ink-dim); width:52px; text-align:center; }
  .match .bye-note{ color:var(--ink-dim); font-style:italic; font-size:12.5px; }
  .match.played .side.winner{ color:var(--gold-bright); font-weight:600; }
  .match .delta{ font-size:10.5px; color:var(--ink-dim); }
  .match .delta.pos{ color:var(--green-win); }
  .match .delta.neg{ color:var(--red); }
  .match-actions{ display:flex; gap:6px; justify-content:center; }

  .round-header{ display:flex; align-items:center; justify-content:space-between; margin:20px 0 6px; }
  .round-header h3{ font-size:14.5px; margin:0; color:var(--ink); }
  .round-header .btn{ margin:0; }
  .group-block{ margin-bottom:26px; }
  .group-block h3{ font-size:15px; color:var(--gold); margin:0 0 10px; border-bottom:1px solid var(--line); padding-bottom:6px; }

  .champion-banner{
    text-align:center; padding:32px 20px; border:1px solid var(--gold);
    border-radius:4px; background:var(--panel-alt); margin-bottom:20px;
  }
  .champion-banner .label{ color:var(--ink-dim); font-size:12px; margin-bottom:6px; }
  .champion-banner .name{ font-family:'Oswald',sans-serif; font-size:30px; color:var(--gold-bright); }

  .bracket{ display:flex; gap:28px; overflow-x:auto; padding:10px 2px 20px; }
  .bracket-round{ display:flex; flex-direction:column; justify-content:space-around; min-width:190px; gap:14px; }
  .bracket-round .rlabel{ color:var(--ink-dim); font-size:11.5px; margin-bottom:4px; }
  .bracket-match{ border:1px solid var(--line); border-radius:3px; padding:8px 10px; background:var(--panel-alt); font-size:12.5px; }
  .bracket-match .r{ display:flex; justify-content:space-between; padding:2px 0; }
  .bracket-match .r.win{ color:var(--gold-bright); font-weight:600; }
  .bracket-match .r.bye{ color:var(--ink-dim); font-style:italic; }

  .msg{ font-size:13px; padding:10px 12px; border-radius:3px; margin-bottom:14px; }
  .msg.warn{ background:rgba(178,58,46,0.15); border:1px solid rgba(178,58,46,0.4); color:#E5A79C; }

  footer{ text-align:center; color:var(--ink-dim); font-size:12px; padding:20px 0 0; }
  .step-nav{ display:flex; justify-content:space-between; margin-top:22px; }

  .pos-form{ display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap; }
  .pos-badge{ font-family:'Oswald', sans-serif; font-size:10.5px; border:1px solid var(--line); border-radius:3px; padding:1px 6px; }
  .form-line{ display:flex; gap:2px; }
  .form-dot{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:var(--panel-alt); border:1px solid var(--line); font-size:9.5px; color:var(--ink-dim); }
  .form-dot.pos{ background:rgba(90,143,90,0.25); border-color:var(--green-win); color:var(--green-win); }
  .form-dot.neg{ background:rgba(178,58,46,0.2); border-color:var(--red); color:#E5A79C; }
  .side .no-data{ color:var(--ink-dim); font-size:10.5px; }

  .zone-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--ink-dim); }
  .zone-chip{ display:flex; align-items:center; gap:6px; }
  .zone-chip i{ width:10px; height:10px; border-radius:2px; display:inline-block; }
  .zone-swatch{ display:inline-block; width:14px; height:14px; border-radius:3px; margin-right:8px; vertical-align:middle; border:1px solid rgba(255,255,255,0.15); }
  .table-scroll{ overflow-x:auto; }
  .pos-pill{ display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:22px; padding:0 6px; border-radius:6px; border:1px solid var(--line); font-family:'Oswald',sans-serif; font-size:12px; color:var(--ink-dim); }

  .round-nav{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:14px 0 10px; flex-wrap:wrap; }
  .round-nav select{ width:auto; max-width:240px; }
  .round-nav .round-label{ color:var(--ink-dim); font-size:12.5px; }

  .menu-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 4px; border-bottom:1px solid rgba(51,71,58,0.5); }
  .menu-row .info strong{ color:var(--ink); font-size:14.5px; }
  .menu-row .info .meta{ color:var(--ink-dim); font-size:12px; margin-top:3px; }
  .menu-row .actions{ display:flex; gap:8px; align-items:center; }
  .topbar-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  // ---------- State ----------
  function defaultConfig(){
    return {
      name: 'Torneo',
      format: 'liga',
      pointsWin: 3, pointsDraw: 1, pointsLoss: 0,
      allowDraws: true,
      doubleRound: false,
      twoLegged: false,
      numGroups: 2,
      advancePerGroup: 2,
      swissRounds: 4,
      defaultElo: 1500,
      kFactor: 24,
      homeAdvantage: 40,
      drawProb: 0.25,
      surpriseFactor: 45,
      seedMethod: 'elo',
      zones: []           // {id, label, from, to, color}
    };
  }

  function defaultCareer(){
    return {
      id: null,                  // cada carrera guardada tiene su propio id
      name: '',                  // nombre que le pone el usuario
      step: 'menu',              // 'menu' | 'equipos' | 'elegir' | 'temporada'
      view: 'liga',               // 'liga' | 'copa-argentina' | 'copas'
      teams: [],                 // {id, name, elo, zone:0|1}
      myTeamId: null,
      selectedTeamId: null,  // equipo elegido en la galería de "Equipos" (solo UI, no afecta la simulación)
      year: 2026,
      tournament: 'apertura',    // 'apertura' | 'clausura'
      matches: [],               // liga: {id, comp, zone, round, home, away, homeScore, awayScore, played, bye, interzonal, playedAt}
      knockout: [],              // playoffs: {..., stage:'octavos'|'cuartos'|'semis'|'final', neutral, wentToPenalties, penaltyWinner}
      knockoutBuilt: false,
      champion: null,            // {tournament, year, teamId} — último título de Primera obtenido
      titles: [],                // historial completo: {year, competition, teamId}
      seasonLog: {},             // {teamId: [{year, pts, pj}, ...]} últimas hasta 3 temporadas, para la Tabla de Promedios
      copaArgentina: { otherTeams: [], matches: [], built: false, champion: null },

  // ---------- Calendario único de la carrera ----------
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function fromISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
  function addDaysISO(iso, days){ const d = fromISO(iso); d.setDate(d.getDate()+days); return toISO(d); }
  function firstWeekdayOfMonth(year, monthIndex0, dow){
    const d = new Date(year, monthIndex0, 1);
    const diff = (dow - d.getDay() + 7) % 7;
    d.setDate(1+diff);
    return toISO(d);
  }
  // próxima fecha, estrictamente posterior a fromIso, que caiga en el día de semana `dow` (0=domingo...3=miércoles)
  function nextWeekdayAfter(fromIso, dow){
    const d = fromISO(fromIso);
    d.setDate(d.getDate()+1);
    while(d.getDay() !== dow) d.setDate(d.getDate()+1);
    return toISO(d);
  }
  function careerSeasonStart(year, tournament){
    // Apertura: primer domingo de febrero. Clausura: primer domingo de agosto.
    return tournament === 'apertura' ? firstWeekdayOfMonth(year, 1, 0) : firstWeekdayOfMonth(year, 7, 0);
  }
  function formatCareerDate(iso){
    if(!iso) return '—';
    const d = fromISO(iso);
    const s = d.toLocaleDateString('es-AR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function careerMatchLists(){

  // Todos los partidos con fecha asignada, jugados o no (el calendario muestra también los resultados del día).
  function careerAllDatedMatches(){

  function careerCompLabel(m){
    const stageLabels = { octavos:'Octavos de Final', cuartos:'Cuartos de Final', semis:'Semifinales', final:'Final' };
    if(m.comp === 'apertura' || m.comp === 'clausura'){
      const base = m.comp === 'apertura' ? 'Copa de la Liga — Apertura' : 'Copa de la Liga — Clausura';
      if(m.stage) return base + ' · ' + (stageLabels[m.stage] || m.stage);
      return base + (m.interzonal ? ' · Fecha interzonal' : '');
    }
    if(m.comp === 'nacional'){
      if(m.stage) return 'Primera Nacional · ' + (NAC_STAGE_LABELS[m.stage] || m.stage);
      return 'Primera Nacional' + (m.interzonal ? ' · Fecha interzonal' : '');
    }
    if(m.comp === 'bmetro'){
      if(m.stage) return 'Primera B Metropolitana · ' + (BMETRO_STAGE_LABELS[m.stage] || m.stage);
      return 'Primera B Metropolitana';
    }
    if(m.comp === 'federal'){
      if(m.stage) return 'Torneo Federal A · ' + (FEDERAL_STAGE_LABELS[m.stage] || m.stage);
      return 'Torneo Federal A · Fase regular';
    }
    if(m.comp === 'primerac'){
      if(m.stage) return 'Primera C Metropolitana · ' + (PC_STAGE_LABELS[m.stage] || m.stage);
      return 'Primera C Metropolitana' + (m.interzonal ? ' · Fecha interzonal' : '');
    }
    if(m.comp === 'promocional'){
      if(m.stage) return 'Promocional Amateur · ' + (PROMO_STAGE_LABELS[m.stage] || m.stage);
      return 'Promocional Amateur · ' + (m.phase === 'clausura' ? 'Clausura' : 'Apertura');
    }
    if(m.comp === 'copa-argentina') return 'Copa Argentina' + (m.stage ? ' · ' + (COPA_ARG_LABELS[m.stage] || m.stage) : '');
    if(m.comp === 'libertadores') return 'Copa Libertadores' + (m.stage ? ' · ' + (COPA_ARG_LABELS[m.stage] || m.stage) : '');
    if(m.comp === 'sudamericana') return 'Copa Sudamericana' + (m.stage ? ' · ' + (COPA_ARG_LABELS[m.stage] || m.stage) : '');
    if(m.comp === 'trofeo-campeones') return 'Trofeo de Campeones';

  // Genera automáticamente la próxima ronda/etapa de cada llave cuando la anterior ya se jugó entera,
  // para que "Avanzar calendario" no dependa de ir tocando botones torneo por torneo.
  function careerTryAutoAdvanceStages(){
    const c = state.career;
    let progressed = true, guard = 0;
    while(progressed && guard < 25){
      progressed = false; guard++;
      const ligaMatches = c.matches.filter(m=>m.comp===c.tournament);
      const ligaDone = ligaMatches.length>0 && ligaMatches.every(m=>m.played);
      const zoneACount = c.teams.filter(t=>t.zone===0).length;
      const zoneBCount = c.teams.filter(t=>t.zone===1).length;
      if(ligaDone && !c.knockoutBuilt && zoneACount>=8 && zoneBCount>=8){
        careerBuildPlayoffs(); progressed = true;
      }
      if(c.knockoutBuilt){
        const stages = ['octavos','cuartos','semis','final'];
        stages.forEach(stage => {
          const ms = c.knockout.filter(m=>m.stage===stage);
          if(ms.length===0) return;
          const nextStage = stages[stages.indexOf(stage)+1];
          if(ms.every(m=>m.played) && nextStage && c.knockout.filter(m=>m.stage===nextStage).length===0){
            careerAdvancePlayoffs(stage); progressed = true;
          }
        });
      }
      if(c.copaArgentina && c.copaArgentina.built){
        COPA_ARG_STAGES.forEach(stage => {
          const ms = c.copaArgentina.matches.filter(m=>m.stage===stage);
          if(ms.length===0) return;
          const nextStage = COPA_ARG_STAGES[COPA_ARG_STAGES.indexOf(stage)+1];
          if(ms.every(m=>m.played) && nextStage && c.copaArgentina.matches.filter(m=>m.stage===nextStage).length===0){
            careerAdvanceCopaArgentina(stage); progressed = true;
          }
        });
      }
      if(c.libertadores && c.libertadores.built){
        CONTINENTAL_STAGES.forEach(stage => {
          const ms = c.libertadores.matches.filter(m=>m.stage===stage);
          if(ms.length===0) return;
          const nextStage = CONTINENTAL_STAGES[CONTINENTAL_STAGES.indexOf(stage)+1];
          if(ms.every(m=>m.played) && nextStage && c.libertadores.matches.filter(m=>m.stage===nextStage).length===0){
            careerAdvanceContinental('libertadores', stage); progressed = true;
          }
        });
      }
      if(c.sudamericana && c.sudamericana.built){
        CONTINENTAL_STAGES.forEach(stage => {
          const ms = c.sudamericana.matches.filter(m=>m.stage===stage);
          if(ms.length===0) return;
          const nextStage = CONTINENTAL_STAGES[CONTINENTAL_STAGES.indexOf(stage)+1];
          if(ms.every(m=>m.played) && nextStage && c.sudamericana.matches.filter(m=>m.stage===nextStage).length===0){
            careerAdvanceContinental('sudamericana', stage); progressed = true;
          }
        });
      }
      if(careerNacionalAutoAdvance()) progressed = true;
      if(careerBmetroAutoAdvance()) progressed = true;
      if(careerFederalAutoAdvance()) progressed = true;
      if(careerPrimeraCAutoAdvance()) progressed = true;
      if(careerPromocionalAutoAdvance()) progressed = true;
      careerMaybeBuildTrofeo();
      careerMaybeBuildSupercopaArgentina();
      careerMaybeBuildSupercopaInternacional();
    }
  }
  // Avanza el calendario único al próximo día con partidos programados de cualquier competencia.
  // Devuelve true si encontró una fecha nueva, false si no queda nada programado por ahora.
  function careerAdvanceCalendar(){
    const c = state.career;
    careerTryAutoAdvanceStages();
    const pending = careerAllUnplayedDatedMatches();
    if(pending.length === 0) return false;
    c.calendarDate = pending.map(m=>m.date).sort()[0];
    return true;
  }

  const state = {

  // ---------- Helpers ----------
  function teamById(id){ return state.teams.find(t => t.id === id); }
  function uid(prefix){ return prefix + (state.matchCounter++); }

  function eloExpected(eloA, eloB){
    return 1 / (1 + Math.pow(10, (eloB - eloA) / 400));
  }

  // Blends the pure ELO win expectation toward 50/50 as surpriseFactor rises (0-100).
  // At 0 the favorite's real ELO odds are used as-is; at 100 the match plays much more evenly.
  function adjustedProbability(expHome, surpriseFactor){
    const temp = 1 + (surpriseFactor / 100) * 1.6;
    const invT = 1 / temp;
    const a = Math.pow(expHome, invT);
    const b = Math.pow(1 - expHome, invT);
    return a / (a + b);
  }

  function poissonRandom(lambda){
    if(lambda <= 0) return 0;
    const L = Math.exp(-lambda);
    let k = 0, p = 1;
    do { k++; p *= Math.random(); } while(p > L);
    return k - 1;
  }

  function applyEloUpdate(match){
    const home = teamById(match.home), away = teamById(match.away);
    if(!home || !away) return;
    const expHome = eloExpected(home.elo + state.config.homeAdvantage, away.elo);
    const expAway = 1 - expHome;
    let sHome;
    if(match.homeScore > match.awayScore) sHome = 1;
    else if(match.homeScore < match.awayScore) sHome = 0;
    else sHome = 0.5;
    const sAway = 1 - sHome;
    const k = state.config.kFactor;
    const deltaHome = Math.round(k * (sHome - expHome));
    const deltaAway = Math.round(k * (sAway - expAway));
    home.elo += deltaHome;
    away.elo += deltaAway;
    match.deltaHome = deltaHome;
    match.deltaAway = deltaAway;
  }

  // How much the ELO gap actually separates the two sides, after the surprise-factor blend: 0 = coin flip, 1 = huge mismatch.
  function gapStrength(adjusted){ return Math.abs(adjusted - 0.5) * 2; }

  function matchAdjustedProb(match){
    const home = teamById(match.home), away = teamById(match.away);
    const exp = eloExpected(home.elo + state.config.homeAdvantage, away.elo);
    return adjustedProbability(exp, state.config.surpriseFactor);
  }

  // Scorelines get bigger when the favorite wins as expected, and stay narrow on upsets — the way real surprise results tend to look.
  function goalsForOutcome(outcome, adjusted){
    const g = gapStrength(adjusted);
    const favoriteIsHome = adjusted >= 0.5;
    if(outcome === 'draw'){
      const base = poissonRandom(0.9 + (1 - g) * 0.7);
      return [base, base];
    }
    const winnerIsFavorite = (outcome === 'home' && favoriteIsHome) || (outcome === 'away' && !favoriteIsHome);
    let margin, loserGoals;
    if(winnerIsFavorite){
      margin = 1 + poissonRandom(0.3 + g * 1.6);
      loserGoals = poissonRandom(0.5 + (1 - g) * 0.8);
    } else {
      margin = 1 + (Math.random() < (0.15 + (1 - g) * 0.1) ? 1 : 0);
      loserGoals = poissonRandom(0.9);
    }
    const winnerGoals = loserGoals + margin;
    return outcome === 'home' ? [winnerGoals, loserGoals] : [loserGoals, winnerGoals];
  }

  function simulateResult(match){
    const adjusted = matchAdjustedProb(match);
    const g = gapStrength(adjusted);
    // draws get rarer as the gap widens — a huge favorite is less likely to be held, though never impossible
    const drawProb = state.config.drawProb * (0.2 + 0.8 * (1 - g));
    const pHome = adjusted * (1 - drawProb);
    const pAway = (1 - adjusted) * (1 - drawProb);
    const roll = Math.random();
    let outcome;
    if(roll < pHome) outcome = 'home';
    else if(roll < pHome + pAway) outcome = 'away';
    else outcome = 'draw';
    if(!state.config.allowDraws && outcome === 'draw'){
      outcome = Math.random() < adjusted ? 'home' : 'away';
    }
    return goalsForOutcome(outcome, adjusted);
  }

  // ---------- Round robin ----------
  function roundRobinRounds(teamIds){
    let ids = teamIds.slice();
    if(ids.length % 2 !== 0) ids.push(null);
    const n = ids.length;
    const rounds = [];
    for(let r=0; r<n-1; r++){
      const roundMatches = [];
      for(let i=0; i<n/2; i++){
        const a = ids[i], b = ids[n-1-i];
        if(a !== null && b !== null){
          if(r % 2 === 0) roundMatches.push({home:a, away:b});
          else roundMatches.push({home:b, away:a});
        }
      }
      rounds.push(roundMatches);
      const fixed = ids[0];
      const rest = ids.slice(1);
      rest.unshift(rest.pop());
      ids = [fixed, ...rest];
    }
    return rounds;
  }

  function buildFirstKnockoutRound(seededIds){
    let ids = seededIds.slice();
    let size = 1;
    while(size < ids.length) size *= 2;
    while(ids.length < size) ids.push(null);
    const round1 = [];
    for(let i=0; i<size/2; i++){
      round1.push({home: ids[i], away: ids[size-1-i]});
    }
    return round1;
  }

  function seedTeamIds(){
    let ids = state.teams.map(t => t.id);
    if(state.config.seedMethod === 'elo'){
      ids = state.teams.slice().sort((a,b)=>b.elo-a.elo).map(t=>t.id);
    } else if(state.config.seedMethod === 'random'){
      ids = ids.slice();
      for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
    }
    return ids;
  }

  // ---------- Fixture generation ----------
  function generateFixture(){
    state.matches = [];
    state.matchCounter = 0;
    state.knockoutBuilt = false;
    state.swissRoundsPlayed = 0;
    state.playSeq = 0;
    state.fixtureNav = {};
    const cfg = state.config;

    if(cfg.format === 'liga'){
      const ids = seedTeamIds();
      let rounds = roundRobinRounds(ids);
      if(cfg.doubleRound){
        const mirrored = rounds.map(r => r.map(m => ({home:m.away, away:m.home})));
        rounds = rounds.concat(mirrored);
      }
      rounds.forEach((round, ri) => {
        round.forEach(m => {
          state.matches.push(mkMatch('liga', ri+1, null, m.home, m.away));
        });
      });
    }

    else if(cfg.format === 'grupos'){
      const ids = seedTeamIds();
      const groups = Array.from({length:cfg.numGroups}, ()=>[]);
      ids.forEach((id, i) => {
        // snake seeding for balance
        const cycle = Math.floor(i / cfg.numGroups);
        const posInCycle = i % cfg.numGroups;
        const g = (cycle % 2 === 0) ? posInCycle : (cfg.numGroups - 1 - posInCycle);
        groups[g].push(id);
      });
      groups.forEach((groupIds, gi) => {
        let rounds = roundRobinRounds(groupIds);
        if(cfg.doubleRound){
          const mirrored = rounds.map(r => r.map(m => ({home:m.away, away:m.home})));
          rounds = rounds.concat(mirrored);
        }
        rounds.forEach((round, ri) => {
          round.forEach(m => {
            state.matches.push(mkMatch('group', ri+1, gi, m.home, m.away));
          });
        });
      });
      state.groupsCount = cfg.numGroups;
    }

    else if(cfg.format === 'eliminacion'){
      const ids = seedTeamIds();
      buildKnockoutRoundFromPairs(buildFirstKnockoutRound(ids), 1);
      state.knockoutBuilt = true;
    }

    else if(cfg.format === 'suizo'){
      const ids = seedTeamIds();
      generateSwissRound(ids, 1);
    }

    state.step = 'fixture';
    render();
  }

  function mkMatch(stage, round, group, home, away, leg){
    if(home === null || away === null){
      // bye - auto process
      const m = { id: uid('m'), stage, round, group, leg: leg||1, home, away, homeScore:null, awayScore:null, played:true, bye:true };
      return m;
    }
    return { id: uid('m'), stage, round, group, leg: leg||1, home, away, homeScore:null, awayScore:null, played:false, bye:false };
  }

  function buildKnockoutRoundFromPairs(pairs, roundNum){
    const twoLegged = state.config.twoLegged && !isFinalRound(pairs.length);
    pairs.forEach(p => {
      if(p.home === null || p.away === null){
        state.matches.push(mkMatch('knockout', roundNum, null, p.home, p.away, 1));
      } else if(state.config.twoLegged){
        state.matches.push(mkMatch('knockout', roundNum, null, p.home, p.away, 1));
        state.matches.push(mkMatch('knockout', roundNum, null, p.away, p.home, 2));
      } else {
        state.matches.push(mkMatch('knockout', roundNum, null, p.home, p.away, 1));
      }
    });
  }
  function isFinalRound(){ return false; } // placeholder, ida/vuelta applies to all rounds incl. final

  function generateSwissRound(pairIds, roundNum){
    // pairIds already ordered by current standing/elo
    const played = new Set();
    state.matches.filter(m=>m.stage==='swiss').forEach(m=>{
      played.add(m.home+'|'+m.away); played.add(m.away+'|'+m.home);
    });
    const remaining = pairIds.slice();
    const pairs = [];
    while(remaining.length > 1){
      const a = remaining.shift();
      let idx = remaining.findIndex(b => !played.has(a+'|'+b));
      if(idx === -1) idx = 0;
      const b = remaining.splice(idx,1)[0];
      pairs.push({home:a, away:b});
    }
    if(remaining.length === 1){
      pairs.push({home:remaining[0], away:null});
    }
    pairs.forEach(p => state.matches.push(mkMatch('swiss', roundNum, null, p.home, p.away)));
  }

  // ---------- Standings ----------
  function computeStandings(teamIds, matchFilter){
    const rows = {};
    teamIds.forEach(id => {
      rows[id] = { id, pj:0, pg:0, pe:0, pp:0, gf:0, gc:0, pts:0 };
    });
    state.matches.filter(matchFilter).forEach(m => {
      if(!m.played || m.bye) return;
      if(!(m.home in rows) || !(m.away in rows)) return;
      const h = rows[m.home], a = rows[m.away];
      h.pj++; a.pj++;
      h.gf += m.homeScore; h.gc += m.awayScore;
      a.gf += m.awayScore; a.gc += m.homeScore;
      if(m.homeScore > m.awayScore){ h.pg++; a.pp++; h.pts += state.config.pointsWin; a.pts += state.config.pointsLoss; }
      else if(m.homeScore < m.awayScore){ a.pg++; h.pp++; a.pts += state.config.pointsWin; h.pts += state.config.pointsLoss; }
      else { h.pe++; a.pe++; h.pts += state.config.pointsDraw; a.pts += state.config.pointsDraw; }
    });
    const arr = Object.values(rows);
    arr.forEach(r => r.dg = r.gf - r.gc);
    arr.sort((x,y) => y.pts - x.pts || y.dg - x.dg || y.gf - x.gf || (teamById(y.id).elo - teamById(x.id).elo));
    return arr;
  }

  // Últimos 3 resultados de un equipo (G/E/P), en orden cronológico de juego.
  function computeForm(teamId, matchFilter){
    const involved = state.matches.filter(m => !m.bye && m.played && matchFilter(m) && (m.home===teamId || m.away===teamId));
    involved.sort((a,b) => (a.playedAt||0) - (b.playedAt||0));
    const last3 = involved.slice(-3);
    return last3.map(m => {
      const isHome = m.home === teamId;
      const gf = isHome ? m.homeScore : m.awayScore;
      const gc = isHome ? m.awayScore : m.homeScore;
      if(gf > gc) return 'G';
      if(gf < gc) return 'P';
      return 'E';
    });
  }

  function zoneForPosition(pos, zones){
    if(!zones || !zones.length) return null;
    return zones.find(z => pos >= z.from && pos <= z.to) || null;
  }

  // Badge de posición + forma reciente, usado en las filas del fixture.
  function renderPosForm(teamId, meta){
    if(!meta) return '';
    const pos = meta.posMap[teamId];
    if(!pos) return '';
    const zone = zoneForPosition(pos, meta.zones);
    const posColor = zone ? zone.color : 'var(--ink-dim)';
    const form = meta.formMap[teamId] || [];
    const formHtml = form.length
      ? form.map(r => `<span class="form-dot ${r==='G'?'pos':(r==='P'?'neg':'')}">${r}</span>`).join('')
      : '<span class="no-data">sin partidos</span>';
    return `<div class="pos-form"><span class="pos-badge" style="color:${posColor};border-color:${posColor};">#${pos}</span><span class="form-line">${formHtml}</span></div>`;
  }

  // ---------- Rendering ----------
  function render(){
    if(state.mode === 'carrera'){
      document.body.classList.add('carrera-mode');
      const c = state.career;
      const stepHtml = renderCarreraStep();
      const footer = `<footer style="text-align:center;color:var(--ink-dim);font-size:12px;padding:20px 0 30px;">Modo Carrera &middot; se simula y se guarda en tu navegador.</footer>`;
      let shellHtml;
      if(c.step === 'temporada'){
        shellHtml = `<div class="carrera-shell">
          ${renderCarreraSidebar()}
          <div class="cs-main">
            ${renderCarreraTopbar()}
            <div class="cs-content" id="stepContent">${stepHtml}${footer}</div>
          </div>
        </div>`;
      } else {
        shellHtml = `<div class="carrera-shell" style="display:block;">
          ${renderCarreraTopbar()}
          <div class="cs-content" id="stepContent" style="max-width:900px;margin:0 auto;">${stepHtml}${footer}</div>
        </div>`;
      }
      els.app.innerHTML = shellHtml;
      bindEvents();
      careerPersist();
      return;
    }
    document.body.classList.remove('carrera-mode');
    if(state.step !== 'menu') state.lastContentStep = state.step;
    let html = '';
    html += renderTopbar();
    html += '<div id="stepContent">';
    if(state.step === 'menu') html += renderMenuStep();
    else if(state.step === 'config') html += renderConfigStep();
    else if(state.step === 'teams') html += renderTeamsStep();
    else if(state.step === 'fixture') html += renderFixtureStep();
    else if(state.step === 'standings') html += renderStandingsStep();
    html += '</div>';
    html += '<footer>Generador de torneos por ELO &middot; todo se calcula y se guarda en tu navegador, nada se sube a un servidor.</footer>';
    els.app.innerHTML = html;
    bindEvents();
    if(state.tournamentId) persist();
  }

  function renderMenuStep(){
    const idx = loadIndex().sort((a,b) => b.updatedAt - a.updatedAt);
    const fmtLabels = { liga:'Liga', grupos:'Grupos + eliminación', eliminacion:'Eliminación directa', suizo:'Sistema suizo' };
    let rows = idx.map(t => {
      const d = new Date(t.updatedAt);
      const fecha = d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
      const summary = t.summary || {};
      return `<div class="menu-row">
        <div class="info">
          <strong>${escapeHtml(t.name)}</strong>
          <div class="meta">${fmtLabels[t.format] || t.format} &middot; ${summary.teamCount||0} equipos &middot; ${escapeHtml(summary.status||'')} &middot; actualizado ${fecha}</div>
        </div>
        <div class="actions">
          <button class="btn small primary" data-action="open-tournament" data-id="${t.id}">Abrir</button>
          <button class="btn small ghost" data-action="delete-tournament" data-id="${t.id}" title="Eliminar">Eliminar</button>
        </div>
      </div>`;
    }).join('');
    if(idx.length===0) rows = '<div class="empty">Todavía no guardaste ningún torneo. Creá el primero para empezar.</div>';
    return `
    <div class="panel">
      <h2>Mis torneos</h2>
      <p class="hint">Tus torneos se guardan automáticamente en este navegador a medida que trabajás en ellos. Podés tener varios en simultáneo.</p>
      <div>${rows}</div>
      <div class="btn-row">
        <button class="btn primary" data-action="new-tournament">Crear nuevo torneo</button>
      </div>
    </div>`;
  }

  function stepStatus(step){
    const order = ['config','teams','fixture','standings'];
    const cur = order.indexOf(state.step);
    const idx = order.indexOf(step);
    if(step === state.step) return 'active';
    if(idx < cur) return 'done';
    if(step === 'teams') return 'ok';
    if(step === 'fixture') return state.teams.length >= 2 ? 'ok' : 'locked';
    if(step === 'standings') return state.matches.length > 0 ? 'ok' : 'locked';
    return 'ok';
  }

  function renderTopbar(){
    if(state.step === 'menu'){
      return `<div class="topbar">
        <div class="topbar-head">
          <div>
            <h1>Generador de Torneos <span>&middot; ELO</span></h1>
            <p class="sub">Armá torneos con el formato que quieras y dejá que el ranking ELO decida las probabilidades. Guardá cuantos torneos quieras.</p>
          </div>
          <button class="btn ghost small" data-action="go-carrera">&#9917; Modo Carrera</button>
        </div>
      </div>`;
    }
    const steps = [
      {k:'config', n:1, label:'Configurar'},
      {k:'teams', n:2, label:'Equipos'},
      {k:'fixture', n:3, label:'Fixture'},
      {k:'standings', n:4, label:'Tabla'}
    ];
    let tabs = steps.map(s => {
      const status = stepStatus(s.k);
      const cls = ['tab'];
      if(status === 'active') cls.push('active');
      if(status === 'done') cls.push('done');
      if(status === 'locked') cls.push('locked');
      return `<div class="${cls.join(' ')}" data-goto="${s.k}"><span class="n">${s.n}</span>${s.label}</div>`;
    }).join('');
    return `<div class="topbar">
      <div class="topbar-head">
        <div>
          <h1>${escapeHtml(state.config.name || 'Torneo')} <span>&middot; ELO</span></h1>
          <p class="sub">Armá un torneo con el formato que quieras y dejá que el ranking ELO decida las probabilidades.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn ghost small" data-action="goto-menu">&larr; Mis torneos</button>
          <button class="btn ghost small" data-action="go-carrera">&#9917; Modo Carrera</button>
        </div>
      </div>
      <div class="tabs">${tabs}</div>
    </div>`;
  }

    const cfg = state.config;
    return `
    <div class="panel">
      <h2>Datos del torneo</h2>
      <p class="hint">Definí el nombre y el formato. Podés ajustar todo esto de nuevo antes de generar el fixture.</p>
      <div class="grid cols-2">
        <div class="field">
          <label>Nombre del torneo</label>
          <input type="text" id="cfgName" value="${escapeHtml(cfg.name)}">

            <option value="liga" ${cfg.format==='liga'?'selected':''}>Liga (todos contra todos)</option>

            <option value="eliminacion" ${cfg.format==='eliminacion'?'selected':''}>Eliminación directa</option>
            <option value="suizo" ${cfg.format==='suizo'?'selected':''}>Sistema suizo</option>
          </select>

    </div>

      <h2>Sistema de puntos</h2>

      <div class="grid cols-3">
        <div class="field"><label>Puntos por victoria</label><input type="number" id="cfgPtsWin" value="${cfg.pointsWin}"></div>
        <div class="field"><label>Puntos por empate</label><input type="number" id="cfgPtsDraw" value="${cfg.pointsDraw}"></div>
        <div class="field"><label>Puntos por derrota</label><input type="number" id="cfgPtsLoss" value="${cfg.pointsLoss}"></div>
      </div>
      <div class="checkline">

        <label for="cfgAllowDraws">Permitir empates como resultado</label>
      </div>
    </div>

    ${cfg.format === 'liga' || cfg.format === 'grupos' ? `
    <div class="panel">
      <h2>${cfg.format === 'grupos' ? 'Fase de grupos' : 'Formato de liga'}</h2>
      <div class="grid cols-2">
        <div class="checkline">
          <input type="checkbox" id="cfgDoubleRound" ${cfg.doubleRound?'checked':''}>
          <label for="cfgDoubleRound">Ida y vuelta (doble rueda)</label>
        </div>
        ${cfg.format === 'grupos' ? `
        <div></div>

        <div class="field"><label>Clasificados por grupo a eliminatoria</label><input type="number" id="cfgAdvance" min="1" value="${cfg.advancePerGroup}"></div>
        ` : ''}
      </div>
    </div>` : ''}

    ${cfg.format === 'eliminacion' || cfg.format === 'grupos' ? `
    <div class="panel">
      <h2>Eliminación directa</h2>
      <div class="checkline">
        <input type="checkbox" id="cfgTwoLegged" ${cfg.twoLegged?'checked':''}>
        <label for="cfgTwoLegged">Llaves de ida y vuelta</label>
      </div>
      <p class="hint">Si hay equipos de más, se asignan "byes" (pase directo) a los mejores ubicados según el método de siembra.</p>
    </div>` : ''}

    ${cfg.format === 'suizo' ? `
    <div class="panel">
      <h2>Sistema suizo</h2>
      <div class="field"><label>Cantidad de rondas</label><input type="number" id="cfgSwissRounds" min="1" value="${cfg.swissRounds}"></div>
      <p class="hint">En cada ronda se empareja a los equipos con puntaje similar, evitando repetir cruces ya jugados.</p>
    </div>` : ''}

    ${(cfg.format === 'liga' || cfg.format === 'grupos' || cfg.format === 'suizo') ? renderZonesPanel(cfg) : ''}

    <div class="panel">
      <h2>Motor ELO</h2>

      <div class="grid cols-3">
        <div class="field"><label>ELO inicial por defecto</label><input type="number" id="cfgDefaultElo" value="${cfg.defaultElo}"></div>
        <div class="field"><label>Factor K (sensibilidad)</label><input type="number" id="cfgKFactor" value="${cfg.kFactor}"></div>
        <div class="field"><label>Ventaja de local (puntos ELO)</label><input type="number" id="cfgHomeAdv" value="${cfg.homeAdvantage}"></div>

      <div class="grid cols-3" style="margin-top:16px;">

        </div>

          <input type="range" id="cfgSurprise" min="0" max="100" value="${cfg.surpriseFactor}">

        <div class="field">
          <label>Método de siembra para el fixture</label>
          <select id="cfgSeedMethod">
            <option value="elo" ${cfg.seedMethod==='elo'?'selected':''}>Por ranking ELO</option>

          </select>
        </div>
      </div>
      <p class="hint" style="margin:10px 0 0;">En 0% de sorpresas el favorito gana casi siempre que la diferencia de ELO sea grande, como marca el ranking. Subiendo el valor los partidos se sienten más parejos sin dejar de respetar quién es mejor.</p>
    </div>

    <div class="btn-row">
      <button class="btn primary" data-action="goto-teams">Continuar a equipos</button>
    </div>
    `;
  }

  function renderZonesPanel(cfg){
    const zones = cfg.zones || [];
    const rows = zones.map(z => `
      <div class="team-row">
        <span class="zone-swatch" style="background:${z.color};"></span>
        <span class="name">${escapeHtml(z.label)} <span style="color:var(--ink-dim);">(pos. ${z.from}${z.to!==z.from?`–${z.to}`:''})</span></span>
        <button data-action="remove-zone" data-id="${z.id}" title="Quitar">&times;</button>
      </div>`).join('');
    return `<div class="panel">
      <h2>Zonas de clasificación</h2>

        <div class="field"><label>Nombre de la zona</label><input type="text" id="newZoneLabel" placeholder="Ej: Copa Libertadores"></div>

          <div class="field" style="max-width:100px;"><label>Desde</label><input type="number" id="newZoneFrom" min="1" value="1"></div>
          <div class="field" style="max-width:100px;"><label>Hasta</label><input type="number" id="newZoneTo" min="1" value="4"></div>
        </div>
        <div class="field" style="max-width:110px;"><label>Color</label><input type="color" id="newZoneColor" value="#5A8F5A"></div>
      </div>
      <div class="btn-row" style="margin-top:12px;"><button class="btn" data-action="add-zone">Agregar zona</button></div>
      <div style="margin-top:16px;">${rows || '<div class="empty">Todavía no definiste zonas. La tabla se muestra sin colores especiales.</div>'}</div>
    </div>`;
  }

  function renderTeamsStep(){
    const cfg = state.config;
    let rows = state.teams.map(t => `
      <div class="team-row">
        <span class="name">${escapeHtml(t.name)}</span>
        <span class="elo num">${t.elo}</span>
        <button data-action="remove-team" data-id="${t.id}" title="Quitar">&times;</button>
      </div>`).join('');
    if(state.teams.length === 0) rows = '<div class="empty">Todavía no cargaste equipos. Agregá al menos dos para generar el fixture.</div>';

    const minNeeded = cfg.format === 'grupos' ? cfg.numGroups * 2 : 2;
    const canGenerate = state.teams.length >= minNeeded;

    return `
    <div class="panel">
      <h2>Equipos</h2>
      <p class="hint">Cargá los equipos con su ELO inicial. Si no sabés el rating, dejá el valor por defecto (${cfg.defaultElo}).</p>
      <div class="grid cols-3" style="align-items:end;">

      </div>
      <div style="margin-top:20px;">${rows}</div>
      ${state.teams.length > 0 ? `<div class="btn-row"><button class="btn ghost small" data-action="clear-teams">Vaciar lista</button></div>` : ''}
    </div>

    <div class="panel">
      <h2>Carga rápida</h2>
      <p class="hint">Pegá una lista, una línea por equipo, formato "Nombre, ELO" (el ELO es opcional).</p>
      <textarea id="bulkTeams" placeholder="Boca, 1620&#10;River, 1650&#10;Racing"></textarea>
      <div class="btn-row"><button class="btn" data-action="bulk-add">Cargar lista</button></div>
    </div>

    ${!canGenerate ? `<div class="msg warn">Necesitás al menos ${minNeeded} equipos para este formato${cfg.format==='grupos' ? ` (${cfg.numGroups} grupos)` : ''}.</div>` : ''}

    <div class="btn-row">
      <button class="btn ghost" data-action="goto-config">Volver a configuración</button>
      <button class="btn primary" data-action="generate-fixture" ${canGenerate ? '' : 'disabled'}>Generar fixture</button>
    </div>
    `;
  }

  function matchProbLabel(m){
    const home = teamById(m.home), away = teamById(m.away);
    if(!home || !away) return '';
    const adjusted = matchAdjustedProb(m);
    return Math.round(adjusted*100) + '%';
  }

  function renderMatchRow(m, meta){
    meta = meta || null;
    if(m.bye){
      const survivor = m.home !== null ? teamById(m.home) : teamById(m.away);
      return `<div class="match played">
        <div class="side">${survivor ? escapeHtml(survivor.name) : '&mdash;'}</div>
        <div></div>
        <div class="bye-note">pase libre</div>
        <div></div>
        <div class="side away"></div>
      </div>`;
    }
    const home = teamById(m.home), away = teamById(m.away);
    if(!home || !away) return '';
    const winnerHome = m.played && m.homeScore > m.awayScore;
    const winnerAway = m.played && m.awayScore > m.homeScore;
    return `<div class="match ${m.played?'played':''}" data-match="${m.id}">
      <div class="side ${winnerHome?'winner':''}">${escapeHtml(home.name)}<span class="elo-tag num">${home.elo}${m.played && m.deltaHome!==undefined ? ` <span class="delta ${m.deltaHome>0?'pos':(m.deltaHome<0?'neg':'')}">${m.deltaHome>=0?'+':''}${m.deltaHome}</span>`:''}</span>${renderPosForm(m.home, meta)}</div>
      <input type="number" min="0" class="score-input" data-role="home-score" value="${m.homeScore ?? ''}" ${m.played?'disabled':''}>
      <div class="vs">${m.played ? '&ndash;' : matchProbLabel(m)}</div>
      <input type="number" min="0" class="score-input" data-role="away-score" value="${m.awayScore ?? ''}" ${m.played?'disabled':''}>
      <div class="side away ${winnerAway?'winner':''}">${escapeHtml(away.name)}<span class="elo-tag num">${away.elo}${m.played && m.deltaAway!==undefined ? ` <span class="delta ${m.deltaAway>0?'pos':(m.deltaAway<0?'neg':'')}">${m.deltaAway>=0?'+':''}${m.deltaAway}</span>`:''}</span>${renderPosForm(m.away, meta)}</div>
      <div class="match-actions" style="grid-column:1/-1;justify-content:flex-end;">
        ${!m.played ? `<button class="btn small" data-action="simulate-match" data-id="${m.id}">Simular</button>
        <button class="btn small primary" data-action="confirm-match" data-id="${m.id}">Confirmar resultado</button>` : ''}
      </div>
    </div>`;
  }

  // ---------- Navegación fecha a fecha ----------
  function ensureRoundPointer(ctx, total){
    if(!state.fixtureNav) state.fixtureNav = {};
    let cur = state.fixtureNav[ctx];
    if(!cur || cur < 1) cur = 1;
    if(total > 0 && cur > total) cur = total;
    state.fixtureNav[ctx] = cur;
    return cur;
  }
  function renderRoundNav(ctx, current, total, labelPrefix, action){
    action = action || 'nav-round';
    if(total <= 1) return '';
    let options = '';
    for(let i=1; i<=total; i++){
      options += `<option value="${i}" ${i===current?'selected':''}>${labelPrefix} ${i}</option>`;
    }
    return `<div class="round-nav">
      <button class="btn small ghost" data-action="${action}" data-context="${ctx}" data-dir="prev" data-total="${total}" ${current<=1?'disabled':''}>&larr; Anterior</button>
      <select id="roundSelect_${ctx}">${options}</select>
      <button class="btn small ghost" data-action="${action}" data-context="${ctx}" data-dir="next" data-total="${total}" ${current>=total?'disabled':''}>Siguiente &rarr;</button>
    </div>`;
  }

  function renderFixtureStep(){
    const cfg = state.config;
    let body = '';

    if(cfg.format === 'liga'){
      const rounds = [...new Set(state.matches.map(m=>m.round))].sort((a,b)=>a-b);
      const total = rounds.length;
      const cur = ensureRoundPointer('liga', total);
      const ms = state.matches.filter(m=>m.round===cur);
      const ids = state.teams.map(t=>t.id);
      const anyPlayed = state.matches.some(m=>m.stage==='liga' && m.played && !m.bye);
      let meta = null;
      if(anyPlayed){
        const standings = computeStandings(ids, m=>m.stage==='liga');
        const posMap = {}; standings.forEach((r,i)=>posMap[r.id]=i+1);
        const formMap = {}; ids.forEach(id=>formMap[id]=computeForm(id, m=>m.stage==='liga'));
        meta = { posMap, formMap, zones: cfg.zones };
      }
      body += `<div class="round-header"><h3>Fecha ${cur} de ${total}</h3></div>`;
      body += renderRoundNav('liga', cur, total, 'Fecha');
      body += ms.map(m=>renderMatchRow(m, meta)).join('');
    }

    else if(cfg.format === 'grupos'){
      for(let g=0; g<state.groupsCount; g++){
        const groupMatches = state.matches.filter(m => m.stage==='group' && m.group===g);
        const rounds = [...new Set(groupMatches.map(m=>m.round))].sort((a,b)=>a-b);
        const total = rounds.length;
        const ctx = 'group-'+g;
        const cur = ensureRoundPointer(ctx, total);
        const ms = groupMatches.filter(m=>m.round===cur);
        const idsInGroup = [...new Set(groupMatches.flatMap(m=>[m.home,m.away]))];
        const anyPlayed = groupMatches.some(m=>m.played && !m.bye);
        let meta = null;
        if(anyPlayed){
          const standings = computeStandings(idsInGroup, m=>m.stage==='group'&&m.group===g);
          const posMap = {}; standings.forEach((r,i)=>posMap[r.id]=i+1);
          const formMap = {}; idsInGroup.forEach(id=>formMap[id]=computeForm(id, m=>m.stage==='group'&&m.group===g));
          meta = { posMap, formMap, zones: cfg.zones };
        }
        body += `<div class="group-block"><h3>Grupo ${String.fromCharCode(65+g)}</h3>`;
        body += `<div class="round-header"><h3 style="color:var(--ink-dim);font-size:12.5px;">Fecha ${cur} de ${total}</h3></div>`;
        body += renderRoundNav(ctx, cur, total, 'Fecha');
        body += ms.map(m=>renderMatchRow(m, meta)).join('');
        body += `</div>`;
      }
      const groupsDone = allGroupMatchesPlayed();
      if(groupsDone && !state.knockoutBuilt){
        body += `<div class="btn-row"><button class="btn primary" data-action="build-knockout-from-groups">Generar fase eliminatoria</button></div>`;
      }
      if(state.knockoutBuilt){
        body += renderKnockoutSection();
      }
    }

    else if(cfg.format === 'eliminacion'){
      body += renderKnockoutSection();
    }

    else if(cfg.format === 'suizo'){
      const rounds = [...new Set(state.matches.filter(m=>m.stage==='swiss').map(m=>m.round))].sort((a,b)=>a-b);
      const total = rounds.length;
      const cur = ensureRoundPointer('swiss', total);
      const ms = state.matches.filter(m=>m.stage==='swiss' && m.round===cur);
      const ids = state.teams.map(t=>t.id);
      const anyPlayed = state.matches.some(m=>m.stage==='swiss' && m.played && !m.bye);
      let meta = null;
      if(anyPlayed){
        const standings = computeStandings(ids, m=>m.stage==='swiss');
        const posMap = {}; standings.forEach((r,i)=>posMap[r.id]=i+1);
        const formMap = {}; ids.forEach(id=>formMap[id]=computeForm(id, m=>m.stage==='swiss'));
        meta = { posMap, formMap, zones: cfg.zones };
      }
      body += `<div class="round-header"><h3>Ronda ${cur} de ${total}</h3></div>`;
      body += renderRoundNav('swiss', cur, total, 'Ronda');
      body += ms.map(m=>renderMatchRow(m, meta)).join('');
      const lastRound = rounds[rounds.length-1] || 0;
      const lastRoundDone = state.matches.filter(m=>m.stage==='swiss' && m.round===lastRound).every(m=>m.played);
      if(lastRoundDone && lastRound < cfg.swissRounds){
        body += `<div class="btn-row"><button class="btn primary" data-action="next-swiss-round">Generar ronda ${lastRound+1}</button></div>`;
      } else if(lastRoundDone && lastRound >= cfg.swissRounds){
        body += `<div class="msg" style="background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.4);color:var(--gold-bright);">Sistema suizo completo. Mirá la tabla final para ver al campeón.</div>`;
      }
    }

    return `
    <div class="panel">
      <h2>Fixture y resultados</h2>
      <p class="hint">Cargá los resultados a mano o dejá que la simulación los resuelva según la probabilidad ELO.</p>
      <div class="btn-row" style="margin-top:0;margin-bottom:18px;">
        <button class="btn" data-action="simulate-all">Simular todos los pendientes</button>
      </div>
      ${body}
    </div>
    <div class="step-nav">
      <button class="btn ghost" data-action="goto-teams">Volver a equipos</button>
      <button class="btn primary" data-action="goto-standings">Ver tabla</button>
    </div>
    `;
  }

  function allGroupMatchesPlayed(){
    return state.matches.filter(m=>m.stage==='group').every(m=>m.played);
  }

  function renderKnockoutSection(){
    const rounds = [...new Set(state.matches.filter(m=>m.stage==='knockout').map(m=>m.round))].sort((a,b)=>a-b);
    let html = '<div class="bracket">';
    rounds.forEach(r => {
      const ms = state.matches.filter(m=>m.stage==='knockout' && m.round===r && m.leg===1);
      const total = ms.length;
      const label = roundLabel(total, r, rounds.length);
      html += `<div class="bracket-round"><div class="rlabel">${label}</div>`;
      ms.forEach(m => {
        html += renderBracketMatchCard(m);
      });
      html += `</div>`;
    });
    html += '</div>';

    // lista de partidos de la ronda actual (el cuadro de arriba siempre muestra todas las rondas)
    let listHtml = '';
    if(rounds.length){
      const total = rounds.length;
      const cur = ensureRoundPointer('knockout', total);
      const r = rounds[cur-1];
      const ms = state.matches.filter(m=>m.stage==='knockout' && m.round===r && !m.bye);
      if(ms.length){
        const label = roundLabel(state.matches.filter(x=>x.stage==='knockout'&&x.round===r&&x.leg===1).length, r, total);
        listHtml += `<div class="round-header"><h3>${label} &mdash; partidos</h3></div>`;
        listHtml += renderRoundNav('knockout', cur, total, 'Ronda');
        listHtml += ms.map(m => renderMatchRow(m, null)).join('');
      }
    }

    const lastRound = rounds[rounds.length-1];
    const lastRoundMatches = state.matches.filter(m=>m.stage==='knockout' && m.round===lastRound);
    const lastRoundDone = lastRoundMatches.every(m=>m.played);
    const isFinal = lastRoundMatches.filter(m=>m.leg===1).length === 1;
    let advanceBtn = '';
    if(lastRoundDone && !isFinal){
      advanceBtn = `<div class="btn-row"><button class="btn primary" data-action="next-knockout-round" data-round="${lastRound}">Generar siguiente ronda</button></div>`;
    }

    return html + listHtml + advanceBtn;
  }

  function roundLabel(matchCount, roundNum, totalRounds){
    if(matchCount === 1) return 'Final';
    if(matchCount === 2) return 'Semifinales';
    if(matchCount === 4) return 'Cuartos de final';
    if(matchCount === 8) return 'Octavos de final';
    return 'Ronda ' + roundNum;
  }

  function knockoutWinner(m){
    if(m.bye) return m.home !== null ? m.home : m.away;
    if(state.config.twoLegged){
      const leg2 = state.matches.find(x => x.stage==='knockout' && x.round===m.round && x.leg===2 && x.home===m.away && x.away===m.home);
      if(!leg2 || !leg2.played || !m.played) return null;
      const aggHome = m.homeScore + leg2.awayScore; // m.home's total
      const aggAway = m.awayScore + leg2.homeScore; // m.away's total
      if(aggHome === aggAway){
        const h = teamById(m.home), a = teamById(m.away);
        return h.elo >= a.elo ? m.home : m.away;
      }
      return aggHome > aggAway ? m.home : m.away;
    }
    if(!m.played) return null;
    if(m.homeScore === m.awayScore){
      const h = teamById(m.home), a = teamById(m.away);
      return h.elo >= a.elo ? m.home : m.away;
    }
    return m.homeScore > m.awayScore ? m.home : m.away;
  }

  function renderBracketMatchCard(m){
    const home = teamById(m.home), away = m.away !== null ? teamById(m.away) : null;
    if(m.bye || m.away === null){
      return `<div class="bracket-match"><div class="r bye">${home ? escapeHtml(home.name) : '?'} (pase libre)</div></div>`;
    }
    const winner = knockoutWinner(m);
    let aggNote = '';
    if(state.config.twoLegged){
      const leg2 = state.matches.find(x => x.stage==='knockout' && x.round===m.round && x.leg===2 && x.home===m.away && x.away===m.home);
      if(m.played && leg2 && leg2.played){
        aggNote = `<div style="font-size:10.5px;color:var(--ink-dim);margin-top:4px;">Ida ${m.homeScore}-${m.awayScore} · Vuelta ${leg2.homeScore}-${leg2.awayScore}</div>`;
      }
    }
    return `<div class="bracket-match">
      <div class="r ${winner===m.home?'win':''}">${home?escapeHtml(home.name):'?'} ${m.played?`<span class="num">${m.homeScore}</span>`:''}</div>
      <div class="r ${winner===m.away?'win':''}">${away?escapeHtml(away.name):'?'} ${m.played?`<span class="num">${m.awayScore}</span>`:''}</div>
      ${aggNote}
    </div>`;
  }

  function renderStandingsStep(){
    const cfg = state.config;
    let body = '';
    let championName = null;

    if(cfg.format === 'liga'){
      const ids = state.teams.map(t=>t.id);
      const standings = computeStandings(ids, m => m.stage==='liga');
      body += renderStandingsTable(standings, ids.length > 0 && state.matches.length>0 && state.matches.every(m=>m.played), cfg.zones);
      if(standings.length && state.matches.length>0 && state.matches.every(m=>m.played)) championName = teamById(standings[0].id).name;
    }

    else if(cfg.format === 'grupos'){
      for(let g=0; g<state.groupsCount; g++){
        const idsInGroup = [...new Set(state.matches.filter(m=>m.stage==='group'&&m.group===g).flatMap(m=>[m.home,m.away]))];
        const standings = computeStandings(idsInGroup, m => m.stage==='group' && m.group===g);
        body += `<div class="group-block"><h3>Grupo ${String.fromCharCode(65+g)}</h3>` + renderStandingsTable(standings, false, cfg.zones) + `</div>`;
      }
      if(state.knockoutBuilt){
        body += `<div class="panel" style="margin-top:0;"><h2>Fase eliminatoria</h2>` + renderKnockoutBracketOnly() + `</div>`;
        const finalRound = Math.max(...state.matches.filter(m=>m.stage==='knockout').map(m=>m.round));
        const finalMatches = state.matches.filter(m=>m.stage==='knockout' && m.round===finalRound);
        if(finalMatches.length && finalMatches.filter(x=>x.leg===1).length===1){
          const fm = finalMatches.find(x=>x.leg===1);
          const w = knockoutWinner(fm);
          if(w) championName = teamById(w).name;
        }
      } else {
        body += `<div class="msg">Todavía no se generó la fase eliminatoria. Terminá la fase de grupos primero.</div>`;
      }
    }

    else if(cfg.format === 'eliminacion'){
      body += renderKnockoutBracketOnly();
      const rounds = [...new Set(state.matches.filter(m=>m.stage==='knockout').map(m=>m.round))];
      if(rounds.length){
        const finalRound = Math.max(...rounds);
        const finalMatches = state.matches.filter(m=>m.stage==='knockout' && m.round===finalRound && m.leg===1);
        if(finalMatches.length===1){
          const w = knockoutWinner(finalMatches[0]);
          if(w) championName = teamById(w).name;
        }
      }
    }

    else if(cfg.format === 'suizo'){
      const ids = state.teams.map(t=>t.id);
      const standings = computeStandings(ids, m => m.stage==='swiss');
      const allRoundsDone = state.matches.filter(m=>m.stage==='swiss').length>0 &&
        [...new Set(state.matches.filter(m=>m.stage==='swiss').map(m=>m.round))].length >= cfg.swissRounds &&
        state.matches.filter(m=>m.stage==='swiss').every(m=>m.played);
      body += renderStandingsTable(standings, allRoundsDone, cfg.zones);
      if(allRoundsDone && standings.length) championName = teamById(standings[0].id).name;
    }

    // ranking ELO general
    const eloRanking = state.teams.slice().sort((a,b)=>b.elo-a.elo);
    body += `<div class="panel"><h2>Ranking ELO actual</h2>
      <table><thead><tr><th>#</th><th>Equipo</th><th>ELO inicial</th><th>ELO actual</th><th>Variación</th></tr></thead><tbody>
      ${eloRanking.map((t,i)=>{
        const diff = t.elo - t.initialElo;
        return `<tr><td>${i+1}</td><td>${escapeHtml(t.name)}</td><td class="num">${t.initialElo}</td><td class="num" style="color:var(--gold);">${t.elo}</td><td class="num" style="color:${diff>0?'var(--green-win)':(diff<0?'var(--red)':'var(--ink-dim)')}">${diff>=0?'+':''}${diff}</td></tr>`;
      }).join('')}
      </tbody></table>
    </div>`;

    let championHtml = '';
    if(championName){
      championHtml = `<div class="champion-banner"><div class="label">Campeón del torneo</div><div class="name">${escapeHtml(championName)}</div></div>`;
    }

    return `
    ${championHtml}
    ${body}
    <div class="btn-row">
      <button class="btn ghost" data-action="goto-fixture">Volver al fixture</button>
      <button class="btn" data-action="export-csv">Exportar CSV</button>
      <button class="btn ghost" data-action="reset-all">Reiniciar torneo</button>
    </div>
    `;
  }

  function renderKnockoutBracketOnly(){
    const rounds = [...new Set(state.matches.filter(m=>m.stage==='knockout').map(m=>m.round))].sort((a,b)=>a-b);
    if(rounds.length===0) return '<div class="empty">Sin eliminatorias generadas.</div>';
    let html = '<div class="bracket">';
    rounds.forEach(r => {
      const ms = state.matches.filter(m=>m.stage==='knockout' && m.round===r && m.leg===1);
      html += `<div class="bracket-round"><div class="rlabel">${roundLabel(ms.length, r, rounds.length)}</div>`;
      ms.forEach(m => html += renderBracketMatchCard(m));
      html += `</div>`;
    });
    return html + '</div>';
  }

  function renderStandingsTable(standings, highlightTop, zones, resolver){
    zones = zones || [];
    resolver = resolver || teamById;
    if(standings.length === 0) return '<div class="empty">Sin datos todavía.</div>';
    const rows = standings.map((r,i)=>{
      const t = resolver(r.id);
      const zone = zoneForPosition(i+1, zones);
      const zoneColor = zone ? zone.color : null;
      return `<tr class="${(i<3 && !zone)?'top3':''}">
        <td><span class="pos-pill" style="${zoneColor?`background:${zoneColor}22;color:${zoneColor};border-color:${zoneColor};`:''}">${i+1}</span></td>
        <td><div style="display:flex;align-items:center;gap:8px;">${teamBadgeHtml(t,20)}<span>${escapeHtml(t.name)}</span></div></td>
        <td class="num">${r.pj}</td><td class="num">${r.pg}</td><td class="num">${r.pe}</td><td class="num">${r.pp}</td><td class="num">${r.gf}</td><td class="num">${r.gc}</td><td class="num">${r.dg}</td><td class="num" style="color:var(--gold);">${r.pts}</td><td class="num">${t.elo}</td>
      </tr>`;
    }).join('');
    const legend = zones.length ? `<div class="zone-legend">${zones.map(z=>`<span class="zone-chip"><i style="background:${z.color};"></i>${escapeHtml(z.label)} (${z.from}${z.to!==z.from?'–'+z.to:''})</span>`).join('')}</div>` : '';
    return `<div class="table-scroll"><table><thead><tr>
      <th>#</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th><th>ELO</th>
      </tr></thead><tbody>${rows}</tbody></table></div>${legend}`;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Events ----------
  function bindEvents(){
    els.app.addEventListener('click', onClick);
    els.app.addEventListener('change', onChange);
    const rangeEl = document.getElementById('cfgDrawProb');
    if(rangeEl){
      rangeEl.addEventListener('input', () => {
        state.config.drawProb = Number(rangeEl.value)/100;
        const lbl = rangeEl.previousElementSibling;
        if(lbl) lbl.textContent = `Probabilidad base de empate: ${Math.round(state.config.drawProb*100)}%`;
      });
    }
    const surpriseEl = document.getElementById('cfgSurprise');
    if(surpriseEl){
      surpriseEl.addEventListener('input', () => {
        state.config.surpriseFactor = Number(surpriseEl.value);
        const lbl = surpriseEl.previousElementSibling;
        if(lbl) lbl.textContent = `Posibilidad de sorpresas: ${state.config.surpriseFactor}%`;
      });
    }
  }

  function onChange(e){
    if(e.target.hasAttribute && e.target.hasAttribute('data-career-elo')){
      const tid = e.target.getAttribute('data-career-elo');
      const t = careerTeamById(tid);
      if(t) t.elo = Number(e.target.value) || t.elo;
      return;
    }
    const id = e.target.id;
    if(!id) return;
    if(id.startsWith('roundSelect_')){
      const ctx = id.slice('roundSelect_'.length);
      if(ctx.startsWith('career-')){
        if(!state.career.fixtureNav) state.career.fixtureNav = {};
        state.career.fixtureNav[ctx] = Number(e.target.value) || 1;
      } else {
        if(!state.fixtureNav) state.fixtureNav = {};
        state.fixtureNav[ctx] = Number(e.target.value) || 1;
      }
      render();
      return;
    }
    const cfg = state.config;
    if(id==='cfgName') cfg.name = e.target.value;
    else if(id==='cfgFormat'){ cfg.format = e.target.value; render(); }
    else if(id==='cfgPtsWin') cfg.pointsWin = Number(e.target.value);
    else if(id==='cfgPtsDraw') cfg.pointsDraw = Number(e.target.value);
    else if(id==='cfgPtsLoss') cfg.pointsLoss = Number(e.target.value);
    else if(id==='cfgAllowDraws') cfg.allowDraws = e.target.checked;
    else if(id==='cfgDoubleRound') cfg.doubleRound = e.target.checked;
    else if(id==='cfgNumGroups') cfg.numGroups = Math.max(2, Number(e.target.value)||2);
    else if(id==='cfgAdvance') cfg.advancePerGroup = Math.max(1, Number(e.target.value)||1);
    else if(id==='cfgTwoLegged') cfg.twoLegged = e.target.checked;
    else if(id==='cfgSwissRounds') cfg.swissRounds = Math.max(1, Number(e.target.value)||1);
    else if(id==='cfgDefaultElo') cfg.defaultElo = Number(e.target.value)||1500;

  function buildKnockoutFromGroups(){
    const cfg = state.config;
    const qualifiers = [];
    for(let g=0; g<state.groupsCount; g++){
      const idsInGroup = [...new Set(state.matches.filter(m=>m.stage==='group'&&m.group===g).flatMap(m=>[m.home,m.away]))];
      const standings = computeStandings(idsInGroup, m => m.stage==='group' && m.group===g);
      standings.slice(0, cfg.advancePerGroup).forEach((s, rank) => qualifiers.push({id:s.id, rank}));
    }
    // order qualifiers: all group-leaders first (by elo desc), then runners-up, etc.
    qualifiers.sort((a,b) => a.rank - b.rank || (teamById(b.id).elo - teamById(a.id).elo));
    const ids = qualifiers.map(q=>q.id);
    buildKnockoutRoundFromPairs(buildFirstKnockoutRound(ids), 1);
    state.knockoutBuilt = true;
  }

  function advanceKnockoutRound(round){
    const currentMatches = state.matches.filter(m=>m.stage==='knockout' && m.round===round && m.leg===1);
    const winners = currentMatches.map(m => knockoutWinner(m));
    const pairs = [];
    for(let i=0;i<winners.length;i+=2){
      pairs.push({home: winners[i], away: winners[i+1] !== undefined ? winners[i+1] : null});
    }
    buildKnockoutRoundFromPairs(pairs, round+1);
  }

  function exportCSV(){
    let csv = 'Equipo,ELO inicial,ELO actual\n';
    state.teams.forEach(t => { csv += `${csvSafe(t.name)},${t.initialElo},${t.elo}\n`; });
    csv += '\nEtapa,Ronda/Grupo,Local,Visitante,Goles Local,Goles Visitante\n';
    state.matches.filter(m=>!m.bye).forEach(m => {
      const h = teamById(m.home), a = teamById(m.away);
      if(!h||!a) return;
      const roundLbl = m.stage==='group' ? `Grupo ${String.fromCharCode(65+m.group)} - Fecha ${m.round}` : (m.stage==='knockout' ? `Ronda ${m.round} (leg ${m.leg})` : `Fecha/Ronda ${m.round}`);
      csv += `${m.stage},${csvSafe(roundLbl)},${csvSafe(h.name)},${csvSafe(a.name)},${m.homeScore ?? ''},${m.awayScore ?? ''}\n`;
    });
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (state.config.name || 'torneo').replace(/[^a-z0-9]+/gi,'_') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function csvSafe(s){
    s = String(s);
    if(s.includes(',') || s.includes('"')) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
