  function careerPickForeignTeams(n, excludeNames){
    excludeNames = excludeNames || [];
    let pool = CAREER_EXTERIOR_TEAMS.filter(t=>!excludeNames.includes(t.name));
    if(pool.length < n) pool = CAREER_EXTERIOR_TEAMS.slice();
    const picks = shuffleArr(pool.slice()).slice(0, n);
    return picks.map((t,i) => ({ id:'ext'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+i, name:t.name, elo:t.elo, division:'exterior', country:t.country }));
  }
  // Equipos argentinos clasificados a cada copa según el mismo criterio que ya se mostraba en
  // "Clasificación a Copas Internacionales": Libertadores = campeones de Apertura y Clausura,
  // 1°-2°-3° de la Tabla Anual y el campeón de la Copa Argentina. Sudamericana = 4° al 10° de la
  // Tabla Anual (excluyendo a los que ya clasificaron a la Libertadores).
  function careerLibertadoresArgQualifiers(){
    const c = state.career;
    const annual = careerAnnualTable();
    const libertadores = [];
    const aptChamp = careerGetTitle(c.year,'apertura');
    const clzChamp = careerGetTitle(c.year,'clausura');
    if(aptChamp) libertadores.push(aptChamp);
    if(clzChamp && !libertadores.includes(clzChamp)) libertadores.push(clzChamp);
    annual.slice(0,3).forEach(r => { if(!libertadores.includes(r.id)) libertadores.push(r.id); });
    const copaChamp = (c.copaArgentina && c.copaArgentina.champion && c.copaArgentina.champion.year===c.year) ? c.copaArgentina.champion.teamId : null;
    if(copaChamp && !libertadores.includes(copaChamp)) libertadores.push(copaChamp);
    return libertadores;
  }
  function careerSudamericanaArgQualifiers(){
    const annual = careerAnnualTable();
    const libertadores = careerLibertadoresArgQualifiers();
    return annual.slice(3,10).map(r=>r.id).filter(id=>!libertadores.includes(id));
  }
  function careerBuildContinentalCup(cupKey, argIds){
    const c = state.career;
    const need = Math.max(0, 16 - argIds.length);
    const foreign = careerPickForeignTeams(need, []);
    c[cupKey] = { foreignTeams: foreign, matches: [], built: true, champion: null };
    const pool = argIds.concat(foreign.map(t=>t.id));
    const seeded = shuffleArr(pool.slice());
    const pairs = buildFirstKnockoutRound(seeded);
    const date = nextWeekdayAfter(c.calendarDate || careerSeasonStart(c.year, c.tournament), 3);
    pairs.forEach(p => c[cupKey].matches.push(careerMkMatch(cupKey, null, 1, p.home, p.away, {stage:'octavos', neutral:true, date})));
  }
  function careerBuildLibertadores(){
    const c = state.career;
    if(c.libertadores && c.libertadores.built) return;
    careerBuildContinentalCup('libertadores', careerLibertadoresArgQualifiers());
  }
  function careerBuildSudamericana(){
    const c = state.career;
    if(c.sudamericana && c.sudamericana.built) return;
    const argIds = careerSudamericanaArgQualifiers();
    const need = Math.max(0, 16 - argIds.length);
    const usedForeignNames = (c.libertadores && c.libertadores.foreignTeams) ? c.libertadores.foreignTeams.map(t=>t.name) : [];
    const foreign = careerPickForeignTeams(need, usedForeignNames);
    c.sudamericana = { foreignTeams: foreign, matches: [], built: true, champion: null };
    const pool = argIds.concat(foreign.map(t=>t.id));
    const seeded = shuffleArr(pool.slice());
    const pairs = buildFirstKnockoutRound(seeded);
    const date = nextWeekdayAfter(c.calendarDate || careerSeasonStart(c.year, c.tournament), 3);
    pairs.forEach(p => c.sudamericana.matches.push(careerMkMatch('sudamericana', null, 1, p.home, p.away, {stage:'octavos', neutral:true, date})));
  }
  function careerAdvanceContinental(cupKey, fromStage){
    const c = state.career;
    const bucket = c[cupKey];
    if(!bucket) return;
    const stages = CONTINENTAL_STAGES;
    const nextStage = stages[stages.indexOf(fromStage)+1];
    if(!nextStage) return;
    const matches = bucket.matches.filter(m=>m.stage===fromStage);
    const winners = matches.map(m=>careerMatchWinner(m));
    const fromDate = (matches.length && matches[0].date) ? matches[0].date : c.calendarDate;
    const date = addDaysISO(fromDate, 14);
    const pairs = [];
    for(let i=0;i<winners.length;i+=2) pairs.push({ home: winners[i], away: winners[i+1] });
    const round = stages.indexOf(nextStage)+1;
    pairs.forEach(p => bucket.matches.push(careerMkMatch(cupKey, null, round, p.home, p.away, {stage:nextStage, neutral:true, date})));
  }

  function careerTeamById(id){
    let t = state.career.teams.find(t=>t.id===id);
    if(t) return t;
    const extras = [
      state.career.nacional && state.career.nacional.teams,
      state.career.bmetro && state.career.bmetro.teams,
      state.career.federal && state.career.federal.teams,
      state.career.primerac && state.career.primerac.teams,
      state.career.promocional && state.career.promocional.teams
    ];
    for(let i=0;i<extras.length;i++){
      if(!extras[i]) continue;
      t = extras[i].find(x=>x.id===id);
      if(t) return t;
    }
    if(state.career.copaArgentina && state.career.copaArgentina.otherTeams){
      t = state.career.copaArgentina.otherTeams.find(t=>t.id===id);
      if(t) return t;
    }
    if(state.career.libertadores && state.career.libertadores.foreignTeams){
      t = state.career.libertadores.foreignTeams.find(t=>t.id===id);
      if(t) return t;
    }
    if(state.career.sudamericana && state.career.sudamericana.foreignTeams){
      t = state.career.sudamericana.foreignTeams.find(t=>t.id===id);
      if(t) return t;
    }
    return null;
  }
  function careerUid(prefix){ return prefix + (state.career.matchCounter++); }

  function careerMkMatch(comp, zone, round, home, away, extra){
    extra = extra || {};
    const base = { id: careerUid('cm'), comp, zone, round, home, away, homeScore:null, awayScore:null, played:false, bye:false };
    if(home === null || away === null){ base.played = true; base.bye = true; }
    return Object.assign(base, extra);
  }

  function careerEloExpected(a,b){ return 1/(1+Math.pow(10,(b-a)/400)); }

  function careerMatchAdjustedProb(m){
    const home = careerTeamById(m.home), away = careerTeamById(m.away);
    const adv = m.neutral ? 0 : state.career.engine.homeAdvantage;
    const exp = careerEloExpected(home.elo + adv, away.elo);
    return adjustedProbability(exp, state.career.engine.surpriseFactor);
  }

  function careerSimulateResult(m){
    const adjusted = careerMatchAdjustedProb(m);
    const g = gapStrength(adjusted);
    const drawProb = state.career.engine.drawProb * (0.2 + 0.8*(1-g));
    const pHome = adjusted * (1-drawProb);
    const pAway = (1-adjusted) * (1-drawProb);
    const roll = Math.random();
    let outcome;
    if(roll < pHome) outcome = 'home';
    else if(roll < pHome+pAway) outcome = 'away';
    else outcome = 'draw';
    if(!state.career.engine.allowDraws && outcome==='draw'){
      outcome = Math.random() < adjusted ? 'home' : 'away';
    }
    return goalsForOutcome(outcome, adjusted);
  }

  function careerApplyEloUpdate(m){
    const home = careerTeamById(m.home), away = careerTeamById(m.away);
    if(!home || !away) return;
    const adv = m.neutral ? 0 : state.career.engine.homeAdvantage;
    const expHome = careerEloExpected(home.elo+adv, away.elo);
    const expAway = 1-expHome;
    let sHome;
    if(m.homeScore > m.awayScore) sHome = 1;
    else if(m.homeScore < m.awayScore) sHome = 0;
    else sHome = 0.5;
    const sAway = 1-sHome;
    const k = state.career.engine.kFactor;
    const dH = Math.round(k*(sHome-expHome));
    const dA = Math.round(k*(sAway-expAway));
    home.elo += dH; away.elo += dA;
    m.deltaHome = dH; m.deltaAway = dA;
  }

  // En los octavos, cuartos, semis y final del formato real no hay alargue: empate en 90' va directo a penales.
  function resolvePenaltiesWinner(m){
    const adjusted = careerMatchAdjustedProb(m);
    const tilted = 0.5 + (adjusted-0.5) * 0.3; // los penales son casi un cara o ceca
    return Math.random() < tilted ? m.home : m.away;
  }
  // Los penales solo se patean en partido único sin ventaja deportiva.
  // Una serie de ida y vuelta se define por el global, nunca por un empate suelto.
  function careerMatchNeedsPenalties(m){
    if(!m.stage) return false;
    if(m.leg) return false;
    if(m.advantage) return false;
    return true;
  }
  function careerMatchWinner(m){
    if(m.homeScore > m.awayScore) return m.home;
    if(m.awayScore > m.homeScore) return m.away;
    return m.penaltyWinner || m.advantage || null;
  }

  function careerComputeStandings(teamIds, matchFilter){
    return careerComputeStandingsFrom(state.career.matches.filter(matchFilter), teamIds);
  }

  function careerComputeStandingsFrom(list, teamIds){
    const rows = {};
    teamIds.forEach(id => { rows[id] = { id, pj:0, pg:0, pe:0, pp:0, gf:0, gc:0, pts:0 }; });
    list.forEach(m => {
      if(!m.played || m.bye) return;
      if(rows[m.home]){
        const r = rows[m.home];
        r.pj++; r.gf += m.homeScore; r.gc += m.awayScore;
        if(m.homeScore > m.awayScore){ r.pg++; r.pts += 3; }
        else if(m.homeScore < m.awayScore){ r.pp++; }
        else { r.pe++; r.pts += 1; }
      }
      if(rows[m.away]){
        const r = rows[m.away];
        r.pj++; r.gf += m.awayScore; r.gc += m.homeScore;
        if(m.awayScore > m.homeScore){ r.pg++; r.pts += 3; }
        else if(m.awayScore < m.homeScore){ r.pp++; }
        else { r.pe++; r.pts += 1; }
      }
    });
    const arr = Object.values(rows);
    arr.forEach(r => r.dg = r.gf - r.gc);
    arr.sort((x,y) => y.pts - x.pts || y.dg - x.dg || y.gf - x.gf || (careerTeamById(y.id).elo - careerTeamById(x.id).elo));
    return arr;
  }

  function careerComputeForm(teamId, matchFilter){
    const involved = state.career.matches.filter(m => !m.bye && m.played && matchFilter(m) && (m.home===teamId || m.away===teamId));
    involved.sort((a,b) => (a.playedAt||0) - (b.playedAt||0));
    return involved.slice(-3).map(m => {
      const isHome = m.home === teamId;
      const gf = isHome ? m.homeScore : m.awayScore;
      const gc = isHome ? m.awayScore : m.homeScore;
      if(gf > gc) return 'G';
      if(gf < gc) return 'P';
      return 'E';
    });
  }

  function shuffleArr(arr){
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  }

  // Cruces interzonales que se jugaron en el Apertura de este año (ya archivado), para
  // repetirlos en el Clausura con la localía invertida.
  function careerAperturaInterzonalPairs(){
    const c = state.career;
    const apertura = (c.history || []).find(h => h.year === c.year && h.tournament === 'apertura');
    if(!apertura) return null;
    return apertura.matches.filter(m => m.interzonal && !m.bye).map(m => ({ home: m.home, away: m.away }));
  }

  function careerGenerateTournament(){
    const c = state.career;
    c.matches = [];
    c.knockout = [];
    c.knockoutBuilt = false;
    c.matchCounter = 0;
    c.playSeq = 0;
    c.fixtureNav = {};
    c.champion = null;

    const seasonStart = careerSeasonStart(c.year, c.tournament);
    const dateForRound = (ri) => addDaysISO(seasonStart, (ri-1)*7);

    const zoneA = c.teams.filter(t=>t.zone===0).map(t=>t.id);
    const zoneB = c.teams.filter(t=>t.zone===1).map(t=>t.id);
    let maxRounds = 0;

    // El fixture del Clausura usa el mismo cruce de partidos que el Apertura, pero con las
    // localías invertidas: quien jugó de local en el Apertura visita en el Clausura.
    const esClausura = c.tournament === 'clausura';
    [zoneA, zoneB].forEach((zoneIds, zi) => {
      if(zoneIds.length < 2) return;
      const rounds = roundRobinRounds(zoneIds);
      rounds.forEach((round, ri) => {
        round.forEach(mm => {
          const home = esClausura ? mm.away : mm.home;
          const away = esClausura ? mm.home : mm.away;
          c.matches.push(careerMkMatch(c.tournament, zi, ri+1, home, away, {date: dateForRound(ri+1)}));
        });
      });
      maxRounds = Math.max(maxRounds, rounds.length);
    });

    // Fecha interzonal: en el Apertura se sortea un rival de la otra zona; en el Clausura
    // se repiten esos mismos cruces con la localía invertida.
    if(zoneA.length && zoneB.length){
      const interRound = maxRounds + 1;
      const interDate = dateForRound(interRound);
      const aperturaInter = esClausura ? careerAperturaInterzonalPairs() : null;
      if(aperturaInter && aperturaInter.length){
        aperturaInter.forEach(p => {
          c.matches.push(careerMkMatch(c.tournament, null, interRound, p.away, p.home, {interzonal:true, date: interDate}));
        });
      } else {
        const shuffledA = shuffleArr(zoneA.slice());
        const shuffledB = shuffleArr(zoneB.slice());
        const n = Math.min(shuffledA.length, shuffledB.length);
        for(let i=0;i<n;i++){
          const homeIsA = Math.random() < 0.5;
          const home = homeIsA ? shuffledA[i] : shuffledB[i];
          const away = homeIsA ? shuffledB[i] : shuffledA[i];
          c.matches.push(careerMkMatch(c.tournament, null, interRound, home, away, {interzonal:true, date: interDate}));
        }
      }
    }
    c.calendarDate = addDaysISO(seasonStart, -1);
    careerEnsureNacional();
    c.step = 'temporada';
  }

  function careerBuildPlayoffs(){
    const c = state.career;
    const zoneA = c.teams.filter(t=>t.zone===0).map(t=>t.id);
    const zoneB = c.teams.filter(t=>t.zone===1).map(t=>t.id);
    const standA = careerComputeStandings(zoneA, m=>m.comp===c.tournament).slice(0,8).map(r=>r.id);
    const standB = careerComputeStandings(zoneB, m=>m.comp===c.tournament).slice(0,8).map(r=>r.id);
    const ligaDates = c.matches.filter(m=>m.comp===c.tournament && m.date).map(m=>m.date).sort();
    const lastLigaDate = ligaDates.length ? ligaDates[ligaDates.length-1] : c.calendarDate;
    const date = addDaysISO(lastLigaDate, 14);
    const pairs = [];
    for(let i=0;i<4;i++) pairs.push({ home: standB[i], away: standA[7-i] });   // 8°A vs 1°B ... 5°A vs 4°B (local: mejor ubicado)
    for(let i=0;i<4;i++) pairs.push({ home: standA[i], away: standB[7-i] });   // 8°B vs 1°A ... 5°B vs 4°A
    pairs.forEach(p => c.knockout.push(careerMkMatch(c.tournament, null, 1, p.home, p.away, {stage:'octavos', neutral:false, date})));
    c.knockoutBuilt = true;
    if(!c.fixtureNav) c.fixtureNav = {};
    c.fixtureNav['career-playoffs'] = 1;
  }

  function careerAdvancePlayoffs(fromStage){
    const c = state.career;
    const stages = ['octavos','cuartos','semis','final'];
    const roundsMap = {octavos:1, cuartos:2, semis:3, final:4};
    const nextStage = stages[stages.indexOf(fromStage)+1];
    if(!nextStage) return;
    const matches = c.knockout.filter(m=>m.stage===fromStage);
    const winners = matches.map(m=>careerMatchWinner(m));
    const fromDate = (matches.length && matches[0].date) ? matches[0].date : c.calendarDate;
    const date = addDaysISO(fromDate, 14);
    const nextPairs = [];
    for(let i=0;i<winners.length;i+=2) nextPairs.push({ home: winners[i], away: winners[i+1] });
    nextPairs.forEach(p => c.knockout.push(careerMkMatch(c.tournament, null, roundsMap[nextStage], p.home, p.away, {stage:nextStage, neutral:true, date})));
  }

  // ---------- Historial de títulos ----------
  function careerRecordTitle(competition, teamId){
    const c = state.career;
    if(!c.titles) c.titles = [];
    const team = careerTeamById(teamId);
    c.titles.push({ year: c.year, competition, teamId, teamName: team ? team.name : null });
  }
  function careerGetTitle(year, competition){
    const c = state.career;
    const found = (c.titles||[]).filter(x=>x.year===year && x.competition===competition);
    return found.length ? found[found.length-1].teamId : null;

  function checkCareerChampion(m){
    if(!m || !m.played || m.stage !== 'final') return;
    const winner = careerMatchWinner(m);
    if(m.comp === 'copa-argentina'){
      if(!state.career.copaArgentina) return;
      state.career.copaArgentina.champion = { year: state.career.year, teamId: winner };
      careerRecordTitle('copa-argentina', winner);
    } else if(m.comp === 'apertura' || m.comp === 'clausura'){
      state.career.champion = { tournament: m.comp, year: state.career.year, teamId: winner };
      careerRecordTitle(m.comp, winner);
    } else if(m.comp === 'trofeo-campeones' || m.comp === 'supercopa-argentina' || m.comp === 'supercopa-internacional'){
      careerRecordTitle(m.comp, winner);
    } else if(m.comp === 'libertadores'){
      if(!state.career.libertadores) return;
      state.career.libertadores.champion = { year: state.career.year, teamId: winner };
      careerRecordTitle('libertadores', winner);
    } else if(m.comp === 'sudamericana'){
      if(!state.career.sudamericana) return;
      state.career.sudamericana.champion = { year: state.career.year, teamId: winner };
      careerRecordTitle('sudamericana', winner);
    }
  }

  // ---------- Tabla Anual / Tabla de Promedios / Descensos ----------
  function careerMatchPointsRow(matches, id){
    let pts=0,pj=0,pg=0,pe=0,pp=0,gf=0,gc=0;
    matches.forEach(m => {
      if(m.bye || !m.played) return;
      if(m.home === id){
        pj++; gf+=m.homeScore; gc+=m.awayScore;
        if(m.homeScore>m.awayScore){ pg++; pts+=3; } else if(m.homeScore<m.awayScore){ pp++; } else { pe++; pts+=1; }
      } else if(m.away === id){
        pj++; gf+=m.awayScore; gc+=m.homeScore;
        if(m.awayScore>m.homeScore){ pg++; pts+=3; } else if(m.awayScore<m.homeScore){ pp++; } else { pe++; pts+=1; }
      }
    });
    return { pts, pj, pg, pe, pp, gf, gc };
  }

  function careerAnnualTable(){
    const c = state.career;
    const allIds = c.teams.map(t=>t.id);
    const aperturaHist = (c.history||[]).find(h=>h.year===c.year && h.tournament==='apertura');
    const aperturaMatches = c.tournament === 'apertura' ? c.matches : (aperturaHist ? aperturaHist.matches : []);
    const clausuraMatches = c.tournament === 'clausura' ? c.matches : [];
    const rows = allIds.map(id => {
      const a = careerMatchPointsRow(aperturaMatches, id);
      const cl = careerMatchPointsRow(clausuraMatches, id);
      return {
        id, pts:a.pts+cl.pts, pj:a.pj+cl.pj, pg:a.pg+cl.pg, pe:a.pe+cl.pe, pp:a.pp+cl.pp,
        gf:a.gf+cl.gf, gc:a.gc+cl.gc, dg:(a.gf+cl.gf)-(a.gc+cl.gc)
      };
    });
    rows.sort((x,y) => y.pts-x.pts || y.dg-x.dg || y.gf-x.gf || careerTeamById(y.id).elo-careerTeamById(x.id).elo);
    return rows;
  }

  function careerPromediosTable(){
    const c = state.career;
    const annual = careerAnnualTable();
    const map = {}; annual.forEach(r=>map[r.id]=r);
    const rows = c.teams.map(t => {
      const log = (c.seasonLog && c.seasonLog[t.id]) ? c.seasonLog[t.id].slice(-2) : [];
      const cur = map[t.id] || {pts:0,pj:0};
      const totalPts = log.reduce((s,x)=>s+x.pts,0) + cur.pts;
      const totalPj = log.reduce((s,x)=>s+x.pj,0) + cur.pj;
      return { id: t.id, avg: totalPj>0 ? totalPts/totalPj : 0, totalPj };
    });
    rows.sort((x,y) => y.avg-x.avg || careerTeamById(y.id).elo-careerTeamById(x.id).elo);
    return rows;
  }

  function careerComputeDescensos(){
    const annual = careerAnnualTable();
    const promedios = careerPromediosTable();
    if(annual.length < 2 || promedios.length < 2){
      return { annual, promedios, relegated: [], relegatedAnnual: [], relegatedPromedios: [] };
    }
    const lastAnnual = annual[annual.length-1].id;
    const lastProm = promedios[promedios.length-1].id;
    let relegated, relegatedPromedios;
    if(lastAnnual === lastProm){
      // Mismo equipo último en las dos tablas: ese desciende por la Tabla Anual, y el segundo
      // descenso pasa a ser el penúltimo de la Tabla de Promedios (se marca ahí, además del último).
      const secondLastProm = promedios[promedios.length-2].id;
      relegated = [lastAnnual, secondLastProm];
      relegatedPromedios = [lastProm, secondLastProm];
    } else {
      // Caso normal: uno por tabla, cada una marca solo su propio último puesto.
      relegated = [lastAnnual, lastProm];
      relegatedPromedios = [lastProm];
    }
    return { annual, promedios, relegated, relegatedAnnual: [lastAnnual], relegatedPromedios };
  }

  function renderAnnualTable(rows, relegatedIds){
